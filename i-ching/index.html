<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">

<title>想你时卦起</title>
<style>
:root{
  --bg:#d8c4a4;--paper:#f2e5ce;--paper2:#e3c9a2;--ink:#22160e;--ink2:#6b4f36;--ink3:#9a7d5a;
  --line:#23160d;--accent:#9f3c24;--earth:#7a4c2e;--gold:#bd8a45;--frame:#2a190f;--hair:rgba(58,36,20,.17);
  --sans:"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:
  radial-gradient(circle at 14% 8%,rgba(255,238,191,.34),transparent 24%),
  radial-gradient(circle at 86% 12%,rgba(108,63,31,.22),transparent 30%),
  linear-gradient(145deg,#c7aa7d 0%,#ead9bd 44%,#b99060 100%);
  color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;background-image:
  repeating-linear-gradient(90deg,rgba(70,42,20,.055) 0 1px,transparent 1px 7px),
  repeating-linear-gradient(0deg,rgba(255,248,232,.16) 0 1px,transparent 1px 5px),
  radial-gradient(circle at 50% 20%,rgba(255,255,255,.22),transparent 42%);
  background-size:21px 21px,17px 17px,100% 100%}
.wrap{position:relative;width:100%;max-width:500px;margin:clamp(14px,4vw,34px) 0;padding:clamp(22px,6vw,38px) clamp(18px,5vw,34px) 34px;background:
  linear-gradient(180deg,rgba(250,238,213,.93),rgba(226,199,158,.92));
  border:1px solid rgba(58,36,20,.22);box-shadow:0 30px 90px rgba(69,43,20,.24),inset 0 1px 0 rgba(255,250,236,.82)}
.wrap::before{content:"";position:absolute;inset:10px;border:1px solid rgba(122,76,46,.18);pointer-events:none}
.top{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding-bottom:18px;border-bottom:1px solid var(--hair)}
.brand{font-size:clamp(25px,7vw,38px);font-weight:800;letter-spacing:.04em;line-height:1.05}
.brand small{display:block;margin-top:8px;font:600 10px/1 var(--mono);letter-spacing:.28em;color:var(--earth);text-transform:uppercase}
.mark{display:grid;place-items:center;width:46px;height:46px;border:1.5px solid var(--accent);color:var(--accent);font:700 18px/1 var(--sans);letter-spacing:.04em;transform:rotate(-4deg);flex:none}
.tag{font-size:13px;color:var(--ink2);letter-spacing:.12em;margin:14px 0 22px}
.omen-art{position:relative;height:128px;margin:2px 0 16px;border:1px solid rgba(58,36,20,.13);overflow:hidden;background:
  radial-gradient(circle at 50% 44%,rgba(255,248,226,.72),transparent 34%),
  radial-gradient(circle at 50% 46%,rgba(122,76,46,.12),transparent 58%),
  linear-gradient(135deg,rgba(255,246,224,.52),rgba(156,101,57,.12)),
  repeating-linear-gradient(90deg,rgba(80,48,25,.045) 0 1px,transparent 1px 8px)}
.omen-art::before{content:"";position:absolute;left:50%;top:50%;width:106px;height:106px;border:1px solid rgba(42,25,15,.22);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 18px rgba(122,76,46,.045),0 0 0 38px rgba(122,76,46,.025)}
.omen-art::after{content:"";position:absolute;left:50%;top:50%;width:154px;height:154px;border-radius:50%;transform:translate(-50%,-50%);background:
  radial-gradient(circle at 50% 0%,rgba(42,25,15,.45) 0 3px,transparent 4px),
  radial-gradient(circle at 100% 50%,rgba(159,60,36,.42) 0 3px,transparent 4px),
  radial-gradient(circle at 50% 100%,rgba(42,25,15,.32) 0 3px,transparent 4px),
  radial-gradient(circle at 0% 50%,rgba(189,138,69,.48) 0 3px,transparent 4px);
  pointer-events:none}
.taiji-wrap{position:absolute;left:50%;top:20px;width:72px;height:72px;transform:translateX(-50%)}
.taiji{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(42,25,15,.55);
  background:conic-gradient(var(--ink) 0 50%,var(--paper) 0 100%);animation:turn 42s linear infinite;box-shadow:0 14px 30px rgba(63,39,20,.16)}
.taiji::before,.taiji::after{content:"";position:absolute;left:50%;width:50%;height:50%;border-radius:50%;transform:translateX(-50%)}
.taiji::before{top:0;background:radial-gradient(circle,var(--paper) 0 17%,var(--ink) 18% 100%)}
.taiji::after{bottom:0;background:radial-gradient(circle,var(--ink) 0 17%,var(--paper) 18% 100%)}
@keyframes turn{to{transform:rotate(360deg)}}
.stage{position:relative;padding:14px 0 4px}
.stage::before{content:"";position:absolute;left:50%;top:-2px;width:min(84vw,360px);aspect-ratio:1;border:1px solid rgba(122,76,46,.14);border-radius:50%;transform:translateX(-50%);pointer-events:none}
.frame{position:relative;width:min(70vw,288px);aspect-ratio:5/6;border:1.5px solid var(--frame);background:
  linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0)),
  var(--paper);margin:0 auto;padding:min(5.5vw,24px);box-shadow:0 18px 40px rgba(33,25,14,.12),inset 0 0 0 8px rgba(200,155,78,.08)}
.bars{display:flex;flex-direction:column-reverse;gap:min(2.6vw,12px);height:100%}
.ln{flex:1;display:flex;gap:min(3.4vw,15px);min-height:0}
.ln i{flex:1;background:var(--line);border-radius:3px;box-shadow:0 1px 0 rgba(255,255,255,.28) inset}
.ln.pending i{background:var(--hair)}
.ln.c i{background:var(--accent)}
.ln.reveal{animation:rev .34s ease both}
@keyframes rev{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.coins{display:flex;gap:9px;justify-content:center;height:12px;margin:16px 0 2px;opacity:0;transition:opacity .25s}
.coins.active{opacity:1}
.tok{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink2);transition:background .12s,border-color .12s}
.tok.on{background:var(--ink);border-color:var(--ink)}
.tok.flip{animation:tflip .16s linear}
@keyframes tflip{50%{transform:scale(.35)}}
.meta{text-align:center;margin-top:18px;min-height:52px}
.meta .no{font:600 11px/1 var(--mono);letter-spacing:.2em;color:var(--accent)}
.meta .nm{font-size:30px;font-weight:700;letter-spacing:.03em;margin:7px 0 3px}
.meta .py{font-size:13px;font-style:italic;letter-spacing:.1em;color:var(--ink3);margin:0 0 6px}
.meta .tri{font-size:12.5px;color:var(--ink3);letter-spacing:.06em}
.meta .hint{font-size:13px;color:var(--ink3);letter-spacing:.06em;padding-top:16px}
.cast{display:block;width:100%;margin:26px 0 6px;padding:17px;border:1px solid rgba(21,19,15,.9);background:linear-gradient(135deg,#17140f,#2b2418);color:#fff9ec;font:800 15px/1 var(--sans);letter-spacing:.55em;text-indent:.55em;cursor:pointer;transition:.18s;touch-action:manipulation;box-shadow:0 14px 30px rgba(21,19,15,.18)}
.cast:active{transform:translateY(1px)}
.cast:disabled{opacity:.4}
@media(hover:hover){.cast:hover{background:linear-gradient(135deg,#7a4c2e,#3b2416);border-color:#7a4c2e}}
.analysis{margin-top:28px;padding-top:24px;border-top:1px solid var(--hair)}
.analysis[hidden]{display:none}
.guaB{margin-bottom:4px}
.row1{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.row1 .no{font:600 11px/1 var(--mono);letter-spacing:.16em;color:var(--accent)}
.row1 .nm{font-size:24px;font-weight:700}
.row1 .py{font-size:13px;font-style:italic;color:var(--ink3);letter-spacing:.05em}
.row1 .nm.sm{font-size:19px}
.row1 .lab{font:600 9.5px/1 var(--mono);letter-spacing:.22em;color:var(--ink3);margin-left:auto;text-transform:uppercase}
.gist{font-size:15px;color:var(--ink);line-height:1.8;margin:9px 0}
.compose{font-size:12.5px;color:var(--ink3);line-height:1.7;letter-spacing:.04em}
.judge{font-size:13.5px;color:var(--ink2);line-height:1.8;margin:9px 0;padding-left:12px;border-left:2px solid var(--hair)}
.advice{display:flex;gap:11px;align-items:baseline;margin-top:12px;font-size:14.5px;line-height:1.7;color:var(--ink)}
.advice .albl{font:600 10px/1.6 var(--sans);letter-spacing:.1em;color:var(--accent);border:1px solid var(--accent);padding:2px 7px;white-space:nowrap;flex:none}
.more{margin-top:14px;border-top:1px solid var(--hair);padding-top:9px}
.more summary{font:600 11px/1 var(--mono);letter-spacing:.12em;color:var(--ink3);cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:7px}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"+";font:600 13px/1 var(--mono);color:var(--accent)}
.more[open] summary::before{content:"\2013"}
.more summary:hover{color:var(--ink2)}
.dl{display:flex;gap:11px;font-size:13px;color:var(--ink2);line-height:1.75;margin-top:9px}
.dl .dk{font:600 10px/1.6 var(--mono);letter-spacing:.08em;color:var(--ink3);min-width:28px;flex:none}
.dl b{color:var(--accent);font-weight:700}
.changes{font-size:13px;color:var(--ink2);letter-spacing:.04em;margin:18px 0 0}
.changes b{color:var(--accent);font-weight:700}
.mini{width:64px;height:78px;border:1px solid rgba(25,21,15,.75);background:var(--paper);padding:8px;flex:none;margin-top:3px;box-shadow:0 8px 18px rgba(25,21,15,.08)}
.mini .bars{gap:4px}.mini .ln{gap:6px}
.guaCard{display:flex;gap:16px;padding:16px 0}
.gbody{flex:1;min-width:0}
.chead{display:flex;align-items:baseline;gap:10px}
.chead .lab{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.14em}
.chead .no{font:600 10px/1 var(--mono);letter-spacing:.14em;color:var(--ink3);margin-left:auto}
.nmrow{display:flex;align-items:baseline;gap:9px;margin:5px 0 7px}
.nmrow .nm{font-size:23px;font-weight:700;line-height:1.1}
.nmrow .py{font-size:13px;font-style:italic;color:var(--ink3);letter-spacing:.05em}
.tolink{display:flex;align-items:center;gap:9px;margin:14px 0;color:var(--accent);
  font:600 11px/1 var(--mono);letter-spacing:.16em}
.tolink::before,.tolink::after{content:"";flex:1;height:1px;background:var(--hair)}
.staticNote{display:flex;gap:12px;align-items:baseline;font-size:13.5px;color:var(--ink3);line-height:1.7}
.staticNote .lab{font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.14em;flex:none}
.hist{margin-top:30px;padding:18px 0 0;border-top:1px solid var(--hair)}
.hist-h{display:flex;justify-content:space-between;font:600 10.5px/1 var(--mono);letter-spacing:.22em;color:var(--ink3);text-transform:uppercase;margin-bottom:8px}
.hist-h .clr{cursor:pointer;border-bottom:1px solid var(--hair)}
.hist ul{list-style:none}
.hist li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--hair);font-size:13.5px}
.hist li:last-child{border-bottom:none}
.hist .hg{font-weight:700}.hist .ht{color:var(--accent)}
.hist .t{font:11px var(--mono);color:var(--ink3)}
.hist .empty{color:var(--ink3);font-size:13px;padding:5px 0}
.disclaimer{margin-top:22px;padding:14px 16px;border:1px solid rgba(185,65,45,.16);background:rgba(185,65,45,.045);font-size:12px;line-height:1.75;color:var(--ink2);letter-spacing:.03em}
@media(max-width:420px){.wrap{margin:0;min-height:100dvh;border-left:0;border-right:0}.mark{width:40px;height:40px;font-size:16px}.stage::before{width:82vw}.guaCard{gap:12px}.mini{width:56px;height:70px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">想你时卦起<small>I Ching Casting</small></div><div class="mark">易</div></div>
  <div class="tag">学习自然的规律</div>
  <div class="omen-art" aria-hidden="true">
    <div class="taiji-wrap"><div class="taiji"></div></div>
  </div>
  <div class="stage">
    <div class="frame"><div class="bars" id="bars"></div></div>
    <div class="coins" id="coins"><span class="tok"></span><span class="tok"></span><span class="tok"></span></div>
    <div class="meta" id="meta"><div class="hint">静心默念所占之事，轻触起卦</div></div>
  </div>
  <button class="cast" id="castBtn">起 卦</button>
  <section class="analysis" id="panel" hidden><div id="analysis"></div></section>
  <section class="hist">
    <div class="hist-h"><span>历史 / History</span><span class="clr" id="clr">清空</span></div>
    <ul id="histList"><li class="empty">暂无记录</li></ul>
  </section>
  <p class="disclaimer">仅供娱乐和学习，不能替代专业谘询或建议，人生的決定，終究掌握在你自己手裡。</p>
</div>
<script>
const TRI={乾:{bits:"111",sym:"天",wu:"金"},坤:{bits:"000",sym:"地",wu:"土"},震:{bits:"100",sym:"雷",wu:"木"},艮:{bits:"001",sym:"山",wu:"土"},坎:{bits:"010",sym:"水",wu:"水"},离:{bits:"101",sym:"火",wu:"火"},巽:{bits:"011",sym:"风",wu:"木"},兑:{bits:"110",sym:"泽",wu:"金"}};
const RAW=[
 [1,"乾","乾","乾","元亨利贞。","刚健中正，自强不息，大通而宜守正。"],
 [2,"坤","坤","坤","元亨，利牝马之贞。","柔顺厚载，容物有终，宜随顺守正。"],
 [3,"屯","坎","震","元亨利贞，勿用有攸往，利建侯。","初生艰难，蓄势待发，宜守正立基。"],
 [4,"蒙","艮","坎","亨。匪我求童蒙，童蒙求我。","蒙昧待启，宜虚心求教，以正启蒙。"],
 [5,"需","坎","乾","有孚，光亨，贞吉，利涉大川。","待时而动，守信守正，不可躁进。"],
 [6,"讼","乾","坎","有孚窒惕，中吉，终凶。","争讼难安，宜慎防化解，不宜久争。"],
 [7,"师","坤","坎","贞，丈人吉，无咎。","兴师用众，宜正而有德者统之。"],
 [8,"比","坎","坤","吉。原筮，元永贞，无咎。","亲比相辅，宜择善而从，诚信相处。"],
 [9,"小畜","巽","乾","亨。密云不雨，自我西郊。","小有蓄积，力量尚弱，宜积累待时。"],
 [10,"履","乾","兑","履虎尾，不咥人，亨。","如履虎尾，谨慎而行则通。"],
 [11,"泰","坤","乾","小往大来，吉亨。","天地交泰，通达顺遂，宜趁势而为。"],
 [12,"否","乾","坤","否之匪人，不利君子贞，大往小来。","闭塞不通，宜守正待变，韬光养晦。"],
 [13,"同人","乾","离","同人于野，亨，利涉大川。","与人和同，公而无私则通。"],
 [14,"大有","离","乾","元亨。","大有所得，光明丰盛，宜守德不骄。"],
 [15,"谦","坤","艮","亨，君子有终。","谦虚自持，有始有终，受益无穷。"],
 [16,"豫","震","坤","利建侯行师。","顺时而动，和乐振奋，宜顺势而为。"],
 [17,"随","兑","震","元亨利贞，无咎。","随顺时势，守正相随则无咎。"],
 [18,"蛊","艮","巽","元亨，利涉大川。","积弊待治，宜整饬革新。"],
 [19,"临","坤","兑","元亨利贞，至于八月有凶。","阳气渐长，临事而治，宜把握时机。"],
 [20,"观","巽","坤","盥而不荐，有孚颙若。","观察省思，以诚示人，宜静观其变。"],
 [21,"噬嗑","离","震","亨，利用狱。","咬合去梗，宜明断是非，排除阻碍。"],
 [22,"贲","艮","离","亨，小利有攸往。","文饰修美，宜适度而不失其本。"],
 [23,"剥","艮","坤","不利有攸往。","阴盛阳衰，宜静守，不可妄动。"],
 [24,"复","坤","震","亨。出入无疾，反复其道，七日来复。","阳气复来，生机再起，宜顺时而进。"],
 [25,"无妄","乾","震","元亨利贞。其匪正有眚。","不妄为则通，守正则吉，妄动则灾。"],
 [26,"大畜","艮","乾","利贞，不家食吉，利涉大川。","大有蓄养，宜厚积而后发。"],
 [27,"颐","艮","震","贞吉。观颐，自求口实。","养正则吉，宜慎言节食，自养养人。"],
 [28,"大过","兑","巽","栋桡，利有攸往，亨。","非常之时，宜担当任重，审慎而行。"],
 [29,"坎","坎","坎","习坎，有孚，维心亨，行有尚。","重险当前，宜守诚信，以心通险。"],
 [30,"离","离","离","利贞，亨。畜牝牛吉。","附丽光明，宜守中正，柔顺则吉。"],
 [31,"咸","兑","艮","亨，利贞，取女吉。","感应交融，宜以虚受人，守正则吉。"],
 [32,"恒","震","巽","亨，无咎，利贞，利有攸往。","恒久守常，持之以恒则利。"],
 [33,"遁","乾","艮","亨，小利贞。","知时而退，宜适时隐遁，守小则利。"],
 [34,"大壮","震","乾","利贞。","阳刚壮盛，宜守正，不可恃强妄动。"],
 [35,"晋","离","坤","康侯用锡马蕃庶，昼日三接。","上进光明，宜积极进取，前途光明。"],
 [36,"明夷","坤","离","利艰贞。","光明受伤，宜内守正道，韬晦待时。"],
 [37,"家人","巽","离","利女贞。","治家有道，宜各正其位，内外有序。"],
 [38,"睽","离","兑","小事吉。","乖违暌离，宜求同存异，小事可成。"],
 [39,"蹇","坎","艮","利西南，不利东北，利见大人，贞吉。","蹇难当前，宜守正待援，见大人则吉。"],
 [40,"解","震","坎","利西南。","险难消解，宜及时纾困，从宽处置。"],
 [41,"损","艮","兑","有孚，元吉，无咎。","减损有度，损下益上，守诚则吉。"],
 [42,"益","巽","震","利有攸往，利涉大川。","损上益下，有所增益，宜把握良机。"],
 [43,"夬","兑","乾","扬于王庭，孚号有厉。","决断除恶，宜光明果决，警惕戒慎。"],
 [44,"姤","乾","巽","女壮，勿用取女。","不期而遇，阴长当慎，宜防微杜渐。"],
 [45,"萃","兑","坤","亨，王假有庙，利见大人。","聚合荟萃，宜聚众守正，见大人则利。"],
 [46,"升","坤","巽","元亨，用见大人，勿恤。","渐次上升，宜积小成大，前进则吉。"],
 [47,"困","兑","坎","亨，贞，大人吉，无咎。","困顿受制，宜守正自处，处困不失其志。"],
 [48,"井","坎","巽","改邑不改井。","养而不穷，宜修身济人，守常有恒。"],
 [49,"革","兑","离","巳日乃孚，元亨利贞，悔亡。","变革除旧，宜顺时而变，守正则吉。"],
 [50,"鼎","离","巽","元吉，亨。","鼎新成器，宜稳重图新，养贤纳福。"],
 [51,"震","震","震","亨。震来虩虩，笑言哑哑。","震动惊惧，宜临危不乱，反省自警。"],
 [52,"艮","艮","艮","艮其背，不获其身。","适时而止，宜静定守分，知止不殆。"],
 [53,"渐","巽","艮","女归吉，利贞。","循序渐进，宜按部就班，守正则吉。"],
 [54,"归妹","震","兑","征凶，无攸利。","嫁娶失序，宜审慎守分，妄动则凶。"],
 [55,"丰","震","离","亨，王假之，勿忧，宜日中。","盛大丰满，宜守中持盈，防盛极而衰。"],

const numCN=["","初","二","三","四","五","上"];
function yaoName(pos,yang){const v=yang?"九":"六";if(pos===1)return "初"+v;if(pos===6)return "上"+v;return v+numCN[pos];}
function tossLine(){let s=0,f=[];for(let i=0;i<3;i++){const y=Math.random()<0.5;f.push(y);s+=y?3:2;}return{yang:(s===7||s===9),changing:(s===6||s===9),type:{6:"老阴",7:"少阳",8:"少阴",9:"老阳"}[s],faces:f};}
function lookup(b){return HEX[b]||{num:"?",name:"未知",up:"",low:"",judge:"",gist:""};}
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function barsHTML(lines,mark){return lines.map(l=>`<div class="ln ${l.yang?'y':'n'}${mark&&l.changing?' c':''}">${l.yang?'<i></i>':'<i></i><i></i>'}</div>`).join('');}
function placeholder(){$('bars').innerHTML=Array.from({length:6}).map(()=>'<div class="ln y pending"><i></i></div>').join('');}
let busy=false;const history=[];
async function cast(){
  if(busy)return;busy=true;const btn=$('castBtn');btn.disabled=true;
  $('panel').hidden=true;$('analysis').innerHTML='';$('meta').innerHTML='<div class="hint">摇卦中…</div>';
  const bars=$('bars');bars.innerHTML='';const slots=[];
  for(let i=0;i<6;i++){const d=document.createElement('div');d.className='ln y pending';d.innerHTML='<i></i>';bars.appendChild(d);slots.push(d);}
  $('coins').classList.add('active');const lines=[];
  for(let i=0;i<6;i++){
    await tossAnim();const L=tossLine();lines.push(L);showCoins(L.faces);
    slots[i].className='ln '+(L.yang?'y':'n')+(L.changing?' c':'')+' reveal';
    slots[i].innerHTML=L.yang?'<i></i>':'<i></i><i></i>';
    await sleep(280);
  }
  $('coins').classList.remove('active');finish(lines);busy=false;btn.disabled=false;
}
async function tossAnim(){const t=document.querySelectorAll('#coins .tok');for(let k=0;k<3;k++){t.forEach(x=>x.classList.add('flip'));await sleep(80);t.forEach(x=>{x.classList.remove('flip');x.classList.toggle('on',Math.random()<.5);});await sleep(30);}}
function showCoins(f){document.querySelectorAll('#coins .tok').forEach((x,i)=>x.classList.toggle('on',!!f[i]));}
function finish(lines){
  const ben=lookup(lines.map(l=>l.yang?'1':'0').join(''));
  $('meta').innerHTML=`<div class="no">NO. ${ben.num}</div><div class="nm">${ben.name}</div><div class="py">${PY[ben.num]||''}</div><div class="tri">${ben.up}（${TRI[ben.up].sym}）上 · ${ben.low}（${TRI[ben.low].sym}）下</div>`;
  const changes=lines.map((l,i)=>({pos:i+1,yang:l.yang,changing:l.changing})).filter(l=>l.changing);
  let bn=null,bl=null;
  if(changes.length){bn=lookup(lines.map(l=>l.changing?(l.yang?'0':'1'):(l.yang?'1':'0')).join(''));bl=lines.map(l=>({yang:l.changing?!l.yang:l.yang,changing:false}));}
  let html=guaCard("本卦",ben,lines,true,true,changes);
  if(changes.length){
    html+=`<div class="tolink">变为</div>`;
    html+=guaCard("变卦",bn,bl,false,false,changes);
  }else{
    html+=`<div class="tolink">无变卦</div>`;
    html+=`<div class="staticNote"><span class="lab">静卦</span><span>六爻皆静，无变爻——本卦即是答案，依本卦卦辞与建议而断。</span></div>`;
  }
  $('analysis').innerHTML=html;$('panel').hidden=false;
  history.unshift({ben:ben.name,bian:bn?bn.name:null,t:nowStr()});
  if(history.length>12)history.pop();renderHist();
}
function rowHTML(label,g){return `<div class="row1"><span class="no">NO.${g.num}</span><span class="nm">${g.name}</span><span class="py">${PY[g.num]||''}</span><span class="lab">${label}</span></div>`;}
function adviceHTML(g){return `<div class="advice"><span class="albl">建议</span><span>${ADV[g.num]||g.gist}</span></div>`;}
function detailsHTML(g,changes){
  const ch=changes.length?changes.map(c=>`<b>${yaoName(c.pos,c.yang)}</b>`).join('　'):'无（六爻安静）';
  return `<details class="more"><summary>卦辞 · 五行 · 变爻</summary>`+
  `<div class="dl"><span class="dk">上卦</span>${g.up}（${TRI[g.up].sym}）属${TRI[g.up].wu}</div>`+
  `<div class="dl"><span class="dk">下卦</span>${g.low}（${TRI[g.low].sym}）属${TRI[g.low].wu}</div>`+
  `<div class="dl"><span class="dk">卦辞</span>「${g.judge}」</div>`+
  `<div class="dl"><span class="dk">变爻</span>${ch}</div></details>`;
}
function guaCard(label,g,lines,mark,withDetails,changes){
  return `<div class="guaCard"><div class="mini"><div class="bars">${barsHTML(lines,mark)}</div></div>`+
  `<div class="gbody">`+
    `<div class="chead"><span class="lab">${label}</span><span class="no">NO.${g.num}</span></div>`+
    `<div class="nmrow"><span class="nm">${g.name}</span><span class="py">${PY[g.num]||''}</span></div>`+
    `<div class="gist">${g.gist}</div>`+
    adviceHTML(g)+
    (withDetails?detailsHTML(g,changes):'')+
  `</div></div>`;
}
function nowStr(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${p(d.getHours())}:${p(d.getMinutes())}`;}
function renderHist(){
  const ul=$('histList');
  if(!history.length){ul.innerHTML='<li class="empty">暂无记录</li>';return;}
  ul.innerHTML=history.map(h=>`<li><span><span class="hg">${h.ben}</span>${h.bian?`<span class="ht">　之　${h.bian}</span>`:`<span class="t">　静卦</span>`}</span><span class="t">${h.t}</span></li>`).join('');
}
$('castBtn').addEventListener('click',cast);
$('clr').addEventListener('click',()=>{history.length=0;renderHist();});
placeholder();
</script>
