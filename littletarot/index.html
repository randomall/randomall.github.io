<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Tarott</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap');
  :root{
    --ink:#1a1726;--ink-2:#2c2740;--paper:#f4ecdc;--paper-dim:#e6dcc4;
    --gold:#c8a24a;--gold-bright:#e6c674;--wine:#7a2a3a;--muted:#9a8f7a;--shadow:rgba(10,8,18,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Noto Serif TC',serif;color:var(--paper);
    background:
      radial-gradient(1200px 700px at 50% -10%, #322a4a 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 110%, #3a2030 0%, transparent 55%),
      linear-gradient(160deg, #15121f 0%, #1a1726 45%, #120f1b 100%);
    min-height:100vh;overflow-x:hidden;position:relative;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:
      radial-gradient(1px 1px at 20% 30%, #fff 50%, transparent),
      radial-gradient(1px 1px at 70% 60%, #fff 50%, transparent),
      radial-gradient(1px 1px at 40% 80%, #ffe9b0 50%, transparent),
      radial-gradient(1px 1px at 85% 25%, #fff 50%, transparent),
      radial-gradient(1px 1px at 55% 15%, #ffe9b0 50%, transparent),
      radial-gradient(1px 1px at 10% 65%, #fff 50%, transparent);
    background-repeat:no-repeat;
  }
  .wrap{max-width:430px;margin:0 auto;padding:38px 20px 80px;position:relative;z-index:1;}
  header{text-align:center;margin-bottom:34px;}
  .logo{font-family:'Cormorant Garamond',serif;letter-spacing:.32em;font-size:13px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;padding-left:.32em;}
  h1{font-weight:900;font-size:clamp(48px,14vw,68px);line-height:.95;letter-spacing:.06em;color:var(--paper);text-shadow:0 2px 30px rgba(200,162,74,.25);}
  h1 .em{color:var(--gold-bright);}
  .tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(15px,3.5vw,19px);color:var(--muted);margin-top:12px;}
  .rule{width:60px;height:1px;margin:22px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
  .spreads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;justify-content:center;flex-wrap:wrap;margin:30px 0 26px;}
  .spread-btn{font-family:'Noto Serif TC',serif;cursor:pointer;background:rgba(244,236,220,.04);border:1px solid rgba(200,162,74,.35);border-right-width:0;color:var(--paper);border-radius:0;padding:12px 6px;min-width:0;text-align:center;transition:all .25s ease;backdrop-filter:blur(2px);overflow:hidden;}
  .spread-btn:hover{border-color:var(--gold);background:rgba(200,162,74,.1);}
  .spread-btn.active{background:var(--gold);color:var(--ink);border-color:var(--gold);box-shadow:0 6px 24px rgba(200,162,74,.3);}
  .spread-btn .sb-name{font-weight:700;font-size:14px;letter-spacing:0;white-space:nowrap;}
  .spread-btn .sb-sub{font-size:10px;opacity:.7;margin-top:3px;font-family:'Cormorant Garamond';letter-spacing:.04em;white-space:nowrap;}
  .controls{text-align:center;margin-bottom:10px;}
  .draw-btn{font-family:'Noto Serif TC',serif;cursor:pointer;font-weight:700;font-size:17px;letter-spacing:.18em;padding:16px 46px;color:var(--ink);border:none;border-radius:2px;background:linear-gradient(135deg,var(--gold-bright),var(--gold));box-shadow:0 8px 30px rgba(200,162,74,.35);transition:transform .2s ease,box-shadow .2s ease;position:relative;overflow:hidden;}
  .draw-btn:hover{transform:translateY(-2px);box-shadow:0 12px 38px rgba(200,162,74,.5);}
  .draw-btn:active{transform:translateY(0);}
  .draw-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .reshuffle{display:inline-block;margin-top:14px;cursor:pointer;color:var(--muted);font-family:'Cormorant Garamond';font-style:italic;font-size:15px;border-bottom:1px solid transparent;transition:.2s;}
  .reshuffle:hover{color:var(--gold);border-color:var(--gold);}
  .table{margin-top:34px;min-height:60px;}
  .layout{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 16px;}
  .layout.celtic{max-width:760px;margin:0 auto;}
  .card-slot{display:flex;flex-direction:column;align-items:center;gap:10px;width:130px;}
  .slot-label{font-family:'Cormorant Garamond';letter-spacing:.12em;font-size:12px;color:var(--gold);text-transform:uppercase;min-height:16px;text-align:center;}
  .card{width:130px;height:222px;border-radius:8px;position:relative;cursor:pointer;perspective:1000px;}
  .card-inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;}
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:8px;overflow:hidden;box-shadow:0 10px 28px var(--shadow);}
  .back{background:repeating-linear-gradient(45deg, #2a2342 0 8px, #251f3a 8px 16px);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;}
  .back::after{content:"✦";font-size:40px;color:var(--gold);text-shadow:0 0 18px rgba(200,162,74,.6);}
  .back-deal{animation:dealIn .5s ease both;}
  .front{transform:rotateY(180deg);background:var(--paper);border:2px solid var(--gold);display:flex;flex-direction:column;}
  .front img{width:100%;height:100%;object-fit:cover;display:block;background:var(--paper-dim);}
  .front.reversed img{transform:rotate(180deg);}
  .front .placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink);text-align:center;padding:10px;background:linear-gradient(170deg,#efe6d0,#dfd2b4);}
  .front .placeholder .ph-sym{font-size:34px;color:var(--wine);}
  .front .placeholder .ph-name{font-weight:700;font-size:16px;}
  .front .placeholder .ph-en{font-family:'Cormorant Garamond';font-style:italic;font-size:12px;color:#6b5e44;}
  .front .placeholder.reversed{transform:rotate(180deg);}
  .rev-tag{position:absolute;top:6px;right:6px;z-index:3;background:var(--wine);color:var(--paper);font-size:10px;padding:2px 6px;border-radius:2px;letter-spacing:.08em;}
  .zoom-overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(12,9,20,.82);backdrop-filter:blur(8px);}
  .zoom-overlay.open{display:flex;}
  .zoom-panel{max-width:min(82vw,360px);width:100%;}
  .zoom-card{position:relative;aspect-ratio:130/222;border-radius:12px;overflow:hidden;border:2px solid var(--gold);box-shadow:0 22px 80px rgba(0,0,0,.65);background:var(--paper);}
  .zoom-card img{width:100%;height:100%;object-fit:cover;display:block;}
  .zoom-card img.reversed{transform:rotate(180deg);}
  .zoom-card .placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink);text-align:center;padding:16px;background:linear-gradient(170deg,#efe6d0,#dfd2b4);}
  .zoom-card .placeholder .ph-sym{font-size:52px;color:var(--wine);}
  .zoom-card .placeholder .ph-name{font-weight:700;font-size:24px;}
  .zoom-card .placeholder .ph-en{font-family:'Cormorant Garamond';font-style:italic;font-size:17px;color:#6b5e44;}
  .zoom-card .placeholder.reversed{transform:rotate(180deg);}
  .zoom-title{margin-top:14px;text-align:center;color:var(--paper);font-size:16px;line-height:1.6;}
  .zoom-hint{margin-top:4px;text-align:center;color:var(--muted);font-family:'Cormorant Garamond';font-style:italic;font-size:14px;}
  .readings{margin-top:46px;display:flex;flex-direction:column;gap:18px;}
  .reading{background:linear-gradient(135deg, rgba(244,236,220,.06), rgba(244,236,220,.02));border:1px solid rgba(200,162,74,.25);border-left:3px solid var(--gold);border-radius:3px;padding:20px 22px;opacity:0;transform:translateY(14px);animation:riseIn .55s ease forwards;}
  .reading .r-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
  .reading .r-slot{font-family:'Cormorant Garamond';font-style:italic;color:var(--gold);font-size:14px;letter-spacing:.1em;}
  .reading .r-name{font-weight:900;font-size:22px;color:var(--paper);letter-spacing:.04em;}
  .reading .r-en{font-family:'Cormorant Garamond';font-size:14px;color:var(--muted);}
  .reading .r-pos{font-size:11px;padding:2px 9px;border-radius:2px;letter-spacing:.08em;border:1px solid;}
  .reading .r-pos.up{color:var(--gold-bright);border-color:rgba(200,162,74,.5);}
  .reading .r-pos.rev{color:#e89aa8;border-color:rgba(122,42,58,.7);background:rgba(122,42,58,.2);}
  .reading .r-kw{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .reading .r-kw span{font-size:12px;color:var(--muted);background:rgba(255,255,255,.04);padding:3px 10px;border-radius:20px;}
  .reading .r-text{font-size:16px;line-height:1.85;color:#e8dec9;}
  .disclaimer{margin-top:50px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.7;font-family:'Cormorant Garamond';font-style:italic;border-top:1px solid rgba(200,162,74,.15);padding-top:22px;}
  @keyframes dealIn{from{opacity:0;transform:translateY(-30px) scale(.9);}to{opacity:1;transform:none;}}
  @keyframes riseIn{to{opacity:1;transform:none;}}
  .shuffling .card .card-inner{animation:wobble .5s ease;}
  @keyframes wobble{0%,100%{transform:none;}25%{transform:translateY(-8px) rotate(-2deg);}75%{transform:translateY(-8px) rotate(2deg);}}
  @media(max-width:640px){.wrap{padding:24px 14px 56px;}.spreads{margin:26px 0 24px;border-radius:4px;overflow:hidden;border-right:1px solid rgba(200,162,74,.35);}.card,.card-slot{width:96px;}.card{height:164px;}.reading{padding:16px 16px;}.reading .r-text{font-size:15px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Little Tarott</div>
    <h1>小<span class="em">塔羅</span></h1>
    <div class="tagline">Draw a card. Read it straight.</div>
    <div class="rule"></div>
  </header>
  <div class="spreads" id="spreads" aria-label="Tarot spreads"></div>
  <div class="controls">
    <button class="draw-btn" id="drawBtn">抽 牌</button>
    <div><span class="reshuffle" id="reshuffle" style="display:none;">↺ 重新洗牌再抽一次</span></div>
  </div>
  <div class="table"><div class="layout" id="layout"></div></div>
  <div class="readings" id="readings"></div>
  <div class="zoom-overlay" id="zoomOverlay" aria-hidden="true"><div class="zoom-panel"><div class="zoom-card" id="zoomCard"></div><div class="zoom-title" id="zoomTitle"></div><div class="zoom-hint">Tap to return</div></div></div>
  <div class="disclaimer">
    Little Tarott 僅供娛樂與自我反思之用，牌面使用公共領域的萊德‧韋特（Rider-Waite）插畫。<br>
    它不能替代專業的醫療、法律、財務或心理建議；人生的決定，終究在你自己手裡。
  </div>
</div>
<script>
const CARD_IMAGES = {};
const IMG_BASE = "img/";
const IMG_EXT  = ".webp";

// littletaro-cards.js —— Little Tarott 全 78 張牌數據(中文,解讀語氣:直接乾脆)
// 牌義為原創撰寫,基於公共領域的傳統塔羅含義,非任何受版權書籍的文本。
// 圖片文件名對應 download_rws_cards.py 的輸出(major_00.jpg / wands_01.jpg ...)。

const CARDS = [
  // ===== 大阿卡那 22 張 =====
  { id:"major_00", n:"愚者", e:"The Fool", kw:["新開始","冒險","天真"],
    up:"放手去試。你現在缺的不是計劃,是邁出第一步的膽量。別想太多,先動。",
    rv:"你在魯莽和逃避之間選錯了。要麼是沒準備好就亂衝,要麼是該冒險時卻縮了。停下想清楚。" },
  { id:"major_01", n:"魔術師", e:"The Magician", kw:["行動力","資源","專注"],
    up:"你手上的牌已經夠了。能力、資源、機會都在,缺的是把它們用起來。開始執行。",
    rv:"光說不做,或者把本事用在了歪處。你在操縱、拖延,或者根本沒發揮實力。" },
  { id:"major_02", n:"女祭司", e:"The High Priestess", kw:["直覺","等待","內在"],
    up:"答案在你心裡,不在外面。現在不是行動的時候,是觀察和傾聽直覺的時候。",
    rv:"你在壓抑那個早就知道的答案,或者被表面信息帶偏了。別再忽略內心的聲音。" },
  { id:"major_03", n:"皇后", e:"The Empress", kw:["豐盛","滋養","創造"],
    up:"該收穫了。無論是關係、事業還是創作,現在是豐盛和成長期。好好享受、好好經營。",
    rv:"你要麼過度付出掏空了自己,要麼停滯不前。檢查一下是不是忽略了自己的需要。" },
  { id:"major_04", n:"皇帝", e:"The Emperor", kw:["秩序","掌控","責任"],
    up:"建立規則和結構。現在需要的是紀律、計劃和扛起責任,不是隨性。該你來主導。",
    rv:"要麼你太死板控制慾過強,要麼相反——該立規矩時太軟。權力關係出了問題。" },
  { id:"major_05", n:"教皇", e:"The Hierophant", kw:["傳統","指引","歸屬"],
    up:"按規矩來,或者找個有經驗的人請教。現在不是標新立異的時候,走成熟的路。",
    rv:"你在反抗某種框架或權威。可能是對的,但先確認你是真有想法,還是單純叛逆。" },
  { id:"major_06", n:"戀人", e:"The Lovers", kw:["選擇","關係","價值觀"],
    up:"一個重要選擇擺在面前,關乎你真正看重什麼。跟著價值觀走,別將就。",
    rv:"關係失衡,或者你在逃避一個該做的決定。可能是溝通斷了,或者你違背了本心。" },
  { id:"major_07", n:"戰車", e:"The Chariot", kw:["意志","前進","勝利"],
    up:"靠意志力強推就對了。方向已定,把分散的力量攏到一起,衝。能贏。",
    rv:"失控或停滯。要麼方向亂了,要麼你被情緒拖著走。先把韁繩抓回來。" },
  { id:"major_08", n:"力量", e:"Strength", kw:["內在力量","耐心","柔韌"],
    up:"用溫柔和耐心去搞定,不是靠蠻力。你比自己想的更強。穩住,慢慢來。",
    rv:"你在自我懷疑,或者用錯了力氣。情緒壓過了理智。先穩住內心再說。" },
  { id:"major_09", n:"隱者", e:"The Hermit", kw:["獨處","反思","尋找"],
    up:"退一步,自己待會兒。現在需要的是向內看、想清楚,而不是往外衝。",
    rv:"你要麼過度孤立把自己關起來了,要麼相反——一刻不肯獨處去面對自己。" },
  { id:"major_10", n:"命運之輪", e:"Wheel of Fortune", kw:["轉變","循環","時機"],
    up:"局面在轉。好運或轉機要來了,順勢而為。該出手時別猶豫,週期不等人。",
    rv:"運勢下行或卡住了。別硬扛壞週期,也別怪運氣——看看自己能改的部分。" },
  { id:"major_11", n:"正義", e:"Justice", kw:["公正","因果","責任"],
    up:"該算總賬了。你的選擇會帶來對應結果,公平但不留情。做對的事,負起責任。",
    rv:"有不公平、或你在逃避責任。要麼別人對你不公,要麼你不肯面對自己造成的後果。" },
  { id:"major_12", n:"倒吊人", e:"The Hanged Man", kw:["停頓","換視角","臣服"],
    up:"卡住是有意義的。換個角度看問題,或者乾脆先放下。硬推沒用,先接受現狀。",
    rv:"無謂的犧牲,或拖著不肯放手。你在為不值得的事耗著。該鬆手了。" },
  { id:"major_13", n:"死神", e:"Death", kw:["結束","轉化","重生"],
    up:"有東西必須結束,才能騰出位置。別捨不得,該斷的斷。結束就是新開始。",
    rv:"你在抗拒一個必然的結束,死撐著舊的。越拖越痛。接受變化。" },
  { id:"major_14", n:"節制", e:"Temperance", kw:["平衡","耐心","調和"],
    up:"找平衡,別走極端。慢慢調、慢慢融,耐心是現在的關鍵。中道而行。",
    rv:"失衡了,或者太急。你在過度或不及之間搖擺。先把節奏穩下來。" },
  { id:"major_15", n:"惡魔", e:"The Devil", kw:["束縛","慾望","執念"],
    up:"你被某樣東西捆住了——可能是慾望、習慣、或一段不健康的關係。看清那條鏈子。",
    rv:"你開始掙脫了。意識到了束縛,正在收回控制權。繼續,別回頭。" },
  { id:"major_16", n:"高塔", e:"The Tower", kw:["崩塌","突變","覺醒"],
    up:"有些東西要塌,而且擋不住。痛,但塌的本來就不穩。廢墟上才能重建真的。",
    rv:"你在硬撐一個該塌的結構,或者災難勉強避過但根子問題還在。別自欺。" },
  { id:"major_17", n:"星星", e:"The Star", kw:["希望","療愈","信念"],
    up:"風暴過去了。現在是療愈和重拾希望的時候。保持信念,前面有光。",
    rv:"你對未來失了信心,或者太理想化脫離現實。把希望和行動接上。" },
  { id:"major_18", n:"月亮", e:"The Moon", kw:["迷霧","恐懼","潛意識"],
    up:"現在看不清,別急著下結論。有恐懼和錯覺在作祟。等霧散,信直覺別信幻象。",
    rv:"迷霧在散,真相浮現。你開始看清之前被騙或自欺的部分。" },
  { id:"major_19", n:"太陽", e:"The Sun", kw:["成功","喜悅","清晰"],
    up:"明牌。順利、清晰、值得高興。該做的都對了,放心往前。難得的好牌。",
    rv:"暫時被烏雲擋住,但太陽還在。可能有點延遲或小挫,別把它放大。" },
  { id:"major_20", n:"審判", e:"Judgement", kw:["覺醒","清算","召喚"],
    up:"到了重新評估、做決斷的節點。聽從內心的召喚,該翻篇翻篇,該回應回應。",
    rv:"你在逃避一個該面對的清算,或對自己太苛刻。別困在過去的判決裡。" },
  { id:"major_21", n:"世界", e:"The World", kw:["完成","圓滿","整合"],
    up:"一個階段圓滿收尾。你做到了,該慶祝也該收穫。然後,準備好下一個循環。",
    rv:"差一點點沒收尾,或者你沒從已完成的事裡抽身。把尾巴處理乾淨再走。" },

  // ===== 權杖 Wands(火 · 行動/熱情/事業)=====
  { id:"wands_01", n:"權杖一", e:"Ace of Wands", kw:["靈感","起點","衝勁"],
    up:"一股新的熱情或機會冒出來了。抓住這股勁,開始做。火苗要趁早。",
    rv:"想法有了但點不著火,或者三分鐘熱度。缺動力或時機不對。" },
  { id:"wands_02", n:"權杖二", e:"Two of Wands", kw:["規劃","抉擇","遠見"],
    up:"你站在起點眺望遠方。計劃有了,該決定走哪條路。別隻看腳下,看遠點。",
    rv:"猶豫不決,或計劃太保守不敢邁步。要麼怕風險,要麼沒真想清楚。" },
  { id:"wands_03", n:"權杖三", e:"Three of Wands", kw:["擴展","等待","進展"],

    slots:["現狀","阻礙/助力","潛意識根源","近期過去","可能的結果","近期未來","你的態度","環境與他人","希望與恐懼","最終結果"] },
};

const SUIT_SYM = { major:"\u2726", wands:"\uD83D\uDF02", cups:"\uD83D\uDF04", swords:"\uD83D\uDF01", pentacles:"\uD83D\uDF03" };
function suitOf(id){ return id.split("_")[0]; }
let currentSpread = "three";
let drawn = [];
const spreadsEl = document.getElementById("spreads");
Object.values(SPREADS).forEach(sp=>{
  const b = document.createElement("div");
  b.className = "spread-btn" + (sp.key===currentSpread?" active":"");
  b.dataset.key = sp.key;
  b.innerHTML = '<div class="sb-name">'+sp.name+'</div><div class="sb-sub">'+sp.count+' card'+(sp.count>1?'s':'')+'</div>';
  b.onclick = ()=>{ currentSpread = sp.key; document.querySelectorAll(".spread-btn").forEach(x=>x.classList.toggle("active", x.dataset.key===sp.key)); reset(); };
  spreadsEl.appendChild(b);
});
const layoutEl = document.getElementById("layout");
const readingsEl = document.getElementById("readings");
const drawBtn = document.getElementById("drawBtn");
const reshuffleEl = document.getElementById("reshuffle");
const zoomOverlay = document.getElementById("zoomOverlay");
const zoomCard = document.getElementById("zoomCard");
const zoomTitle = document.getElementById("zoomTitle");
function reset(){
  drawn = []; layoutEl.innerHTML = "";
  layoutEl.className = "layout" + (currentSpread==="celtic"?" celtic":"");
  readingsEl.innerHTML = ""; reshuffleEl.style.display = "none";
  drawBtn.disabled = false; drawBtn.textContent = "抽 牌";
}
function shuffle(a){ const arr=a.slice(); for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function drawCards(){
  const sp = SPREADS[currentSpread];
  const picked = shuffle(CARDS).slice(0, sp.count);
  drawn = picked.map((card,i)=>({ card, reversed: Math.random()<0.5, slot: sp.slots[i]||"" }));
  renderBacks();
}
function escAttr(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function placeholderHTML(d, revClass){
  const sym = SUIT_SYM[suitOf(d.card.id)] || "\u2726";
  return '<div class="placeholder'+revClass+'"><div class="ph-sym">'+sym+'</div><div class="ph-name">'+d.card.n+'</div><div class="ph-en">'+d.card.e+'</div></div>';
}
function cardFrontHTML(d){
  const revClass = d.reversed ? " reversed" : "";
  const tag = d.reversed ? '<div class="rev-tag">逆位</div>' : '';
  const src = CARD_IMAGES[d.card.id] || (IMG_BASE ? IMG_BASE+d.card.id+IMG_EXT : "");
  if(src){
    const fallback = escAttr(placeholderHTML(d, revClass));
    const img = '<img class="'+(d.reversed?"reversed":"")+'" src="'+src+'" alt="'+d.card.n+'" onerror="this.parentNode.innerHTML=\''+fallback.replace(/'/g,"&#39;")+'\';">';
    return tag + img;
  }
  return tag + placeholderHTML(d, revClass);
}
function renderBacks(){
  layoutEl.innerHTML = ""; readingsEl.innerHTML = "";
  drawn.forEach((d,i)=>{
    const slot = document.createElement("div");
    slot.className = "card-slot";
    slot.innerHTML =
      '<div class="card" data-i="'+i+'"><div class="card-inner">'
      + '<div class="face back back-deal" style="animation-delay:'+(i*0.08)+'s"></div>'
      + '<div class="face front">'+cardFrontHTML(d)+'</div>'
      + '</div></div><div class="slot-label">'+(d.slot||"")+'</div>';
    layoutEl.appendChild(slot);
  });
  drawn.forEach((d,i)=>{
    const cardEl = layoutEl.querySelectorAll(".card")[i];
    cardEl.addEventListener("click", ()=>{ if(cardEl.classList.contains("flipped")) openZoom(i); else flip(i); });
    setTimeout(()=>flip(i), 650 + i*420);
  });
  drawBtn.disabled = true; drawBtn.textContent = "翻牌中…"; reshuffleEl.style.display = "none";
}
function flip(i){
  const cardEl = layoutEl.querySelectorAll(".card")[i];
  if(cardEl.classList.contains("flipped")) return;
  cardEl.classList.add("flipped");
  addReading(drawn[i]);
  if(layoutEl.querySelectorAll(".card.flipped").length === drawn.length){
    drawBtn.disabled = false; drawBtn.textContent = "再抽一次"; reshuffleEl.style.display = "inline-block";
  }
}
function openZoom(i){
  const d = drawn[i];
  if(!d) return;
  zoomCard.innerHTML = cardFrontHTML(d);
  zoomTitle.textContent = d.card.n + " · " + d.card.e + " · " + (d.reversed ? "逆位" : "正位");
  zoomOverlay.classList.add("open");
  zoomOverlay.setAttribute("aria-hidden","false");
}
function closeZoom(){
  zoomOverlay.classList.remove("open");
  zoomOverlay.setAttribute("aria-hidden","true");
}
zoomOverlay.addEventListener("click", closeZoom);
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeZoom(); });
function addReading(d){
  const text = d.reversed ? d.card.rv : d.card.up;
  const posClass = d.reversed ? "rev" : "up";
  const posText = d.reversed ? "逆位" : "正位";
  const kw = d.card.kw.map(k=>'<span>'+k+'</span>').join("");
  const div = document.createElement("div");
  div.className = "reading";
  div.innerHTML =
    '<div class="r-head">'+(d.slot?'<span class="r-slot">'+d.slot+'</span>':'')
    + '<span class="r-name">'+d.card.n+'</span><span class="r-en">'+d.card.e+'</span>'
    + '<span class="r-pos '+posClass+'">'+posText+'</span></div>'
    + '<div class="r-kw">'+kw+'</div><div class="r-text">'+text+'</div>';
  readingsEl.appendChild(div);
}
drawBtn.onclick = ()=>{
  if(drawn.length && !drawBtn.disabled){ reset(); }
  document.body.classList.add("shuffling");
  setTimeout(()=>{ document.body.classList.remove("shuffling"); drawCards(); }, 420);
};
reshuffleEl.onclick = ()=>{ reset(); drawBtn.onclick(); };
reset();
</script>
</body>
</html>
