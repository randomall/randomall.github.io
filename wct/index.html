<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>念想成真</title>
  <meta name="description" content="念想成真 · 念念不忘必有回响">
  <meta name="theme-color" content="#0a0a1f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a1f'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23f5e6a8'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23f5e6a8' stroke-opacity='0.3'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg-1: #07071a;
      --bg-2: #1a0e2e;
      --bg-3: #0a0a1f;
      --fg: #f5f1e6;
      --gold: #f5e6a8;
      --dim: #8a85a3;
      --glow: rgba(245, 230, 168, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg-3);
      color: var(--fg);
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", "Microsoft YaHei", serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      position: relative;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(75, 50, 110, 0.45) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 80%, rgba(40, 60, 110, 0.35) 0%, transparent 60%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 60%, var(--bg-3) 100%);
    }

    .stars, .stars-far {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--fg);
      border-radius: 50%;
      opacity: 0;
      animation: twinkle 6s ease-in-out infinite;
    }
    .star.big { width: 3px; height: 3px; box-shadow: 0 0 6px var(--glow); }
    .star.tiny { width: 1px; height: 1px; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.15; }
      50%      { opacity: 0.95; }
    }

    .stage {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .ornament {
      width: 64px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
      opacity: 0.6;
      margin-bottom: 2.5rem;
      animation: fadein 2s 0.2s ease both;
    }

    h1 {
      font-size: clamp(3rem, 12vw, 6rem);
      font-weight: 500;
      letter-spacing: 0.4em;
      padding-left: 0.4em;
      color: var(--gold);
      text-shadow:
        0 0 18px rgba(245, 230, 168, 0.35),
        0 0 40px rgba(245, 230, 168, 0.18);
      animation:
        fadein 2.4s ease both,
        breathe 6s 2.4s ease-in-out infinite;
    }

    .sub {
      margin-top: 2rem;
      font-size: clamp(1rem, 3.5vw, 1.35rem);
      letter-spacing: 0.5em;
      padding-left: 0.5em;
      color: var(--fg);
      opacity: 0.82;
      animation: fadein 2.4s 0.6s ease both;
    }

    .ornament.bottom {
      margin-top: 2.75rem;
      margin-bottom: 3rem;
      animation-delay: 1s;
    }

    .enter {
      background: none;
      border: 1px solid rgba(245, 230, 168, 0.35);
      color: var(--gold);
      font-family: inherit;
      font-size: 0.95rem;
      letter-spacing: 0.4em;
      padding: 0.7rem 1.6rem 0.7rem 2rem;
      cursor: pointer;
      border-radius: 999px;
      transition: background 0.35s ease, border-color 0.35s ease, transform 0.2s ease;
      animation:
        fadein 2.4s 1.2s ease both,
        glow 4s 1.2s ease-in-out infinite;
    }
    .enter:hover, .enter:focus {
      background: rgba(245, 230, 168, 0.08);
      border-color: var(--gold);
      outline: none;
      transform: translateY(-1px);
    }
    .enter:active { transform: translateY(0); }

    .whisper {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 4rem);
      transform: translate(-50%, 1rem);
      color: var(--gold);
      letter-spacing: 0.5em;
      padding-left: 0.5em;
      font-size: 0.95rem;
      opacity: 0;
      transition: opacity 0.6s ease, transform 0.6s ease;
      pointer-events: none;
    }
    .whisper.show {
      opacity: 0.85;
      transform: translate(-50%, 0);
    }

    footer {
      position: fixed;
      left: 0; right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 1.25rem);
      text-align: center;
      color: var(--dim);
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      padding-left: 0.35em;
      opacity: 0.55;
      animation: fadein 3s 2s ease both;
    }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes breathe {
      0%, 100% { text-shadow: 0 0 18px rgba(245, 230, 168, 0.35), 0 0 40px rgba(245, 230, 168, 0.18); }
      50%      { text-shadow: 0 0 28px rgba(245, 230, 168, 0.55), 0 0 60px rgba(245, 230, 168, 0.30); }
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 230, 168, 0.0); }
      50%      { box-shadow: 0 0 24px 2px rgba(245, 230, 168, 0.18); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
      .star { opacity: 0.7; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars" aria-hidden="true"></div>

  <main class="stage">
    <div class="ornament" aria-hidden="true"></div>

    <h1 lang="zh-CN">念想成真</h1>
    <p class="sub" lang="zh-CN">念念不忘&nbsp;&nbsp;必有回响</p>

    <div class="ornament bottom" aria-hidden="true"></div>

    <button class="enter" id="enter" type="button" aria-label="开始">开 始</button>

    <div class="whisper" id="whisper" lang="zh-CN" aria-live="polite">敬 请 期 待</div>
  </main>

  <footer lang="zh-CN">w c t · 念 想 成 真</footer>

  <script>
    (function () {
      const layer = document.getElementById('stars');
      const count = window.innerWidth < 600 ? 70 : 130;
      const frag = document.createDocumentFragment();
      for (let i = 0; i < count; i++) {
        const s = document.createElement('span');
        const r = Math.random();
        s.className = 'star' + (r < 0.15 ? ' big' : r > 0.7 ? ' tiny' : '');
        s.style.left = (Math.random() * 100) + 'vw';
        s.style.top  = (Math.random() * 100) + 'vh';
        s.style.animationDelay    = (Math.random() * 6) + 's';
        s.style.animationDuration = (4 + Math.random() * 5) + 's';
        frag.appendChild(s);
      }
      layer.appendChild(frag);

      const enter = document.getElementById('enter');
      const whisper = document.getElementById('whisper');
      let timer;
      enter.addEventListener('click', () => {
        whisper.classList.add('show');
        clearTimeout(timer);
        timer = setTimeout(() => whisper.classList.remove('show'), 2400);
      });
    })();
  </script>
</body>
</html>
