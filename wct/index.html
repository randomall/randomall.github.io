<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>念想兴义</title>
  <meta name="description" content="念想兴义 · 在兴义说出你的念想，我们为你实现">
  <meta name="theme-color" content="#0a0a1f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a1f'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23f5e6a8'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23f5e6a8' stroke-opacity='0.3'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg-1: #07071a;
      --bg-2: #1a0e2e;
      --bg-3: #0a0a1f;
      --fg: #f5f1e6;
      --gold: #f5e6a8;
      --gold-soft: rgba(245, 230, 168, 0.7);
      --dim: #8a85a3;
      --line: rgba(245, 230, 168, 0.18);
      --line-strong: rgba(245, 230, 168, 0.4);
      --card-bg: rgba(20, 16, 40, 0.55);
      --card-hover: rgba(40, 30, 70, 0.65);
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg-3);
      color: var(--fg);
      font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", "Microsoft YaHei", serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      position: relative;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(75, 50, 110, 0.4) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(40, 60, 110, 0.3) 0%, transparent 55%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 60%, var(--bg-3) 100%);
      background-attachment: fixed;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 4rem);
      padding-left:  env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    /* starfield */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      width: 2px; height: 2px;
      background: var(--fg);
      border-radius: 50%;
      opacity: 0;
      animation: twinkle 6s ease-in-out infinite;
    }
    .star.big { width: 3px; height: 3px; box-shadow: 0 0 6px rgba(245,230,168,0.45); }
    .star.tiny { width: 1px; height: 1px; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.12; }
      50%      { opacity: 0.85; }
    }

    /* layout */
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 980px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 0px) + 3rem) 1.25rem 0;
    }

    header.hero {
      text-align: center;
      padding-bottom: 2.5rem;
    }
    h1 {
      font-size: clamp(2.25rem, 7vw, 3.5rem);
      font-weight: 500;
      letter-spacing: 0.3em;
      padding-left: 0.3em;
      color: var(--gold);
      text-shadow:
        0 0 16px rgba(245, 230, 168, 0.3),
        0 0 36px rgba(245, 230, 168, 0.15);
      animation: breathe 6s ease-in-out infinite;
    }
    .sub {
      margin-top: 1rem;
      font-size: clamp(0.85rem, 2.5vw, 1.05rem);
      letter-spacing: 0.45em;
      padding-left: 0.45em;
      color: var(--fg);
      opacity: 0.75;
    }
    .ornament {
      width: 64px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
      opacity: 0.5;
      margin: 1.5rem auto;
    }

    /* section heading */
    .section {
      margin-top: 2.5rem;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .section-title {
      font-size: 1.1rem;
      letter-spacing: 0.4em;
      padding-left: 0.4em;
      color: var(--gold-soft);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .section-title::before {
      content: "";
      width: 18px; height: 1px;
      background: var(--line-strong);
    }

    /* grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }
    .card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.25rem 1.1rem 1.1rem;
      cursor: pointer;
      transition: background 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 180px;
      font-family: inherit;
      color: inherit;
      text-align: left;
      width: 100%;
    }
    .card:hover, .card:focus-visible {
      background: var(--card-hover);
      border-color: var(--line-strong);
      transform: translateY(-2px);
      outline: none;
    }
    .card .icon {
      font-size: 2.25rem;
      line-height: 1;
      margin-bottom: 0.85rem;
      filter: drop-shadow(0 0 8px rgba(245, 230, 168, 0.2));
    }
    .card .name {
      font-size: 1.05rem;
      letter-spacing: 0.1em;
      color: var(--fg);
      margin-bottom: 0.35rem;
    }
    .card .cat {
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      padding-left: 0.3em;
      color: var(--dim);
      margin-bottom: 0.65rem;
    }
    .card .desc {
      font-size: 0.85rem;
      line-height: 1.55;
      color: rgba(245, 241, 230, 0.7);
      margin-top: auto;
    }
    .card .want {
      position: absolute;
      top: 0.85rem;
      right: 0.95rem;
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      padding-left: 0.3em;
      color: var(--gold-soft);
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .card:hover .want, .card:focus-visible .want { opacity: 1; }

    /* add card */
    .card.add {
      border: 1px dashed var(--line-strong);
      background: transparent;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--gold-soft);
      min-height: 180px;
    }
    .card.add:hover {
      background: rgba(245, 230, 168, 0.04);
    }
    .card.add .plus {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      line-height: 1;
    }
    .card.add .label {
      font-size: 0.9rem;
      letter-spacing: 0.35em;
      padding-left: 0.35em;
    }

    /* my wishes */
    .mine {
      margin-top: 0.5rem;
    }
    .mine-empty {
      padding: 2rem 1rem;
      text-align: center;
      color: var(--dim);
      font-size: 0.95rem;
      letter-spacing: 0.2em;
      padding-left: 0.2em;
      border: 1px dashed var(--line);
      border-radius: 14px;
    }
    .mine-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .mine-item {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.85rem 1rem;
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .mine-item .micon { font-size: 1.4rem; flex-shrink: 0; }
    .mine-item .mbody { flex: 1; min-width: 0; }
    .mine-item .mname {
      font-size: 0.98rem;
      color: var(--fg);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mine-item .mmeta {
      font-size: 0.72rem;
      color: var(--dim);
      letter-spacing: 0.2em;
      padding-left: 0.2em;
      margin-top: 0.2rem;
    }
    .mine-item .mremove {
      background: none;
      border: none;
      color: var(--dim);
      cursor: pointer;
      font-size: 1.35rem;
      line-height: 1;
      min-width: 44px;
      min-height: 44px;
      padding: 0.5rem 0.65rem;
      font-family: inherit;
      transition: color 0.2s ease;
      flex-shrink: 0;
    }
    .mine-item .mremove:hover,
    .mine-item .mremove:active { color: var(--gold); }

    /* modal */
    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(7, 7, 26, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding:
        calc(env(safe-area-inset-top, 0px) + 1rem)
        calc(env(safe-area-inset-right, 0px) + 1rem)
        calc(env(safe-area-inset-bottom, 0px) + 1rem)
        calc(env(safe-area-inset-left, 0px) + 1rem);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .scrim.show { display: flex; }
    .modal {
      background: linear-gradient(180deg, #1a1235 0%, #0f0a22 100%);
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 460px;
      padding: 1.5rem;
      max-height: 100%;
      overflow-y: auto;
    }
    .modal h2 {
      font-size: 1.15rem;
      letter-spacing: 0.3em;
      padding-left: 0.3em;
      color: var(--gold);
      margin-bottom: 1.25rem;
      font-weight: 500;
    }
    .field { margin-bottom: 0.9rem; }
    .field label {
      display: block;
      font-size: 0.78rem;
      letter-spacing: 0.25em;
      padding-left: 0.25em;
      color: var(--dim);
      margin-bottom: 0.4rem;
    }
    .field input, .field textarea, .field select {
      width: 100%;
      background: rgba(7, 7, 26, 0.6);
      border: 1px solid var(--line);
      color: var(--fg);
      padding: 0.7rem 0.85rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 16px;
      letter-spacing: 0.05em;
      transition: border-color 0.2s ease;
      -webkit-appearance: none;
      appearance: none;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      outline: none;
      border-color: var(--line-strong);
    }
    .field textarea { resize: vertical; min-height: 70px; }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 1.25rem;
    }
    .btn {
      background: none;
      border: 1px solid var(--line);
      color: var(--fg);
      font-family: inherit;
      font-size: 0.88rem;
      letter-spacing: 0.3em;
      padding: 0.55rem 1.2rem 0.55rem 1.5rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }
    .btn:hover { border-color: var(--line-strong); background: rgba(245, 230, 168, 0.05); }
    .btn.primary {
      color: var(--gold);
      border-color: var(--line-strong);
    }
    .btn.primary:hover { background: rgba(245, 230, 168, 0.1); }

    /* toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
      transform: translate(-50%, 1rem);
      background: rgba(20, 14, 40, 0.92);
      border: 1px solid var(--line-strong);
      color: var(--gold);
      padding: 0.7rem 1.4rem 0.7rem 1.7rem;
      border-radius: 999px;
      font-size: 0.9rem;
      letter-spacing: 0.3em;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.5s ease;
      pointer-events: none;
      z-index: 20;
      box-shadow: var(--shadow);
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @keyframes breathe {
      0%, 100% { text-shadow: 0 0 16px rgba(245, 230, 168, 0.3), 0 0 36px rgba(245, 230, 168, 0.15); }
      50%      { text-shadow: 0 0 24px rgba(245, 230, 168, 0.5), 0 0 52px rgba(245, 230, 168, 0.25); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
      .star { opacity: 0.6; }
    }

    @media (max-width: 480px) {
      .wrap { padding: calc(env(safe-area-inset-top, 0px) + 2rem) 1rem 0; }
      header.hero { padding-bottom: 1.75rem; }
      .section { margin-top: 2rem; }
      .section-title { font-size: 0.95rem; letter-spacing: 0.25em; padding-left: 0.25em; gap: 0.5rem; }
      .section-title::before { width: 14px; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
      .card { min-height: 158px; padding: 0.95rem 0.8rem 0.85rem; border-radius: 12px; }
      .card .icon { font-size: 1.85rem; margin-bottom: 0.6rem; }
      .card .name { font-size: 0.95rem; margin-bottom: 0.25rem; }
      .card .cat  { font-size: 0.68rem; margin-bottom: 0.5rem; }
      .card .desc { font-size: 0.78rem; line-height: 1.5; }
      .card.add { min-height: 158px; }
      .mine-item { padding: 0.75rem 0.5rem 0.75rem 0.85rem; gap: 0.6rem; }
      .mine-item .micon { font-size: 1.3rem; }
      .mine-item .mname { font-size: 0.95rem; }
      .modal { padding: 1.25rem; border-radius: 14px; }
      .modal h2 { font-size: 1.05rem; margin-bottom: 1rem; }
      .btn { padding: 0.55rem 1rem 0.55rem 1.3rem; font-size: 0.85rem; letter-spacing: 0.25em; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars" aria-hidden="true"></div>

  <div class="wrap">
    <header class="hero">
      <h1>念想兴义</h1>
      <p class="sub">念念不忘&nbsp;&nbsp;必有回响</p>
      <div class="ornament" aria-hidden="true"></div>
    </header>

    <section class="section" aria-labelledby="cabinet-title">
      <div class="section-head">
        <h2 class="section-title" id="cabinet-title">兴 义 女 人 的 念 想</h2>
      </div>
      <div class="grid" id="cabinet"></div>
    </section>

    <section class="section" aria-labelledby="mine-title">
      <div class="section-head">
        <h2 class="section-title" id="mine-title">我 的 念 想</h2>
      </div>
      <div class="mine" id="mine"></div>
    </section>
  </div>

  <!-- add wish modal -->
  <div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="add-title">
    <div class="modal">
      <h2 id="add-title">添 加 念 想</h2>
      <form id="add-form">
        <div class="field">
          <label for="f-name">名 称</label>
          <input id="f-name" name="name" type="text" required maxlength="50" placeholder="你想在兴义得到的东西…">
        </div>
        <div class="field">
          <label for="f-cat">类 别</label>
          <select id="f-cat" name="category">
            <option value="饮品">饮品</option>
            <option value="美食">美食</option>
            <option value="礼金">礼金</option>
            <option value="鲜花">鲜花</option>
            <option value="手串">手串</option>
            <option value="衣物">衣物</option>
            <option value="配饰">配饰</option>
            <option value="其他" selected>其他</option>
          </select>
        </div>
        <div class="field">
          <label for="f-desc">描 述 (可选)</label>
          <textarea id="f-desc" name="desc" maxlength="200" placeholder="样子、份量、地点、时间…"></textarea>
        </div>
        <div class="actions">
          <button type="button" class="btn" id="cancel">取 消</button>
          <button type="submit" class="btn primary">记 下</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" aria-live="polite">已 为 你 记 下</div>

  <script>
    (function () {
      // starfield
      const layer = document.getElementById('stars');
      const count = window.innerWidth < 600 ? 50 : 90;
      const frag = document.createDocumentFragment();
      for (let i = 0; i < count; i++) {
        const s = document.createElement('span');
        const r = Math.random();
        s.className = 'star' + (r < 0.15 ? ' big' : r > 0.7 ? ' tiny' : '');
        s.style.left = (Math.random() * 100) + 'vw';
        s.style.top  = (Math.random() * 100) + 'vh';
        s.style.animationDelay    = (Math.random() * 6) + 's';
        s.style.animationDuration = (4 + Math.random() * 5) + 's';
        frag.appendChild(s);
      }
      layer.appendChild(frag);

      // preset items
      const PRESETS = [
        { id: 'p1', icon: '🧋', name: '一杯奶茶',       category: '饮品', desc: '甜甜的，一口下去什么都好了。' },
        { id: 'p2', icon: '🥩', name: '一份好吃的牛排', category: '美食', desc: '三分熟，带点微焦，刀切开的声音。' },
        { id: 'p3', icon: '🧧', name: '一个红包',       category: '礼金', desc: '数字不重要，心意最重要。' },
        { id: 'p4', icon: '💐', name: '一束鲜花',       category: '鲜花', desc: '随手一束，放在窗台上最好看。' },
        { id: 'p5', icon: '💚', name: '一条绿幽灵手串', category: '手串', desc: '透绿幽深，一粒粒戴着安静。' },
        { id: 'p6', icon: '👗', name: '一条小黑裙',     category: '衣物', desc: '哪里都能穿，什么时候都对。' },
        { id: 'p7', icon: '🕶️', name: '一副墨镜',       category: '配饰', desc: '夏日街头，戴上什么都有型。' },
        { id: 'p8', icon: '🍸', name: '一杯调酒',       category: '饮品', desc: '一杯好酒，今晚慢慢喝。' }
      ];

      const KEY = 'wct.mine.v1';
      const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
      const save = (arr) => localStorage.setItem(KEY, JSON.stringify(arr));

      // render presets
      const cabinet = document.getElementById('cabinet');
      const cabFrag = document.createDocumentFragment();
      PRESETS.forEach(p => {
        const b = document.createElement('button');
        b.className = 'card';
        b.type = 'button';
        b.dataset.id = p.id;
        b.innerHTML = `
          <span class="want">想 要 →</span>
          <span class="icon" aria-hidden="true">${p.icon}</span>
          <div class="name">${p.name}</div>
          <div class="cat">${p.category}</div>
          <div class="desc">${p.desc}</div>
        `;
        b.addEventListener('click', () => addWish({
          source: 'preset',
          presetId: p.id,
          icon: p.icon,
          name: p.name,
          category: p.category,
          desc: p.desc
        }));
        cabFrag.appendChild(b);
      });
      // add-your-own card
      const addCard = document.createElement('button');
      addCard.className = 'card add';
      addCard.type = 'button';
      addCard.innerHTML = `<span class="plus" aria-hidden="true">+</span><span class="label">添 加 我 的 念 想</span>`;
      addCard.addEventListener('click', openModal);
      cabFrag.appendChild(addCard);
      cabinet.appendChild(cabFrag);

      // toast
      const toast = document.getElementById('toast');
      let toastTimer;
      function showToast(text) {
        toast.textContent = text;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
      }

      // add wish
      function addWish(item) {
        const arr = load();
        arr.unshift({ ...item, id: 'w' + Date.now() + Math.random().toString(36).slice(2,6), at: Date.now() });
        save(arr);
        renderMine();
        showToast('已 为 你 记 下');
      }

      // my wishes render
      const mine = document.getElementById('mine');
      function fmtDate(ts) {
        const d = new Date(ts);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}.${m}.${day}`;
      }
      function renderMine() {
        const arr = load();
        if (!arr.length) {
          mine.innerHTML = `<div class="mine-empty">还 没 有 念 想 · 从 上 方 选 一 个 ， 或 自 己 添 加</div>`;
          return;
        }
        const list = document.createElement('div');
        list.className = 'mine-list';
        arr.forEach(w => {
          const row = document.createElement('div');
          row.className = 'mine-item';
          row.innerHTML = `
            <span class="micon" aria-hidden="true">${w.icon || '✦'}</span>
            <div class="mbody">
              <div class="mname"></div>
              <div class="mmeta"></div>
            </div>
            <button class="mremove" type="button" aria-label="移除" title="移除">×</button>
          `;
          row.querySelector('.mname').textContent = w.name;
          row.querySelector('.mmeta').textContent = `${w.category || '其他'} · ${fmtDate(w.at)}`;
          row.querySelector('.mremove').addEventListener('click', () => {
            const cur = load().filter(x => x.id !== w.id);
            save(cur);
            renderMine();
          });
          list.appendChild(row);
        });
        mine.innerHTML = '';
        mine.appendChild(list);
      }
      renderMine();

      // modal
      const scrim  = document.getElementById('scrim');
      const form   = document.getElementById('add-form');
      const cancel = document.getElementById('cancel');
      const fname  = document.getElementById('f-name');

      const ICON_BY_CAT = {
        '饮品': '🧋', '美食': '🍽️', '礼金': '🧧', '鲜花': '💐',
        '手串': '💚', '衣物': '👗', '配饰': '🕶️', '其他': '✦'
      };

      function openModal() {
        scrim.classList.add('show');
        setTimeout(() => fname.focus(), 50);
      }
      function closeModal() {
        scrim.classList.remove('show');
        form.reset();
      }
      cancel.addEventListener('click', closeModal);
      scrim.addEventListener('click', e => { if (e.target === scrim) closeModal(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape' && scrim.classList.contains('show')) closeModal(); });
      form.addEventListener('submit', e => {
        e.preventDefault();
        const data = new FormData(form);
        const name = (data.get('name') || '').toString().trim();
        if (!name) return;
        const category = data.get('category').toString();
        const desc = (data.get('desc') || '').toString().trim();
        addWish({
          source: 'user',
          icon: ICON_BY_CAT[category] || '✦',
          name, category, desc
        });
        closeModal();
      });
    })();
  </script>
</body>
</html>
