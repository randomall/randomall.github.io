<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星座Codex</title>
<style>
:root{
  color-scheme:dark;
  --bg:#070b16; --star:#eef1f8; --muted:#8d93a8; --clay:#e0654a; --peri:#9fb0ff;
  --line:rgba(190,200,230,.18); --line2:rgba(190,200,230,.09);
  --surface:rgba(150,168,220,.05); --surface2:rgba(150,168,220,.09);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#070b16}
body{
  margin:0; background:transparent; color:var(--star); font-family:var(--sans);
  line-height:1.55; -webkit-font-smoothing:antialiased;
  padding:max(20px,5vw) max(18px,4.5vw) 64px; max-width:560px; margin:0 auto;
}

.sky{position:fixed; inset:0; z-index:-1; overflow:hidden;
  background:
    radial-gradient(ellipse 90% 55% at 50% -8%, rgba(86,72,170,.40), transparent 60%),
    radial-gradient(circle at 14% 18%, rgba(44,96,150,.30), transparent 46%),
    radial-gradient(circle at 88% 30%, rgba(126,64,128,.26), transparent 48%),
    radial-gradient(ellipse 120% 60% at 50% 118%, rgba(20,90,104,.34), transparent 58%),
    var(--bg);
}
.stars,.stars2{position:absolute; top:0; left:0; width:1px; height:1px; border-radius:50%; background:transparent; transform:translateZ(0)}
.stars::after,.stars2::after{content:""; position:absolute; top:2000px; left:0; width:1px; height:1px; border-radius:50%; box-shadow:inherit}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-2000px)}}
@keyframes tw{from{opacity:.5}to{opacity:1}}
.stars{animation:drift 170s linear infinite, tw 6s ease-in-out infinite alternate}
.stars2{animation:drift 100s linear infinite, tw 4.2s ease-in-out infinite alternate}

.mono{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--peri)}

header{margin-bottom:26px}
.brand{display:flex; align-items:baseline; gap:10px}
h1{
  font-family:"STXingkai","华文行楷","Xingkai SC","KaiTi","楷体","Segoe Print",cursive;
  font-size:clamp(34px,10vw,50px); font-weight:500; letter-spacing:.08em; margin:0;
  background:linear-gradient(110deg,#ffffff,#bcc6ff 55%,#f0d7c8);
  background-size:220% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:shim 9s ease-in-out infinite;
  text-shadow:0 0 22px rgba(188,198,255,.28), 0 0 46px rgba(224,101,74,.16);
}
@keyframes shim{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.tag{color:var(--muted); font-size:13px; margin:8px 2px 0}

.panel{border:1px solid var(--line); background:var(--surface); padding:18px 16px 16px;
  border-radius:2px; box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 18px 50px rgba(0,0,0,.35)}
.field{margin-bottom:14px}
.field:last-of-type{margin-bottom:18px}
label{display:block; margin-bottom:6px}
.lab{font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted)}
.opt{color:var(--clay); margin-left:6px; letter-spacing:0}
input,select{
  width:100%; font-family:var(--sans); font-size:16px; color:var(--star);
  background:var(--surface2); border:1px solid var(--line); border-radius:2px;
  padding:12px 12px; -webkit-appearance:none; appearance:none;
}
input::placeholder{color:var(--muted)}
input:focus,select:focus{outline:none; border-color:var(--peri); box-shadow:0 0 0 3px rgba(159,176,255,.16)}
.row{display:flex; gap:10px}
.row .field{flex:1}
.seg{display:flex; border:1px solid var(--line); border-radius:2px; overflow:hidden}
.seg button{
  flex:1; font-family:var(--sans); font-size:14px; padding:11px 4px; background:transparent;
  border:none; border-right:1px solid var(--line); color:var(--muted); cursor:pointer;
}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--clay); color:#fff; text-shadow:0 0 12px rgba(224,101,74,.6)}
.go{
  width:100%; font-family:var(--mono); font-size:13px; letter-spacing:.16em; text-transform:uppercase;
  background:linear-gradient(120deg,#e0654a,#c9492f); color:#fff; border:none; border-radius:2px; padding:15px; cursor:pointer;
  box-shadow:0 0 22px rgba(224,101,74,.38), 0 1px 0 rgba(255,255,255,.18) inset;
}
.go:active{filter:brightness(.92)}
.go.alt{background:transparent; color:var(--star); border:1px solid var(--line); box-shadow:none}
.go.alt:active{background:var(--surface2)}
.hint{color:var(--clay); font-size:12.5px; margin:10px 2px 0; min-height:0}

#out{margin-top:30px}
.tabs{display:flex; border-bottom:1px solid var(--line); margin-bottom:20px; overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  font-family:var(--mono); font-size:11.5px; letter-spacing:.12em; text-transform:uppercase;
  background:none; border:none; color:var(--muted); padding:10px 2px 12px; margin-right:24px;
  cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; flex:0 0 auto;
}
.tabs button[aria-selected="true"]{color:var(--star); border-bottom-color:var(--clay); text-shadow:0 0 14px rgba(224,101,74,.4)}

.sign-top{display:flex; align-items:center; gap:18px; margin-bottom:6px}
.glyph{font-size:min(20vw,76px); line-height:.9; color:var(--clay); text-shadow:0 0 26px rgba(224,101,74,.55), 0 0 60px rgba(224,101,74,.25)}
.sign-name{font-size:clamp(24px,7vw,30px); font-weight:650; margin:0}
.sign-en{font-family:var(--mono); font-size:11px; letter-spacing:.18em; color:var(--peri); margin-top:5px}
.sign-meta{font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--muted); margin-top:4px}
.oneline{font-size:17px; margin:18px 0 16px; line-height:1.55}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
.chip{font-size:13px; padding:5px 12px; border:1px solid var(--line); border-radius:2px; color:var(--star); background:var(--surface)}
.facts{display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--line)}
.facts div{padding:13px 2px; border-bottom:1px solid var(--line2)}
.facts div:nth-child(odd){border-right:1px solid var(--line2)}
.facts .k{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.facts .v{font-size:15px; margin-top:3px}

details{border-top:1px solid var(--line); margin-top:20px}
summary{
  list-style:none; cursor:pointer; padding:15px 2px; display:flex; align-items:center;
  font-family:var(--mono); font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted);
}
summary::-webkit-details-marker{display:none}
summary::before{content:"+"; color:var(--clay); font-size:16px; margin-right:10px; transform:translateY(-1px)}
details[open] summary::before{content:"–"}
.drawer{padding:2px 2px 20px; font-size:15px; line-height:1.7; color:#d6dae6}
.drawer p{margin:0 0 12px}
.drawer .sub{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--peri); margin:0 0 4px}
.drawer .blk{margin-bottom:14px}
.drawer .chips{margin:8px 0 10px}
.gemc{margin:0 0 4px; font-size:15px}
.dot{display:inline-block; width:12px; height:12px; border-radius:50%; border:1px solid rgba(255,255,255,.5); vertical-align:-1px; margin-right:8px; box-shadow:0 0 8px rgba(255,255,255,.12)}

.qbox{border-bottom:1px solid var(--line); padding-bottom:20px; margin-bottom:24px}
.qhead{color:var(--muted); font-size:13.5px; margin:0 0 16px}

.f-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:4px}
.f-head h2{font-size:21px; font-weight:600; margin:0; white-space:nowrap}
.f-date{font-family:var(--mono); font-size:11px; letter-spacing:.04em; color:var(--peri); text-align:right}
.f-overall{font-size:14px; color:var(--muted); margin:0 0 22px}
.f-card{border-top:1px solid var(--line); padding:16px 2px}
.f-card:last-of-type{border-bottom:1px solid var(--line)}
.f-card .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:7px}
.f-card .name{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--star)}
.stars-r{font-size:13px; letter-spacing:2px; color:var(--clay); text-shadow:0 0 12px rgba(224,101,74,.45)}
.stars-r .e{color:rgba(190,200,230,.22); text-shadow:none}
.f-card .say{font-size:15.5px; line-height:1.6}
.lucky{display:grid; grid-template-columns:1fr 1fr; gap:0 16px; margin-top:22px; border-top:1px solid var(--line)}
.lucky div{padding:13px 2px; border-bottom:1px solid var(--line2)}
.lucky .k{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.lucky .v{font-size:15px; margin-top:3px}
.note{font-size:13px; color:var(--muted); line-height:1.65; margin:20px 0 0}

.hide{display:none}
footer{margin-top:44px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--muted); text-transform:uppercase}
@media(prefers-reduced-motion:no-preference){
  #out>*{animation:rise .5s ease both}
  @keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
}
@media(prefers-reduced-motion:reduce){ .stars,.stars2{animation:none; opacity:.85} h1{animation:none} }
</style>
</head>

<section id="out" class="hide">

  <div id="p1"></div>
  <div id="p2" class="hide"></div>
  <div id="p3" class="hide">

      <div class="field"><label><span class="lab">日期</span></label><input type="date" id="qdate" min="1900-01-01" max="2099-12-31"></div>

      </div>
      <button class="go alt" id="qgo">看 启 示</button>
      <p class="hint" id="qhint"></p>
    </div>
    <div id="p3out"></div>
  </div>
</section>

<footer>SINGLE FILE · NO TRACKING · 仅供参考娱乐</footer>

function signOf(m,d){
 const x=m*100+d;
 if(x>=321&&x<=419)return 'aries';
 if(x>=420&&x<=520)return 'taurus';
 if(x>=521&&x<=621)return 'gemini';
 if(x>=622&&x<=722)return 'cancer';
 if(x>=723&&x<=822)return 'leo';
 if(x>=823&&x<=922)return 'virgo';
 if(x>=923&&x<=1023)return 'libra';
 if(x>=1024&&x<=1122)return 'scorpio';
 if(x>=1123&&x<=1221)return 'sagittarius';
 if(x>=1222||x<=119)return 'capricorn';
 if(x>=120&&x<=218)return 'aquarius';
 return 'pisces';
}

function h32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function pick(arr,r){return arr[Math.floor(r()*arr.length)];}
function starStr(n){let s='';for(let i=0;i<5;i++)s+= i<n?'★':'<span class="e">★</span>';return s;}
const pad=n=>String(n).padStart(2,'0');

function field(n,maxx,glow){let a=[];for(let i=0;i<n;i++){const x=Math.floor(Math.random()*maxx),y=Math.floor(Math.random()*2000),c=['#fff','#cdd6ff','#bcd0ff','#ffe4d4'][Math.floor(Math.random()*4)];a.push(glow?`${x}px ${y}px 1px .3px ${c}`:`${x}px ${y}px ${c}`);}return a.join(',');}
(function(){const w=Math.max(window.innerWidth,640);
  document.getElementById('stars').style.boxShadow=field(130,w,false);
  document.getElementById('stars2').style.boxShadow=field(46,w,true);})();

let SEX='';

let cur=null;
function ageFrom(d){const t=new Date();let a=t.getFullYear()-d.getFullYear();if(t.getMonth()<d.getMonth()||(t.getMonth()===d.getMonth()&&t.getDate()<d.getDate()))a--;return a;}

function eshiHTML(mode,s,age,seedStr,rightLabel){
  const r=rng32(h32(seedStr));
  const dims=[{key:'lv',name:'爱情'},{key:'cr',name:'事业'},{key:'mn',name:'财运'}];
  const rolled=dims.map(dm=>{const st=2+Math.floor(r()*4);return{...dm,st,say:pick(F[dm.key][st>=3?'hi':'lo'],r)};});
  const ov=Math.round(rolled.reduce((a,b)=>a+b.st,0)/3);
  const ovSay=pick(F.ov[ov>=3?'hi':'lo'],r);
  const color=pick(F.color,r), num=Math.floor(r()*9)+1, yi=pick(F.yi,r), ji=pick(F.ji,r);
  const who=[s.cn, age>0?age+' 岁':'', SEX==='她'?'她':SEX==='他'?'他':''].filter(Boolean).join(' · ');
  const title= mode==='today'?'今日启示':'特定时空启示';
  const cards=[{name:'综合',st:ov,say:ovSay},...rolled].map(c=>`
    <div class="f-card"><div class="top"><span class="name">${c.name}</span><span class="stars-r">${starStr(c.st)}</span></div><div class="say">${c.say}</div></div>`).join('');
  const explain= mode==='today'
   ? '今日启示根据「今天日期 + 你的星座 / 性别 / 年龄」在你手机本地算出来——同一个人当天结果固定,每天会换一批,纯属轻松参考。'
   : '特定时空启示根据「你选的日期 / 时间 / 地点 + 你的星座 / 性别 / 年龄」在本地算出来——同一组输入结果固定,换个时空就换一批。';
  return `
   <div class="f-head"><h2>${title}</h2><span class="f-date">${rightLabel}</span></div>
   <p class="f-overall">${who}</p>
   ${cards}
   <div class="lucky">
     <div><div class="k">幸运色</div><div class="v">${color}</div></div>
     <div><div class="k">幸运数字</div><div class="v">${num}</div></div>
     <div><div class="k">宜</div><div class="v">${yi}</div></div>
     <div><div class="k">忌</div><div class="v">${ji}</div></div>
   </div>
   <details><summary>这启示怎么来的?</summary><div class="drawer">
     <p>${explain}</p>
     <p>它不连任何占星服务,也不上传你的任何信息。真正的好日子,是你自己过出来的。</p>
   </div></details>
   <p class="note">※ 仅供娱乐参考,请别拿它做重要决定喔。</p>`;
}

document.getElementById('go').onclick=()=>{
  const v=document.getElementById('bdate').value;
  const hint=document.getElementById('hint');
  if(!v){hint.textContent='先选一下出生日期吧～'; return;}
  hint.textContent='';
  const [y,m,d]=v.split('-').map(Number);
  const bd=new Date(y,m-1,d);
  const sign=S.find(s=>s.k===signOf(m,d));
  const age=ageFrom(bd);
  cur={sign,age};
  renderSign(sign);
  const t=new Date(), ty=t.getFullYear(), tm=t.getMonth()+1, td=t.getDate();
  const right=`${ty}/${pad(tm)}/${pad(td)}`;
  const seed=`${ty}${tm}${td}|today|${sign.k}|${SEX}|${age}`;
  document.getElementById('p2').innerHTML=eshiHTML('today',sign,age,seed,right);
  const q=document.getElementById('qdate'); if(!q.value) q.value=`${ty}-${pad(tm)}-${pad(td)}`;
  document.getElementById('p3out').innerHTML='';
  document.getElementById('out').classList.remove('hide');
  tab(1);
  document.getElementById('out').scrollIntoView({behavior:'smooth',block:'start'});
};

document.getElementById('qgo').onclick=()=>{
  const qhint=document.getElementById('qhint');
  if(!cur){qhint.textContent='先在上面查一下你的星座吧～'; return;}
  const qv=document.getElementById('qdate').value;
  if(!qv){qhint.textContent='挑个日期吧～'; return;}
  qhint.textContent='';
  const [qy,qm,qd]=qv.split('-').map(Number);
  const qt=document.getElementById('qtime').value;
  const qp=document.getElementById('qplace').value.trim();
  const right=[`${qy}/${pad(qm)}/${pad(qd)}`, qt, qp].filter(Boolean).join(' · ');
  const seed=`${qy}${qm}${qd}|spec|${qt}|${qp}|${cur.sign.k}|${SEX}|${cur.age}`;
  const out=document.getElementById('p3out');
  out.innerHTML=eshiHTML('spec',cur.sign,cur.age,seed,right);
  out.scrollIntoView({behavior:'smooth',block:'start'});
};

function tab(n){
  [1,2,3].forEach(i=>{
    document.getElementById('t'+i).setAttribute('aria-selected', i===n);
    document.getElementById('p'+i).classList.toggle('hide', i!==n);
  });
}
