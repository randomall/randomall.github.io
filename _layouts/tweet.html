<!DOCTYPE html>
<html>
<head>
    <title>Tweet Creation</title>
</head>
<body>
    <h1>Tweet Creation</h1>
    <form action="/tweet" method="POST">
        <textarea name="tweet" rows="4" cols="50"></textarea><br><br>
        <input type="submit" value="Tweet">
    </form>
    {% if page.message %}
    <p>{{ page.message }}</p>
    {% endif %}
</body>
</html>
