<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>手串设计师 · Larme De Sirène</title>
<style>
:root{
  --bg:#0e0e0e;--surface:#181818;--surface2:#222;--border:#2e2e2e;
  --text:#f0ede8;--muted:#888;--accent:#c8a060;--accentH:#d8b070;
  --tray-bg:#1a1208;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;
  background:rgba(255,255,255,.03);border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.logo span{color:var(--muted);font-weight:400}
header h1{font-size:14px;font-weight:600;flex:1}
.hbtn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:6px 14px;font-size:12px;color:var(--text);cursor:pointer;font-weight:600;
  transition:all .15s;white-space:nowrap}
.hbtn:hover{background:var(--accent);border-color:var(--accent);color:#000}
.hbtn.active{background:var(--accent);border-color:var(--accent);color:#000}

.workspace{display:grid;grid-template-columns:220px 1fr 1fr;flex:1;overflow:hidden;gap:0}

/* ── PALETTE PANEL ── */
.palette{display:flex;flex-direction:column;background:var(--surface);
  border-right:1px solid var(--border);overflow:hidden}
.panel-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em;
  padding:10px 14px 6px;text-transform:uppercase;border-bottom:1px solid var(--border)}
.palette-scroll{flex:1;overflow-y:auto;padding:8px}
.palette-scroll::-webkit-scrollbar{width:4px}
.palette-scroll::-webkit-scrollbar-track{background:transparent}
.palette-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.cat-label{font-size:10px;color:var(--muted);padding:6px 4px 3px;letter-spacing:.06em}
.bead-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:4px}
.bead-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;
  border:1.5px solid transparent;border-radius:10px;cursor:pointer;transition:all .15s;
  background:var(--surface2)}
.bead-btn:hover{border-color:var(--border)}
.bead-btn.selected{border-color:var(--accent);background:rgba(200,160,96,.12)}
.bead-btn canvas{border-radius:50%;display:block}
.bead-btn span{font-size:10px;text-align:center;color:var(--muted);line-height:1.2;
  word-break:keep-all}

.size-row{display:flex;flex-wrap:wrap;gap:4px;padding:8px 8px 6px}
.size-btn{flex:1;min-width:30px;padding:5px 4px;text-align:center;font-size:11px;
  font-weight:700;border:1.5px solid var(--border);border-radius:7px;cursor:pointer;
  background:var(--surface2);color:var(--muted);transition:all .15s}
.size-btn:hover{border-color:var(--accent);color:var(--accent)}
.size-btn.selected{border-color:var(--accent);background:rgba(200,160,96,.15);color:var(--accent)}

.acc-grid{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px 10px}
.acc-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;
  border:1.5px solid transparent;border-radius:10px;cursor:pointer;background:var(--surface2);
  transition:all .15s;min-width:52px}
.acc-btn:hover{border-color:var(--border)}
.acc-btn.selected{border-color:var(--accent);background:rgba(200,160,96,.12)}
.acc-btn span{font-size:10px;color:var(--muted)}
.acc-icon{font-size:22px;line-height:1}

/* ── TRAY PANEL ── */
.tray-panel{display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:var(--tray-bg);border-right:1px solid var(--border);
  position:relative;gap:8px;padding:12px}
#trayCanvas{border-radius:50%;cursor:pointer;touch-action:none;display:block}
.tray-hint{font-size:11px;color:rgba(255,255,255,.25);text-align:center;line-height:1.5}
.tray-actions{display:flex;gap:8px}
.tray-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:8px;padding:6px 14px;font-size:12px;color:var(--text);cursor:pointer;
  transition:all .15s}
.tray-btn:hover{background:rgba(255,255,255,.12)}

/* ── 3D PREVIEW PANEL ── */
.preview{display:flex;flex-direction:column;background:#0a0a0a;position:relative}
#threeCanvas{flex:1;display:block;width:100%;height:100%;min-height:0}
.preview-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;
  background:rgba(255,255,255,.03);border-top:1px solid var(--border);flex-shrink:0}
.preview-bar span{font-size:11px;color:var(--muted);flex:1}
.pbtn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:6px 14px;font-size:12px;color:var(--text);cursor:pointer;transition:all .15s}
.pbtn:hover{background:var(--accent);border-color:var(--accent);color:#000}
.pbtn.active{background:rgba(200,160,96,.2);border-color:var(--accent);color:var(--accent)}
.render-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none}
.render-hint p{font-size:13px;color:rgba(255,255,255,.25);line-height:1.8}

/* Mobile */
@media(max-width:700px){
  .workspace{grid-template-columns:1fr;grid-template-rows:auto 300px 1fr}
  .palette{flex-direction:row;overflow-x:auto;overflow-y:hidden;
    border-right:none;border-bottom:1px solid var(--border);max-height:160px}
  .palette-scroll{display:flex;gap:4px;padding:4px;flex-direction:row;overflow-x:auto;min-width:0}
  .bead-grid{display:flex;gap:4px;flex-wrap:nowrap}
  .tray-panel{border-right:none;border-bottom:1px solid var(--border)}
  #trayCanvas{max-width:260px;max-height:260px}
}
</style>
</head>
<body>
<header>
  <span class="logo">LARME DE SIRÈNE <span>人鱼之水手串专门店</span></span>
  <h1>手串设计师</h1>
  <button class="hbtn active" id="viewProduct">平放视图</button>
  <button class="hbtn" id="viewWrist">手腕视图</button>
</header>

<div class="workspace">
  <!-- LEFT: Palette -->
  <aside class="palette">
    <div class="panel-title">珠子</div>
    <div class="palette-scroll">
      <div class="cat-label">透明水晶</div>
      <div class="bead-grid" id="crystalGrid"></div>
      <div class="cat-label">不透明矿石</div>
      <div class="bead-grid" id="opaqueGrid"></div>
    </div>
    <div class="panel-title" style="border-top:1px solid var(--border)">尺寸</div>

    <div class="tray-actions">
      <button class="tray-btn" id="clearBtn">清空</button>

      <button class="tray-btn" id="render3dBtn">→ 渲染3D</button>
    </div>
  </main>

  <!-- RIGHT: 3D Preview -->
  <aside class="preview">
    <canvas id="threeCanvas"></canvas>
    <div class="render-hint" id="renderHint">
      <p>在左侧制作盘设计好手串<br>点击「渲染3D」查看效果</p>
    </div>
    <div class="preview-bar">
      <span id="beadCount">0 颗珠子</span>
      <button class="pbtn active" id="autoRotBtn">⟳ 自动旋转</button>
      <button class="pbtn" id="saveBtn">💾 保存图片</button>
    </div>
  </aside>
</div>

  { id:'obsidian', name:'黑曜石', cat:'opaque',
    tray:{ g:['#606060','#202020','#080808','#000000'], alpha:1 },

  { id:'blue_goldstone', name:'蓝砂石', cat:'opaque',

    tray:{ g:['#8090a8','#404858','#1c2230','#080c18'], alpha:1 },

    special:'labradorite' },
];

const ACCESSORIES = [
  { id:'spacer_silver', name:'银隔片', icon:'○', shape:'spacer', color:0xcccccc },
  { id:'spacer_gold',   name:'金隔片', icon:'◎', shape:'spacer', color:0xc8a040 },
  { id:'charm_ruyi',    name:'如意', icon:'☯', shape:'charm' },
  { id:'charm_peace',   name:'平安扣', icon:'◉', shape:'charm_ring' },
];

const SIZES = [4,6,8,10,12,14,16];
const BEAD_COUNTS = {4:40,6:27,8:20,10:16,12:13,14:11,16:10};
const WRIST_R = 26; // mm — bracelet radius reference

// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
const state = {
  selectedId: null,     // selected bead/acc id
  sizeMm: 8,            // current size
  slots: [],            // array of {id} or null
  viewMode: 'product',  // 'product'|'wrist'
  autoRotate: true,
  rendered: false,
};

function initSlots() {
  const n = BEAD_COUNTS[state.sizeMm];
  const old = state.slots.slice();
  state.slots = Array.from({length:n}, (_,i) => old[i] ?? null);
}

// ══════════════════════════════════════════════════════════════
//  TEXTURE GENERATORS
// ══════════════════════════════════════════════════════════════
const texCache = {};

function mkTex(id, fn) {
  if (texCache[id]) return texCache[id];
  const c = document.createElement('canvas'); c.width = c.height = 256;
  fn(c.getContext('2d'), 256);
  const t = new THREE.CanvasTexture(c);
  texCache[id] = t; return t;
}

function rng(seed) { // simple seeded pseudo-random
  let s = seed;
  return () => { s = (s*16807 + 0) % 2147483647; return (s-1)/2147483646; };
}

function texPhantomGreen() { return mkTex('phg', (ctx,S)=>{
  const r = rng(42);
  for(let i=0;i<10;i++){
    const cx=r()*S,cy=r()*S,rad=20+r()*70;
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
    g.addColorStop(0,`rgba(8,22,14,${.35+r()*.45})`);
    g.addColorStop(.5,`rgba(15,35,20,${.15+r()*.2})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.fill();
  }
}); }

function texWispGreen() { return mkTex('wsg', (ctx,S)=>{
  const r=rng(99);
  ctx.lineWidth=2;
  for(let i=0;i<14;i++){
    const x1=r()*S,y1=r()*S,x2=r()*S,y2=r()*S;
    const g=ctx.createLinearGradient(x1,y1,x2,y2);
    const a=.4+r()*.6;
    g.addColorStop(0,'rgba(0,120,50,0)');
    g.addColorStop(.5,`rgba(20,180,70,${a})`);
    g.addColorStop(1,'rgba(0,80,30,0)');
    ctx.strokeStyle=g; ctx.lineWidth=1+r()*5;
    ctx.beginPath(); ctx.moveTo(x1,y1);
    ctx.bezierCurveTo(r()*S,r()*S,r()*S,r()*S,x2,y2);
    ctx.stroke();
  }
}); }

function texGoldstone(blue) { return mkTex(blue?'gsb':'gsr', (ctx,S)=>{
  ctx.fillStyle=blue?'#050d28':'#280a00';
  ctx.fillRect(0,0,S,S);
  const r=rng(blue?11:22);
  for(let i=0;i<600;i++){
    const x=r()*S,y=r()*S,sz=.4+r()*2.2;
    const br=.5+r()*.5;
    const col=blue?`rgba(80,120,255,${br})`:`rgba(255,140,40,${br})`;
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,sz,0,Math.PI*2); ctx.fill();
  }
}); }

function texTigersEye() { return mkTex('tge', (ctx,S)=>{
  const r=rng(7);
  for(let y=0;y<S;y++){
    const v=(Math.sin(y*.07+.5)*.5+.5)*.7+Math.sin(y*.23)*.1+.15;
    const R=Math.round(160+v*80),G=Math.round(90+v*50),B=Math.round(0+v*10);
    ctx.fillStyle=`rgb(${R},${G},${B})`; ctx.fillRect(0,y,S,1);
  }
  // chatoyant sheen
  const g=ctx.createLinearGradient(0,0,S,0);
  g.addColorStop(0,'rgba(255,220,80,0)');
  g.addColorStop(.45,'rgba(255,240,160,.45)');
  g.addColorStop(.55,'rgba(255,240,160,.45)');
  g.addColorStop(1,'rgba(255,220,80,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,S,S);
}); }

function texLapis() { return mkTex('lap', (ctx,S)=>{
  ctx.fillStyle='#101848'; ctx.fillRect(0,0,S,S);
  const r=rng(3);
  for(let i=0;i<8;i++){
    const g=ctx.createRadialGradient(r()*S,r()*S,0,r()*S,r()*S,60+r()*60);
    g.addColorStop(0,`rgba(5,15,80,${.4+r()*.3})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,S,S);
  }
  for(let i=0;i<40;i++){
    ctx.fillStyle=`rgba(220,185,0,${.3+r()*.7})`;
    ctx.fillRect(r()*S,r()*S,r()*4+1,r()*4+1);
  }
}); }

function texMalachite() { return mkTex('mal', (ctx,S)=>{
  const r=rng(5);
  for(let i=0;i<12;i++){
    const cx=r()*S*1.2-S*.1,cy=r()*S*1.2-S*.1,base=20+r()*60;
    for(let j=0;j<6;j++){
      const rad=base+j*14;
      ctx.strokeStyle=j%2===0?`rgba(15,100,40,.9)`:`rgba(40,180,70,.85)`;
      ctx.lineWidth=5+r()*4;
      ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.stroke();
    }
  }
}); }

function texRedAgate() { return mkTex('rag', (ctx,S)=>{
  for(let y=0;y<S;y++){
    const v=Math.sin(y*.06)*Math.cos(y*.03+.5)*.4+.6;
    const R=Math.round(180+v*60),G=Math.round(20+v*30),B=Math.round(5+v*10);
    ctx.fillStyle=`rgb(${R},${G},${B})`; ctx.fillRect(0,y,S,1);
  }
}); }

function texLabradorite() { return mkTex('lab', (ctx,S)=>{
  ctx.fillStyle='#1a2030'; ctx.fillRect(0,0,S,S);
  const r=rng(9);
  for(let i=0;i<6;i++){
    const x=r()*S,y=r()*S,w=40+r()*80,h=20+r()*40;
    const g=ctx.createLinearGradient(x-w,y,x+w,y);
    const hue=180+r()*60;
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(.5,`hsla(${hue},80%,60%,.6)`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(x-w,y-h,w*2,h*2);
  }
}); }

function texRutileGold() { return mkTex('rtg', (ctx,S)=>{
  const r=rng(17);
  ctx.clearRect(0,0,S,S);
  for(let i=0;i<20;i++){
    const x1=r()*S,y1=r()*S,dx=(r()-.5)*S*.6,dy=(r()-.5)*S*.6;
    const g=ctx.createLinearGradient(x1,y1,x1+dx,y1+dy);
    const a=.5+r()*.5;
    g.addColorStop(0,'rgba(220,180,0,0)');
    g.addColorStop(.5,`rgba(255,210,20,${a})`);
    g.addColorStop(1,'rgba(180,130,0,0)');
    ctx.strokeStyle=g; ctx.lineWidth=1+r()*3;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x1+dx,y1+dy); ctx.stroke();
  }
}); }

function texStrawberry() { return mkTex('stw', (ctx,S)=>{
  ctx.clearRect(0,0,S,S);
  const r=rng(23);
  for(let i=0;i<30;i++){
    const x=r()*S,y=r()*S,sz=2+r()*8;
    ctx.fillStyle=`rgba(180,20,20,${.4+r()*.6})`;
    ctx.beginPath(); ctx.arc(x,y,sz,0,Math.PI*2); ctx.fill();
  }
}); }

// ══════════════════════════════════════════════════════════════
//  2D TRAY
// ══════════════════════════════════════════════════════════════
const trayC = document.getElementById('trayCanvas');
const trayCtx = trayC.getContext('2d');
let TRAY_SIZE = 360;
let hoverSlot = -1;

function resizeTray() {
  const panel = document.querySelector('.tray-panel');
  const avail = Math.min(panel.clientWidth - 40, panel.clientHeight - 120);
  TRAY_SIZE = Math.max(220, Math.min(avail, 400));
  trayC.width = trayC.height = TRAY_SIZE;
  trayC.style.width = trayC.style.height = TRAY_SIZE + 'px';
  drawTray();
}

function beadRatioOnTray() {
  const n = state.slots.length;
  const TRAY_R = TRAY_SIZE * .36;
  const circum = 2 * Math.PI * TRAY_R;
  return Math.min(circum / n * .48, TRAY_SIZE * .09);
}

function drawTray() {
  const S = TRAY_SIZE, cx = S/2, cy = S/2;
  const TRAY_R = S * .36;
  const bR = beadRatioOnTray();
  const n = state.slots.length;
  trayCtx.clearRect(0,0,S,S);

  // Tray dish
  const dg = trayCtx.createRadialGradient(cx-S*.08,cy-S*.08,0,cx,cy,S*.48);
  dg.addColorStop(0,'#2a1e0c');
  dg.addColorStop(.7,'#1a1208');
  dg.addColorStop(1,'#0e0a04');
  trayCtx.beginPath(); trayCtx.arc(cx,cy,S*.47,0,Math.PI*2);
  trayCtx.fillStyle=dg; trayCtx.fill();
  // Rim highlight
  trayCtx.beginPath(); trayCtx.arc(cx,cy,S*.47,0,Math.PI*2);
  trayCtx.strokeStyle='rgba(200,160,80,.3)'; trayCtx.lineWidth=2; trayCtx.stroke();
  // Inner groove circle
  trayCtx.beginPath(); trayCtx.arc(cx,cy,TRAY_R,0,Math.PI*2);
  trayCtx.strokeStyle='rgba(200,160,80,.15)'; trayCtx.lineWidth=bR*2.2;
  trayCtx.stroke();
  // Center logo hint
  trayCtx.font=`${S*.035}px serif`;
  trayCtx.fillStyle='rgba(200,160,80,.15)';
  trayCtx.textAlign='center'; trayCtx.textBaseline='middle';
  trayCtx.fillText('LARME', cx, cy);

  // Beads
  for(let i=0;i<n;i++){
    const angle = (i/n)*Math.PI*2 - Math.PI/2;
    const bx = cx + Math.cos(angle)*TRAY_R;
    const by = cy + Math.sin(angle)*TRAY_R;
    const isHover = i===hoverSlot;
    const isSelected = state.selectedSlotIdx===i;
    drawBead2D(trayCtx, bx, by, bR, state.slots[i], isHover, isSelected);
  }
}

function drawBead2D(ctx, cx, cy, r, beadId, hover, selected) {
  if(!beadId) {
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle = hover ? 'rgba(200,160,80,.7)' : 'rgba(255,255,255,.2)';
    ctx.lineWidth = hover ? 1.5 : 1;
    ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
    if(hover){ ctx.fillStyle='rgba(200,160,80,.08)'; ctx.fill(); }
    return;
  }
  const bead = BEADS.find(b=>b.id===beadId) || ACCESSORIES.find(a=>a.id===beadId);
  if(!bead) return;

  // Shadow
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=r*.6; ctx.shadowOffsetY=r*.2;

  if(bead.icon) {
    // Accessory
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle=bead.shape==='spacer'?
      (bead.color===0xc8a040?'#c8a040':'#cccccc'):'#888';
    ctx.fill();
  } else {
    const {g,alpha} = bead.tray;
    const grad = ctx.createRadialGradient(cx-r*.38,cy-r*.4,r*.04,cx,cy,r);
    grad.addColorStop(0,g[0]); grad.addColorStop(.35,g[1]);
    grad.addColorStop(.72,g[2]); grad.addColorStop(1,g[3]);
    ctx.globalAlpha = alpha ?? 1;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle=grad; ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();

  // Specular highlight
  const hl=ctx.createRadialGradient(cx-r*.32,cy-r*.38,0,cx-r*.18,cy-r*.25,r*.6);
  hl.addColorStop(0,'rgba(255,255,255,.92)');
  hl.addColorStop(.35,'rgba(255,255,255,.35)');
  hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle=hl; ctx.fill();

  // Bottom rim glow
  const hl2=ctx.createRadialGradient(cx+r*.28,cy+r*.32,0,cx+r*.15,cy+r*.2,r*.45);
  hl2.addColorStop(0,'rgba(255,255,255,.18)');
  hl2.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle=hl2; ctx.fill();

  // Selection ring
  if(selected||hover){
    ctx.beginPath(); ctx.arc(cx,cy,r+2,0,Math.PI*2);
    ctx.strokeStyle=selected?'rgba(200,160,80,1)':'rgba(200,160,80,.5)';
    ctx.lineWidth=selected?2:1.5; ctx.stroke();
  }
}

function slotAtPoint(x,y) {
  const S=TRAY_SIZE, TRAY_R=S*.36, n=state.slots.length;
  const bR=beadRatioOnTray();
  for(let i=0;i<n;i++){
    const angle=(i/n)*Math.PI*2-Math.PI/2;
    const bx=S/2+Math.cos(angle)*TRAY_R, by=S/2+Math.sin(angle)*TRAY_R;
    const dx=x-bx,dy=y-by;
    if(dx*dx+dy*dy<=bR*bR*1.2) return i;
  }
  return -1;
}

function getXY(e) {
  const rect=trayC.getBoundingClientRect();
  const scale=TRAY_SIZE/rect.width;
  if(e.touches) return {x:(e.touches[0].clientX-rect.left)*scale,y:(e.touches[0].clientY-rect.top)*scale};
  return {x:(e.clientX-rect.left)*scale,y:(e.clientY-rect.top)*scale};
}

let longPressTimer=null;
trayC.addEventListener('mousemove',e=>{const{x,y}=getXY(e);hoverSlot=slotAtPoint(x,y);drawTray();});
trayC.addEventListener('mouseleave',()=>{hoverSlot=-1;drawTray();});
trayC.addEventListener('click',e=>{
  const{x,y}=getXY(e);const i=slotAtPoint(x,y);
  if(i<0)return;
  if(state.selectedId){ state.slots[i]=state.selectedId; }
  else { state.slots[i]=null; }
  drawTray(); updateBeadCount();
  if(state.rendered) buildBracelet();
});
trayC.addEventListener('contextmenu',e=>{
  e.preventDefault();const{x,y}=getXY(e);const i=slotAtPoint(x,y);
  if(i>=0){state.slots[i]=null;drawTray();updateBeadCount();}
});
trayC.addEventListener('touchstart',e=>{
  const{x,y}=getXY(e); const i=slotAtPoint(x,y); if(i<0)return;
  longPressTimer=setTimeout(()=>{state.slots[i]=null;drawTray();updateBeadCount();},500);
},{passive:true});
trayC.addEventListener('touchend',()=>{clearTimeout(longPressTimer);},{passive:true});

const scene=new THREE.Scene();

// Ground (for product view)

// Wrist (hidden by default)
const wristGeo=new THREE.CylinderGeometry(WRIST_R,WRIST_R+2,90,48);
const wristMat=new THREE.MeshPhysicalMaterial({color:0xc8a080,roughness:.65,metalness:0});
const wrist=new THREE.Mesh(wristGeo,wristMat);
wrist.castShadow=true; wrist.receiveShadow=true;
wrist.rotation.z=Math.PI/2; wrist.visible=false;

let braceletGroup=null;
const matCache={};

function getMaterial(beadId) {
  if(matCache[beadId]) return matCache[beadId];
  const bead=BEADS.find(b=>b.id===beadId);
  if(!bead){ matCache[beadId]=new THREE.MeshStandardMaterial({color:0x888888}); return matCache[beadId]; }
  const {m3,special}=bead;

  let map=null,roughMap=null;
  if(special==='goldstone_blue') map=texGoldstone(true);
  else if(special==='goldstone_red') map=texGoldstone(false);
  else if(special==='tigers_eye') map=texTigersEye();
  else if(special==='lapis') map=texLapis();
  else if(special==='malachite') map=texMalachite();
  else if(special==='agate_red') map=texRedAgate();
  else if(special==='labradorite') map=texLabradorite();
  else if(special==='rutile_gold') map=texRutileGold();

  const props={
    color:m3.color, roughness:m3.roughness??0,
    metalness:m3.metalness??0, envMapIntensity:m3.envI??1.5,
  };
  if(m3.transmission>0){
    props.transmission=m3.transmission; props.transparent=true;
    props.ior=m3.ior??1.5; props.thickness=m3.thick??8;
    if(m3.att){ props.attenuationColor=new THREE.Color(m3.att); props.attenuationDistance=m3.attD??20; }
  }
  if(map) props.map=map;

  const mat=new THREE.MeshPhysicalMaterial(props);
  matCache[beadId]=mat; return mat;
}

function buildBeadMesh(beadId, radius) {
  const seg=radius>6?32:24;
  const bead=BEADS.find(b=>b.id===beadId);
  const acc=ACCESSORIES.find(a=>a.id===beadId);

  if(acc) {
    if(acc.shape==='spacer'){
      const g=new THREE.CylinderGeometry(radius*.9,radius*.9,radius*.4,24);
      const m=new THREE.MeshPhysicalMaterial({color:acc.color,metalness:.85,roughness:.1});
      return new THREE.Mesh(g,m);
    }
    if(acc.shape==='charm_ring'){
      const g=new THREE.TorusGeometry(radius*.6,radius*.2,16,32);
      const m=new THREE.MeshPhysicalMaterial({color:0xdddddd,metalness:.9,roughness:.08});
      return new THREE.Mesh(g,m);
    }
    const g=new THREE.SphereGeometry(radius*.7,24,24);
    const m=new THREE.MeshPhysicalMaterial({color:0xdddddd,metalness:.8,roughness:.1});
    return new THREE.Mesh(g,m);
  }

  if(!bead) return null;

  if(bead.special==='phantom_green'){
    const grp=new THREE.Group();
    // Outer shell
    const shellMat=getMaterial(beadId);
    grp.add(new THREE.Mesh(new THREE.SphereGeometry(radius,seg,seg),shellMat));
    // Phantom inclusions
    const phantomMat=new THREE.MeshPhysicalMaterial({
      map:texPhantomGreen(),transparent:true,opacity:.72,roughness:.3,side:THREE.FrontSide
    });
    grp.add(new THREE.Mesh(new THREE.SphereGeometry(radius*.68,20,20),phantomMat));
    // Green wisps
    const wispMat=new THREE.MeshPhysicalMaterial({
      map:texWispGreen(),transparent:true,opacity:.6,roughness:.4,
      emissive:new THREE.Color(0x0a3010),emissiveIntensity:.4
    });
    grp.add(new THREE.Mesh(new THREE.SphereGeometry(radius*.52,18,18),wispMat));
    return grp;
  }

  if(bead.special==='strawberry'){
    const grp=new THREE.Group();
    grp.add(new THREE.Mesh(new THREE.SphereGeometry(radius,seg,seg),getMaterial(beadId)));
    const inclMat=new THREE.MeshPhysicalMaterial({map:texStrawberry(),transparent:true,opacity:.55,roughness:.2});
    grp.add(new THREE.Mesh(new THREE.SphereGeometry(radius*.72,20,20),inclMat));
    return grp;
  }

  if(bead.special==='rutile_gold'){
    const grp=new THREE.Group();
    grp.add(new THREE.Mesh(new THREE.SphereGeometry(radius,seg,seg),getMaterial(beadId)));
    const needleMat=new THREE.MeshPhysicalMaterial({map:texRutileGold(),transparent:true,opacity:.65,roughness:.15,
      emissive:new THREE.Color(0x302000),emissiveIntensity:.5});
    grp.add(new THREE.Mesh(new THREE.SphereGeometry(radius*.65,18,18),needleMat));
    return grp;
  }

  if(bead.special==='moonstone'){
    const grp=new THREE.Group();
    grp.add(new THREE.Mesh(new THREE.SphereGeometry(radius,seg,seg),getMaterial(beadId)));
    // Blue adularescence layer
    const aMat=new THREE.MeshPhysicalMaterial({
      color:0x8090ff,transparent:true,opacity:.2,roughness:.0,
      transmission:.3,ior:1.4,emissive:new THREE.Color(0x2030c0),emissiveIntensity:.15
    });
    grp.add(new THREE.Mesh(new THREE.SphereGeometry(radius*.96,seg,seg),aMat));
    return grp;
  }

  const mesh=new THREE.Mesh(new THREE.SphereGeometry(radius,seg,seg),getMaterial(beadId));
  mesh.castShadow=true; mesh.receiveShadow=true;
  return mesh;
}

function buildBracelet() {
  if(braceletGroup){ scene.remove(braceletGroup); braceletGroup.traverse(o=>{
    if(o.geometry)o.geometry.dispose();
  }); }
  braceletGroup=new THREE.Group();

  const sizeMm=state.sizeMm;
  const beadR=sizeMm/2;
  const n=state.slots.length;

  let bracR; // bracelet ring radius (distance from center to bead center)
  if(state.viewMode==='wrist'){
    bracR=WRIST_R+beadR+.5;
  } else {
    bracR=n*beadR*1.02/Math.PI; // fit beads in circle
  }

  for(let i=0;i<n;i++){
    const id=state.slots[i];
    if(!id) continue;
    const angle=(i/n)*Math.PI*2;
    const x=Math.cos(angle)*bracR, z=Math.sin(angle)*bracR;
    const mesh=buildBeadMesh(id,beadR);
    if(!mesh) continue;
    mesh.position.set(x,0,z);
    // Rotate bead so its "north pole" faces outward (good for chatoyant stones)
    mesh.rotation.y=angle+Math.PI/2;
    if(mesh instanceof THREE.Mesh){ mesh.castShadow=true; mesh.receiveShadow=true; }
    braceletGroup.add(mesh);
  }

  // Elastic cord (thin dark tube through center of beads)
  const points=[];
  for(let i=0;i<=64;i++){
    const angle=(i/64)*Math.PI*2;
    points.push(new THREE.Vector3(Math.cos(angle)*bracR,0,Math.sin(angle)*bracR));
  }
  const cordGeo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points,true),128,beadR*.08,8,true);
  const cordMat=new THREE.MeshStandardMaterial({color:0x111111,roughness:.9});
  braceletGroup.add(new THREE.Mesh(cordGeo,cordMat));

  scene.add(braceletGroup);
  updateCamera();
  document.getElementById('renderHint').style.display='none';
  state.rendered=true;
}

function updateCamera() {
  const sizeMm=state.sizeMm, beadR=sizeMm/2;
  const n=state.slots.length;
  const bracR=state.viewMode==='wrist'?WRIST_R+beadR+.5:n*beadR*1.02/Math.PI;

  if(state.viewMode==='wrist'){
    camera.position.set(0,bracR*1.4+20,bracR*2.2+30);
    controls.target.set(0,0,0);
    wrist.visible=true; ground.visible=false;
    controls.autoRotateSpeed=.8;
  } else {
    camera.position.set(0,bracR*1.6+30,bracR*.4+10);
    controls.target.set(0,-2,0);
    wrist.visible=false; ground.visible=true;
    camera.lookAt(0,0,0);
    controls.autoRotateSpeed=.4;
  }
  controls.update();
}

  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}

function drawPaletteIcon(bead,size=36) {
  const c=document.createElement('canvas'); c.width=c.height=size;
  const ctx=c.getContext('2d'); const r=size/2-2, cx=size/2, cy=size/2;
  if(bead.icon){
    ctx.font=`${size*.55}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=bead.shape==='spacer'?(bead.color===0xc8a040?'#c8a040':'#ccc'):'#aaa';
    ctx.fillText(bead.icon,cx,cy); return c;
  }
  const {g,alpha}=bead.tray;
  const grad=ctx.createRadialGradient(cx-r*.38,cy-.4*r,r*.04,cx,cy,r);
  grad.addColorStop(0,g[0]); grad.addColorStop(.35,g[1]);
  grad.addColorStop(.72,g[2]); grad.addColorStop(1,g[3]);
  ctx.globalAlpha=alpha??1;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();
  ctx.globalAlpha=1;
  const hl=ctx.createRadialGradient(cx-r*.32,cy-r*.38,0,cx-r*.18,cy-r*.25,r*.6);
  hl.addColorStop(0,'rgba(255,255,255,.9)'); hl.addColorStop(.4,'rgba(255,255,255,.3)');
  hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=hl; ctx.fill();
  return c;
}

function renderPalette() {
  const crystalGrid=document.getElementById('crystalGrid');
  const opaqueGrid=document.getElementById('opaqueGrid');
  crystalGrid.innerHTML=''; opaqueGrid.innerHTML='';

  BEADS.forEach(bead=>{
    const btn=document.createElement('div');
    btn.className='bead-btn'; btn.dataset.id=bead.id;
    const icon=drawPaletteIcon(bead,38);
    btn.appendChild(icon);
    const label=document.createElement('span'); label.textContent=bead.name;
    btn.appendChild(label);
    btn.addEventListener('click',()=>selectItem(bead.id));
    (bead.cat==='crystal'?crystalGrid:opaqueGrid).appendChild(btn);
  });

  const accGrid=document.getElementById('accGrid');
  accGrid.innerHTML='';
  ACCESSORIES.forEach(acc=>{
    const btn=document.createElement('div');
    btn.className='acc-btn'; btn.dataset.id=acc.id;
    const icon=document.createElement('div'); icon.className='acc-icon'; icon.textContent=acc.icon;
    btn.appendChild(icon);
    const label=document.createElement('span'); label.textContent=acc.name;
    btn.appendChild(label);
    btn.addEventListener('click',()=>selectItem(acc.id));
    accGrid.appendChild(btn);
  });
}

function renderSizes() {
  const row=document.getElementById('sizeRow'); row.innerHTML='';
  SIZES.forEach(s=>{
    const btn=document.createElement('button');
    btn.className='size-btn'+(s===state.sizeMm?' selected':'');
    btn.textContent=s+'mm';
    btn.addEventListener('click',()=>{
      state.sizeMm=s; initSlots(); renderSizes(); drawTray(); updateBeadCount();
      if(state.rendered) buildBracelet();
    });
    row.appendChild(btn);
  });
}

function selectItem(id) {
  state.selectedId=state.selectedId===id?null:id;
  document.querySelectorAll('.bead-btn,.acc-btn').forEach(b=>{
    b.classList.toggle('selected',b.dataset.id===state.selectedId);
  });
}

function updateBeadCount() {
  const total=state.slots.filter(Boolean).length;
  document.getElementById('beadCount').textContent=`${total} / ${state.slots.length} 颗珠子`;
}

// ── Controls ────────────────────────────────────────────────
document.getElementById('clearBtn').addEventListener('click',()=>{
  state.slots.fill(null); drawTray(); updateBeadCount();
  if(state.rendered) buildBracelet();
});
document.getElementById('randomBtn').addEventListener('click',()=>{
  const ids=BEADS.map(b=>b.id);
  state.slots=state.slots.map(()=>ids[Math.floor(Math.random()*ids.length)]);
  drawTray(); updateBeadCount();
  if(state.rendered) buildBracelet();
});
document.getElementById('render3dBtn').addEventListener('click',()=>{
  buildBracelet(); updateCamera();
});

document.getElementById('viewProduct').addEventListener('click',function(){
  state.viewMode='product'; this.classList.add('active');
  document.getElementById('viewWrist').classList.remove('active');
  if(state.rendered){buildBracelet();updateCamera();}
});
document.getElementById('viewWrist').addEventListener('click',function(){
  state.viewMode='wrist'; this.classList.add('active');
  document.getElementById('viewProduct').classList.remove('active');
  if(state.rendered){buildBracelet();updateCamera();}
});

const autoRotBtn=document.getElementById('autoRotBtn');
autoRotBtn.addEventListener('click',()=>{
  state.autoRotate=!state.autoRotate;
  controls.autoRotate=state.autoRotate;
  autoRotBtn.classList.toggle('active',state.autoRotate);
  autoRotBtn.textContent=state.autoRotate?'⟳ 自动旋转':'⟳ 手动';
});

document.getElementById('saveBtn').addEventListener('click',()=>{
  renderer.render(scene,camera);
  const a=document.createElement('a');
  a.href=threeC.toDataURL('image/png');
  a.download='larme-bracelet.png'; a.click();
});

// ── Init ─────────────────────────────────────────────────────
initSlots();
renderPalette();
renderSizes();
resizeTray();
resizeRenderer();
drawTray();
updateBeadCount();
</script>
</body>
</html>
