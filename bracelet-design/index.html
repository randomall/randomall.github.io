<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>手串设计师 · Larme De Sirène</title>
<style>
:root{
  --bg:#f5ede0;--surface:#fff8f0;--surface2:#efe4d4;--border:#ddd0b8;
  --text:#2a1a0a;--muted:#9a8060;--accent:#c8804a;--tray-bg:#e8dcc4;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);
  font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
  display:flex;flex-direction:column;height:100dvh;user-select:none}

/* ── HEADER ── */
header{display:flex;align-items:center;gap:10px;padding:8px 14px;
  background:rgba(255,255,255,.03);border-bottom:1px solid var(--border);
  flex-shrink:0;height:48px}
.logo{font-size:12px;font-weight:800;letter-spacing:.07em;color:var(--accent);flex:1}
.logo small{display:block;font-size:10px;font-weight:400;color:var(--muted);letter-spacing:.04em}
.hbtn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:6px 12px;font-size:12px;color:var(--text);cursor:pointer;font-weight:600;
  transition:all .15s;white-space:nowrap;min-height:34px}
.hbtn:hover,.hbtn.active{background:var(--accent);border-color:var(--accent);color:#000}

/* ── LAYOUT ── */
/* Mobile-first: vertical stack */
.app-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* Tray area — main view on mobile */
.tray-area{flex:1;min-height:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:var(--tray-bg);
  position:relative;padding:10px 10px 6px}
#trayCanvas{touch-action:none;cursor:pointer;display:block;max-width:100%;max-height:100%}
.tray-btns{display:flex;gap:8px;margin-top:8px;flex-shrink:0}
.tbtn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-radius:8px;padding:7px 14px;font-size:12px;color:var(--text);cursor:pointer;
  transition:background .15s;min-height:36px;font-weight:600}
.tbtn:hover{background:rgba(255,255,255,.14)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#000}
.tbtn.primary:hover{background:#d8b070}

/* Bottom palette — mobile horizontal strip */
.bottom-bar{flex-shrink:0;background:var(--surface);
  border-top:1px solid var(--border);display:flex;flex-direction:column}

.size-strip{display:flex;gap:5px;padding:7px 12px;
  overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);flex-shrink:0}
.size-strip::-webkit-scrollbar{display:none}
.sbtn{flex-shrink:0;padding:5px 10px;font-size:12px;font-weight:700;
  border:1.5px solid var(--border);border-radius:7px;cursor:pointer;
  background:var(--surface2);color:var(--muted);transition:all .15s;min-height:30px}
.sbtn.active{border-color:var(--accent);color:var(--accent);background:rgba(200,160,96,.12)}
.wrist-row{display:flex;align-items:center;gap:8px;padding:6px 12px;
  border-bottom:1px solid var(--border);flex-shrink:0;font-size:12px}
.wrist-label{color:var(--muted);flex-shrink:0}
.wrist-val{color:var(--accent);font-weight:700;min-width:48px;text-align:center}
.wbtn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;
  width:28px;height:28px;cursor:pointer;color:var(--text);font-size:16px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .15s;line-height:1}
.wbtn:hover{background:var(--accent);color:#000;border-color:var(--accent)}
.wrist-info{font-size:10px;color:var(--muted);flex:1;text-align:right}

.bead-strip{display:flex;gap:8px;padding:8px 12px;
  overflow-x:auto;scrollbar-width:none;align-items:center;flex-shrink:0;min-height:82px}
.bead-strip::-webkit-scrollbar{display:none}
.bead-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px 7px;border:1.5px solid transparent;border-radius:10px;cursor:pointer;
  background:var(--surface2);transition:all .15s;min-width:54px}
.bead-btn:hover{border-color:var(--border)}
.bead-btn.selected{border-color:var(--accent);background:rgba(200,160,96,.13)}
.bead-btn canvas{border-radius:50%;display:block}
.bead-btn span{font-size:10px;text-align:center;color:var(--muted);line-height:1.2;
  white-space:nowrap;max-width:52px;overflow:hidden;text-overflow:ellipsis}
.acc-sep{width:1px;background:var(--border);flex-shrink:0;height:50px;margin:0 4px}

/* ── 3D PREVIEW OVERLAY (mobile full-screen) ── */
.preview-overlay{position:fixed;inset:0;z-index:200;background:#1a1410;
  flex-direction:column;display:none}
.preview-overlay.open{display:flex}
.preview-topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;
  background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0;color:#f0ede8}
.preview-topbar .back{font-size:18px;cursor:pointer;padding:4px 8px;color:var(--muted)}
.preview-topbar .back:hover{color:var(--text)}
.preview-topbar .title{flex:1;font-size:13px;font-weight:700}
#threeCanvas{flex:1;display:block;width:100%;min-height:0}
.preview-btmbar{display:flex;align-items:center;gap:8px;padding:8px 14px;
  background:rgba(255,255,255,.03);border-top:1px solid var(--border);flex-shrink:0;
  flex-wrap:wrap}
#beadCountLbl{font-size:11px;color:var(--muted);flex:1}
.pbtn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:7px 13px;font-size:12px;color:var(--text);cursor:pointer;
  transition:all .15s;min-height:34px;font-weight:600}
.pbtn:hover{background:var(--accent);border-color:var(--accent);color:#000}
.pbtn.active{background:rgba(200,160,96,.2);border-color:var(--accent);color:var(--accent)}

/* ── DESKTOP: 3-column layout ── */
@media(min-width:768px){
  .app-body{flex-direction:row}
  /* Left: vertical palette */
  .bottom-bar{flex-direction:column;width:180px;border-top:none;
    border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
  .size-strip{flex-direction:column;border-bottom:none;border-top:1px solid var(--border);
    overflow-x:visible;overflow-y:visible;flex-wrap:wrap;gap:4px;padding:8px}
  .wrist-row{flex-wrap:wrap;}
  .sbtn{flex:none}
  .bead-strip{flex-direction:column;overflow-y:auto;overflow-x:hidden;
    min-height:0;padding:8px;flex:1}
  .bead-btn{width:100%;min-width:unset;flex-direction:row;gap:8px;padding:6px 8px}
  .bead-btn canvas{flex-shrink:0}
  .bead-btn span{font-size:11px;text-align:left;max-width:none}
  .acc-sep{width:100%;height:1px;margin:4px 0}
  /* Tray: middle column */
  .tray-area{flex:1}
  /* 3D: right column, always visible (not overlay) */
  .preview-overlay{position:static;display:flex !important;flex:1;z-index:auto}
  .preview-topbar .back{display:none}
  .show3d-btn{display:none} /* no need for open button on desktop */
}
</style>

    })
  ));
}

function beadCount(sizeMm, wristMm) {
  // beads fit around the circumference with ~2% gap
  return Math.max(3, Math.floor((wristMm * 1.02) / sizeMm));
}

}

const texCache={};
function mkTex(id,fn){if(texCache[id])return texCache[id];const c=document.createElement('canvas');c.width=c.height=256;fn(c.getContext('2d'),256);const t=new THREE.CanvasTexture(c);texCache[id]=t;return t;}
function rng(s){let v=s;return()=>{v=(v*16807)%2147483647;return(v-1)/2147483646;};}

function texPhantomGreen(){return mkTex('phg',(ctx,S)=>{const r=rng(42);for(let i=0;i<10;i++){const cx=r()*S,cy=r()*S,rad=18+r()*65;const g=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);g.addColorStop(0,`rgba(6,18,10,${.3+r()*.45})`);g.addColorStop(.5,`rgba(12,30,16,${.12+r()*.18})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fill();}});}
function texWispGreen(){return mkTex('wsg',(ctx,S)=>{const r=rng(99);for(let i=0;i<14;i++){const x1=r()*S,y1=r()*S,x2=r()*S,y2=r()*S;const g=ctx.createLinearGradient(x1,y1,x2,y2);g.addColorStop(0,'rgba(0,100,40,0)');g.addColorStop(.5,`rgba(20,170,60,${.35+r()*.55})`);g.addColorStop(1,'rgba(0,70,25,0)');ctx.strokeStyle=g;ctx.lineWidth=1+r()*5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.bezierCurveTo(r()*S,r()*S,r()*S,r()*S,x2,y2);ctx.stroke();}});}
function texGoldstone(blue){return mkTex(blue?'gsb':'gsr',(ctx,S)=>{ctx.fillStyle=blue?'#04102a':'#240800';ctx.fillRect(0,0,S,S);const r=rng(blue?11:22);for(let i=0;i<600;i++){const x=r()*S,y=r()*S,sz=.3+r()*2;const br=.5+r()*.5;ctx.fillStyle=blue?`rgba(70,110,255,${br})`:`rgba(255,130,30,${br})`;ctx.beginPath();ctx.arc(x,y,sz,0,Math.PI*2);ctx.fill();}});}
function texTigersEye(){return mkTex('tge',(ctx,S)=>{for(let y=0;y<S;y++){const v=(Math.sin(y*.07+.5)*.5+.5)*.7+Math.sin(y*.22)*.08+.15;ctx.fillStyle=`rgb(${Math.round(155+v*85)},${Math.round(85+v*50)},0)`;ctx.fillRect(0,y,S,1);}const g=ctx.createLinearGradient(0,0,S,0);g.addColorStop(0,'rgba(255,215,70,0)');g.addColorStop(.45,'rgba(255,235,150,.4)');g.addColorStop(.55,'rgba(255,235,150,.4)');g.addColorStop(1,'rgba(255,215,70,0)');ctx.fillStyle=g;ctx.fillRect(0,0,S,S);});}
function texLapis(){return mkTex('lap',(ctx,S)=>{ctx.fillStyle='#0e1440';ctx.fillRect(0,0,S,S);const r=rng(3);for(let i=0;i<8;i++){const g=ctx.createRadialGradient(r()*S,r()*S,0,r()*S,r()*S,55+r()*55);g.addColorStop(0,`rgba(4,12,72,${.35+r()*.28})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,S,S);}for(let i=0;i<40;i++){ctx.fillStyle=`rgba(215,178,0,${.3+r()*.7})`;ctx.fillRect(r()*S,r()*S,r()*4+1,r()*4+1);}});}
function texMalachite(){return mkTex('mal',(ctx,S)=>{const r=rng(5);for(let i=0;i<12;i++){const cx=r()*S*1.2-S*.1,cy=r()*S*1.2-S*.1,base=18+r()*55;for(let j=0;j<6;j++){const rad=base+j*13;ctx.strokeStyle=j%2===0?`rgba(12,90,35,.9)`:`rgba(35,165,65,.85)`;ctx.lineWidth=4+r()*4;ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.stroke();}}});}
function texRedAgate(){return mkTex('rag',(ctx,S)=>{for(let y=0;y<S;y++){const v=Math.sin(y*.06)*Math.cos(y*.03+.4)*.4+.6;ctx.fillStyle=`rgb(${Math.round(175+v*65)},${Math.round(18+v*28)},${Math.round(4+v*8)})`;ctx.fillRect(0,y,S,1);}});}
function texLabradorite(){return mkTex('lab',(ctx,S)=>{ctx.fillStyle='#161e28';ctx.fillRect(0,0,S,S);const r=rng(9);for(let i=0;i<6;i++){const x=r()*S,y=r()*S,w=38+r()*75;const g=ctx.createLinearGradient(x-w,y,x+w,y);const h=180+r()*60;g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.5,`hsla(${h},75%,55%,.55)`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(x-w,y-30,w*2,60);}});}
function texRutileGold(){return mkTex('rtg',(ctx,S)=>{const r=rng(17);for(let i=0;i<20;i++){const x1=r()*S,y1=r()*S,dx=(r()-.5)*S*.6,dy=(r()-.5)*S*.5;const g=ctx.createLinearGradient(x1,y1,x1+dx,y1+dy);g.addColorStop(0,'rgba(210,170,0,0)');g.addColorStop(.5,`rgba(255,205,15,${.5+r()*.5})`);g.addColorStop(1,'rgba(175,125,0,0)');ctx.strokeStyle=g;ctx.lineWidth=1+r()*3;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1+dx,y1+dy);ctx.stroke();}});}
function texStrawberry(){return mkTex('stw',(ctx,S)=>{const r=rng(23);for(let i=0;i<30;i++){const x=r()*S,y=r()*S,sz=1.5+r()*7;ctx.fillStyle=`rgba(175,15,15,${.35+r()*.6})`;ctx.beginPath();ctx.arc(x,y,sz,0,Math.PI*2);ctx.fill();}});}

//  2D TRAY
// ══════════════════════════════════════════════════════════
const trayC=document.getElementById('trayCanvas');
const trayCtx=trayC.getContext('2d');
let TRAY_SIZE=300, hoverSlot=-1;

function resizeTray(){
  const area=document.getElementById('trayArea');
  const W=area.clientWidth-20, H=area.clientHeight-60;
  TRAY_SIZE=Math.max(180,Math.min(W,H,420));
  trayC.width=trayC.height=TRAY_SIZE;
  drawTray();
}

function beadR(){
  const n=state.slots.length,TRAY_R=TRAY_SIZE*.37;
  return Math.min((2*Math.PI*TRAY_R/n)*.46,TRAY_SIZE*.1);
}

function drawTrayLogo(ctx, cx, cy, r) {
  ctx.save();
  // Orange rounded square background
  const sq = r * .78;
  ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = r*.2;
  ctx.fillStyle = '#e8762a';
  roundRect(ctx, cx-sq, cy-sq, sq*2, sq*2, sq*.22);
  ctx.fill();
  ctx.shadowColor = 'transparent';
  // Mermaid silhouette (simplified)
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.beginPath();
  // Body (teardrop shape rotated)
  const hx = cx, hy = cy - r*.12;
  ctx.ellipse(hx, hy, r*.22, r*.3, 0, 0, Math.PI*2);
  ctx.fill();
  // Tail fins
  ctx.beginPath();
  ctx.moveTo(hx, hy+r*.28);
  ctx.bezierCurveTo(hx-r*.28, hy+r*.48, hx-r*.38, hy+r*.38, hx, hy+r*.52);
  ctx.bezierCurveTo(hx+r*.38, hy+r*.38, hx+r*.28, hy+r*.48, hx, hy+r*.28);
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fill();
  // Brand text
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.font = `bold ${r*.18}px 'Inter',sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('LARME', cx, cy + r*.65);
  ctx.font = `${r*.13}px 'Inter',sans-serif`;
  ctx.fillText('DE SIRÈNE', cx, cy + r*.82);
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, radius) {
  ctx.beginPath();
  ctx.moveTo(x+radius, y);
  ctx.lineTo(x+w-radius, y); ctx.arcTo(x+w,y,x+w,y+radius,radius);
  ctx.lineTo(x+w, y+h-radius); ctx.arcTo(x+w,y+h,x+w-radius,y+h,radius);
  ctx.lineTo(x+radius, y+h); ctx.arcTo(x,y+h,x,y+h-radius,radius);
  ctx.lineTo(x, y+radius); ctx.arcTo(x,y,x+radius,y,radius);
  ctx.closePath();
}

function drawTray(){
  const S=TRAY_SIZE,cx=S/2,cy=S/2,TR=S*.37,bR=beadR(),n=state.slots.length;
  trayCtx.clearRect(0,0,S,S);
  // Dish
  const dg=trayCtx.createRadialGradient(cx-S*.07,cy-S*.07,0,cx,cy,S*.47);
  dg.addColorStop(0,'#241a08');dg.addColorStop(.7,'#151005');dg.addColorStop(1,'#0a0804');
  trayCtx.beginPath();trayCtx.arc(cx,cy,S*.47,0,Math.PI*2);
  trayCtx.fillStyle=dg;trayCtx.fill();
  trayCtx.beginPath();trayCtx.arc(cx,cy,S*.47,0,Math.PI*2);
  trayCtx.strokeStyle='rgba(200,160,80,.25)';trayCtx.lineWidth=1.5;trayCtx.stroke();
  // Groove
  trayCtx.beginPath();trayCtx.arc(cx,cy,TR,0,Math.PI*2);
  trayCtx.strokeStyle='rgba(200,160,80,.12)';trayCtx.lineWidth=bR*2.3;trayCtx.stroke();
  // Center logo — Larme De Sirène brand mark
  drawTrayLogo(trayCtx, cx, cy, S*.16);
  // Beads
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2-Math.PI/2;
    const bx=cx+Math.cos(a)*TR,by=cy+Math.sin(a)*TR;
    drawBead2D(trayCtx,bx,by,bR,state.slots[i],i===hoverSlot);
  }
}

function drawBead2D(ctx,cx,cy,r,id,hover){
  if(!id){
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle=hover?'rgba(200,160,80,.65)':'rgba(255,255,255,.18)';
    ctx.lineWidth=hover?1.5:1;ctx.setLineDash([2.5,2.5]);ctx.stroke();ctx.setLineDash([]);
    if(hover){ctx.fillStyle='rgba(200,160,80,.07)';ctx.fill();}
    return;
  }
  const bead=BEADS.find(b=>b.id===id)||ACCESSORIES.find(a=>a.id===id);
  if(!bead)return;

  // Shadow
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=r*.7;ctx.shadowOffsetY=r*.25;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#000';ctx.fill();
  ctx.restore();

  // Clip to circle
  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();

  if(bead.icon){
    ctx.fillStyle=bead.shape==='spacer'?(bead.color===0xc8a040?'#c8a040':'#c0c0c0'):'#909090';
    ctx.fill();
  } else {
    const img=loadedImgs[id];
    if(img){
      // Draw real mineral photo, zoomed slightly for better crop
      const s=r*2.2;
      try{ ctx.drawImage(img,cx-s/2,cy-s/2,s,s); }catch(e){drawGradBead(ctx,cx,cy,r,bead);}
    } else {
      drawGradBead(ctx,cx,cy,r,bead);
    }
    // Darken edges (sphere shading)
    const edge=ctx.createRadialGradient(cx,cy,r*.5,cx,cy,r);
    edge.addColorStop(0,'rgba(0,0,0,0)');edge.addColorStop(1,'rgba(0,0,0,.52)');
    ctx.fillStyle=edge;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    // For translucent stones, add slight inner glow
    const{alpha}=bead.tray;
    if((alpha??1)<.95){
      const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,r*.7);
      glow.addColorStop(0,`rgba(255,255,255,${.08*(1-alpha)})`);glow.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore();

  // Specular highlight (top-left)
  const hl=ctx.createRadialGradient(cx-r*.32,cy-r*.38,0,cx-r*.16,cy-r*.22,r*.62);
  hl.addColorStop(0,'rgba(255,255,255,.92)');hl.addColorStop(.3,'rgba(255,255,255,.38)');
  hl.addColorStop(.7,'rgba(255,255,255,.06)');hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=hl;ctx.fill();
  // Secondary glint (bottom-right)
  const hl2=ctx.createRadialGradient(cx+r*.3,cy+r*.32,0,cx+r*.15,cy+r*.18,r*.38);
  hl2.addColorStop(0,'rgba(255,255,255,.18)');hl2.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=hl2;ctx.fill();

  if(hover){ctx.beginPath();ctx.arc(cx,cy,r+2,0,Math.PI*2);ctx.strokeStyle='rgba(200,160,80,.7)';ctx.lineWidth=2;ctx.stroke();}
}

function drawGradBead(ctx,cx,cy,r,bead){
  const{g,alpha}=bead.tray;
  const grad=ctx.createRadialGradient(cx-r*.37,cy-r*.42,r*.04,cx,cy,r);
  grad.addColorStop(0,g[0]);grad.addColorStop(.33,g[1]);grad.addColorStop(.7,g[2]);grad.addColorStop(1,g[3]);
  ctx.globalAlpha=alpha??1;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();ctx.globalAlpha=1;
}

function slotAt(x,y){
  const S=TRAY_SIZE,TR=S*.37,n=state.slots.length,bR=beadR();
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2-Math.PI/2;
    const dx=x-(S/2+Math.cos(a)*TR),dy=y-(S/2+Math.sin(a)*TR);
    if(dx*dx+dy*dy<=bR*bR*1.3)return i;
  }
  return -1;
}
function xy(e){const rect=trayC.getBoundingClientRect(),sc=TRAY_SIZE/rect.width;
  if(e.touches)return{x:(e.touches[0].clientX-rect.left)*sc,y:(e.touches[0].clientY-rect.top)*sc};
  return{x:(e.clientX-rect.left)*sc,y:(e.clientY-rect.top)*sc};}

let longT=null,touchMoved=false;
trayC.addEventListener('mousemove',e=>{const{x,y}=xy(e);hoverSlot=slotAt(x,y);drawTray();});
trayC.addEventListener('mouseleave',()=>{hoverSlot=-1;drawTray();});
trayC.addEventListener('click',e=>{
  const{x,y}=xy(e);const i=slotAt(x,y);if(i<0)return;
  state.slots[i]=state.selectedId||null;drawTray();updateCount();
  if(state.rendered)buildBracelet();
});
trayC.addEventListener('contextmenu',e=>{e.preventDefault();const{x,y}=xy(e);const i=slotAt(x,y);if(i>=0){state.slots[i]=null;drawTray();updateCount();}});
trayC.addEventListener('touchstart',e=>{touchMoved=false;const{x,y}=xy(e);const i=slotAt(x,y);if(i<0)return;longT=setTimeout(()=>{if(!touchMoved){state.slots[i]=null;drawTray();updateCount();}},500);},{passive:true});
trayC.addEventListener('touchmove',()=>{touchMoved=true;},{passive:true});
trayC.addEventListener('touchend',()=>clearTimeout(longT),{passive:true});

// ── Drag-and-drop onto tray ─────────────────────────────
trayC.addEventListener('dragover',e=>{
  e.preventDefault(); e.dataTransfer.dropEffect='copy';
  const{x,y}=xy(e); hoverSlot=slotAt(x,y); drawTray();
});
trayC.addEventListener('dragleave',()=>{hoverSlot=-1;drawTray();});
trayC.addEventListener('drop',e=>{
  e.preventDefault();
  const id=e.dataTransfer.getData('beadId');
  const{x,y}=xy(e); const i=slotAt(x,y);
  if(i>=0&&id){state.slots[i]=id;state.selectedId=id;}
  hoverSlot=-1; drawTray(); updateCount();
  if(state.rendered)buildBracelet();
});

// ── Drag beads OUT of tray (from tray to remove) ────────
let dragSlotIdx=-1;
trayC.addEventListener('dragstart',e=>{
  const{x,y}=xy(e); const i=slotAt(x,y);
  if(i>=0&&state.slots[i]){
    dragSlotIdx=i;
    e.dataTransfer.setData('beadId',state.slots[i]);
    e.dataTransfer.effectAllowed='move';
  } else { e.preventDefault(); }
});
trayC.draggable=true;

const threeC=document.getElementById('threeCanvas');
const renderer=new THREE.WebGLRenderer({canvas:threeC,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();scene.background=new THREE.Color(0x14100c);
const camera=new THREE.PerspectiveCamera(45,1,.1,1000);camera.position.set(0,55,85);
const controls=new OrbitControls(camera,threeC);
controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=40;controls.maxDistance=220;
controls.autoRotate=true;controls.autoRotateSpeed=1.2;controls.target.set(0,0,0);

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment()).texture;

scene.add(new THREE.AmbientLight(0xfff8f0,.4));
const key=new THREE.DirectionalLight(0xfff5e8,2.8);key.position.set(40,70,50);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.bias=-.001;scene.add(key);
const fill=new THREE.DirectionalLight(0xe0e8ff,.8);fill.position.set(-50,30,-40);scene.add(fill);
const rim=new THREE.PointLight(0xffeedd,.9,200);rim.position.set(0,60,-60);scene.add(rim);

const ground=new THREE.Mesh(new THREE.CircleGeometry(120,64),new THREE.MeshPhysicalMaterial({color:0x1e1610,roughness:.9}));
ground.rotation.x=-Math.PI/2;ground.position.y=-1;ground.receiveShadow=true;scene.add(ground);
const wrist=new THREE.Mesh(new THREE.CylinderGeometry(WRIST_R,WRIST_R+2,90,48),new THREE.MeshPhysicalMaterial({color:0xc0987a,roughness:.65}));
wrist.rotation.z=Math.PI/2;wrist.receiveShadow=true;wrist.castShadow=true;wrist.visible=false;scene.add(wrist);

let braceletGroup=null;const matCache={};

function getMat(id){
  if(matCache[id])return matCache[id];
  const b=BEADS.find(x=>x.id===id);if(!b)return new THREE.MeshStandardMaterial({color:0x888});
  const{m3,special}=b;
  let map=null;
  if(special==='goldstone_blue')map=texGoldstone(true);
  else if(special==='goldstone_red')map=texGoldstone(false);
  else if(special==='tigers_eye')map=texTigersEye();
  else if(special==='lapis')map=texLapis();
  else if(special==='malachite')map=texMalachite();
  else if(special==='agate_red')map=texRedAgate();
  else if(special==='labradorite')map=texLabradorite();
  else if(special==='rutile_gold')map=texRutileGold();
  const p={color:m3.color,roughness:m3.roughness??0,metalness:m3.metalness??0,envMapIntensity:m3.envI??1.5};
  if(m3.transmission>0){p.transmission=m3.transmission;p.transparent=true;p.ior=m3.ior??1.5;p.thickness=m3.thick??8;
    if(m3.att){p.attenuationColor=new THREE.Color(m3.att);p.attenuationDistance=m3.attD??20;}}
  // Use real Wikipedia photo texture if no procedural map
  if(!map && BEAD_PHOTOS[id]){
    if(loadedTex[id]){ map=loadedTex[id]; }
    else { const t=new THREE.TextureLoader().load(BEAD_PHOTOS[id]);t.wrapS=t.wrapT=THREE.RepeatWrapping;loadedTex[id]=t;map=t; }
  }
  if(map)p.map=map;
  return matCache[id]=new THREE.MeshPhysicalMaterial(p);
}

function mkBeadMesh(id,r){
  const seg=r>5?32:24;
  const acc=ACCESSORIES.find(a=>a.id===id);
  if(acc){
    if(acc.shape==='spacer'){const m=new THREE.Mesh(new THREE.CylinderGeometry(r*.9,r*.9,r*.4,24),new THREE.MeshPhysicalMaterial({color:acc.color,metalness:.85,roughness:.1}));return m;}
    const m=new THREE.Mesh(new THREE.TorusGeometry(r*.6,r*.22,16,32),new THREE.MeshPhysicalMaterial({color:0xdddddd,metalness:.9,roughness:.08}));return m;
  }
  const b=BEADS.find(x=>x.id===id);if(!b)return null;
  if(b.special==='phantom_green'){
    const g=new THREE.Group();
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg),getMat(id)));
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r*.68,20,20),new THREE.MeshPhysicalMaterial({map:texPhantomGreen(),transparent:true,opacity:.72,roughness:.3})));
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r*.52,18,18),new THREE.MeshPhysicalMaterial({map:texWispGreen(),transparent:true,opacity:.6,roughness:.4,emissive:new THREE.Color(0x082810),emissiveIntensity:.45})));
    return g;
  }
  if(b.special==='moonstone'){
    const g=new THREE.Group();
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg),getMat(id)));
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r*.95,seg,seg),new THREE.MeshPhysicalMaterial({color:0x7088ff,transparent:true,opacity:.18,roughness:.0,transmission:.25,ior:1.4,emissive:new THREE.Color(0x1828b8),emissiveIntensity:.12})));
    return g;
  }
  if(b.special==='strawberry'){
    const g=new THREE.Group();
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg),getMat(id)));
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r*.72,20,20),new THREE.MeshPhysicalMaterial({map:texStrawberry(),transparent:true,opacity:.55,roughness:.2})));
    return g;
  }
  if(b.special==='rutile_gold'){
    const g=new THREE.Group();
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg),getMat(id)));
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r*.65,18,18),new THREE.MeshPhysicalMaterial({map:texRutileGold(),transparent:true,opacity:.65,roughness:.15,emissive:new THREE.Color(0x281800),emissiveIntensity:.5})));
    return g;
  }
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg),getMat(id));
  m.castShadow=true;m.receiveShadow=true;return m;
}

function buildBracelet(){
  if(braceletGroup){scene.remove(braceletGroup);}
  braceletGroup=new THREE.Group();
  const bR=state.sizeMm/2,n=state.slots.length;
  const bracR=state.viewMode==='wrist'?WRIST_R+bR+.5:n*bR*1.02/Math.PI;
  for(let i=0;i<n;i++){
    const id=state.slots[i];if(!id)continue;
    const a=(i/n)*Math.PI*2;
    const mesh=mkBeadMesh(id,bR);if(!mesh)continue;
    mesh.position.set(Math.cos(a)*bracR,0,Math.sin(a)*bracR);
    mesh.rotation.y=a+Math.PI/2;
    braceletGroup.add(mesh);
  }
  // Cord
  const pts=[];for(let i=0;i<=64;i++){const a=(i/64)*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*bracR,0,Math.sin(a)*bracR));}
  braceletGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,true),128,bR*.07,8,true),new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:.9})));
  scene.add(braceletGroup);
  state.rendered=true;
  updateCamera();
}

function updateCamera(){
  const bR=state.sizeMm/2,n=state.slots.length;
  const bracR=state.viewMode==='wrist'?WRIST_R+bR+.5:n*bR*1.02/Math.PI;
  if(state.viewMode==='wrist'){
    // Side-angle view of wrist
    camera.position.set(bracR*1.8, bracR*1.0, bracR*2.2);
    wrist.visible=true; ground.visible=false; controls.autoRotateSpeed=.8;
  } else {
    // Product photo angle: low elevation, bracelet fills frame nicely
    camera.position.set(0, bracR*0.55, bracR*2.4);
    wrist.visible=false; ground.visible=true; controls.autoRotateSpeed=.5;
  }
  controls.target.set(0,0,0); controls.update();
}

function resizeRenderer(){
  const el=document.getElementById('preview3D');
  const W=el.clientWidth,H=el.clientHeight-48-44;
  if(W<1||H<1)return;
  renderer.setSize(W,Math.max(H,100));
  camera.aspect=W/Math.max(H,1);camera.updateProjectionMatrix();
}

function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
animate();

// ══════════════════════════════════════════════════════════
//  PALETTE UI
// ══════════════════════════════════════════════════════════
function mkIcon(bead,size=40){
  const c=document.createElement('canvas');c.width=c.height=size;
  const ctx=c.getContext('2d'),r=size/2-1,cx=size/2,cy=size/2;
  if(bead.icon){
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle=bead.shape==='spacer'?(bead.color===0xc8a040?'#c8a040':'#ccc'):'#888';ctx.fill();
    ctx.font=`${size*.5}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillText(bead.icon,cx+.5,cy+.5);
    ctx.fillStyle='#fff';ctx.fillText(bead.icon,cx,cy);
    return c;
  }
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
  const img=loadedImgs[bead.id];
  if(img){
    try{ctx.drawImage(img,0,0,size,size);}catch(e){drawGradBead(ctx,cx,cy,r,bead);}
    const edge=ctx.createRadialGradient(cx,cy,r*.38,cx,cy,r);
    edge.addColorStop(0,'rgba(0,0,0,0)');edge.addColorStop(1,'rgba(0,0,0,.48)');
    ctx.fillStyle=edge;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  } else {
    drawGradBead(ctx,cx,cy,r,bead);
  }
  ctx.restore();
  const hl=ctx.createRadialGradient(cx-r*.32,cy-r*.38,0,cx-r*.14,cy-r*.2,r*.55);
  hl.addColorStop(0,'rgba(255,255,255,.82)');hl.addColorStop(.35,'rgba(255,255,255,.28)');hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=hl;ctx.fill();
  return c;
}

function buildPalette(){
  const strip=document.getElementById('beadStrip');strip.innerHTML='';
  const all=[...BEADS,...ACCESSORIES];
  all.forEach((b,idx)=>{
    if(idx===BEADS.length){const sep=document.createElement('div');sep.className='acc-sep';strip.appendChild(sep);}
    const btn=document.createElement('div');btn.className='bead-btn';btn.dataset.id=b.id;
    btn.appendChild(mkIcon(b,40));
    const lbl=document.createElement('span');lbl.textContent=b.name;btn.appendChild(lbl);
    btn.addEventListener('click',()=>selectBead(b.id));
    // Desktop drag-and-drop
    btn.draggable=true;
    btn.addEventListener('dragstart',e=>{
      e.dataTransfer.setData('beadId',b.id);
      e.dataTransfer.effectAllowed='copy';
      selectBead(b.id);
    });
    strip.appendChild(btn);
  });
}

function buildSizes(){
  const strip=document.getElementById('sizeStrip');strip.innerHTML='';
  SIZES.forEach(s=>{
    const n=beadCount(s,state.wristMm);
    const btn=document.createElement('button');btn.className='sbtn'+(s===state.sizeMm?' active':'');
    btn.textContent=`${s}mm`;btn.title=`${n}颗`;
    btn.addEventListener('click',()=>{state.sizeMm=s;initSlots();buildSizes();updateWristUI();drawTray();updateCount();if(state.rendered)buildBracelet();});
    strip.appendChild(btn);
  });
}

function selectBead(id){
  state.selectedId=state.selectedId===id?null:id;
  document.querySelectorAll('.bead-btn').forEach(b=>b.classList.toggle('selected',b.dataset.id===state.selectedId));
}

function updateCount(){const t=state.slots.filter(Boolean).length;document.getElementById('beadCountLbl').textContent=`${t} / ${state.slots.length} 颗珠子`;}

// ── Wrist size ─────────────────────────────────────────────
function changeWrist(delta){
  state.wristMm=Math.max(WRIST_MIN,Math.min(WRIST_MAX,state.wristMm+delta));
  initSlots();updateWristUI();buildSizes();drawTray();updateCount();
  if(state.rendered)buildBracelet();
}
document.getElementById('wristMinus').addEventListener('click',()=>changeWrist(-WRIST_STEP));
document.getElementById('wristPlus').addEventListener('click',()=>changeWrist(WRIST_STEP));

// ── Controls ───────────────────────────────────────────────
document.getElementById('clearBtn').addEventListener('click',()=>{state.slots.fill(null);drawTray();updateCount();if(state.rendered)buildBracelet();});
document.getElementById('randomBtn').addEventListener('click',()=>{const ids=BEADS.map(b=>b.id);state.slots=state.slots.map(()=>ids[Math.floor(Math.random()*ids.length)]);drawTray();updateCount();if(state.rendered)buildBracelet();});

function open3D(){
  buildBracelet();
  const ov=document.getElementById('preview3D');
  ov.classList.add('open');
  // Wait for DOM layout after display change before resizing
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    resizeRenderer(); updateCamera(); controls.update();
    renderer.render(scene,camera);
  }));
}
document.getElementById('render3dBtn').addEventListener('click',open3D);
document.getElementById('show3dBtn')?.addEventListener('click',open3D);
document.getElementById('backBtn').addEventListener('click',()=>document.getElementById('preview3D').classList.remove('open'));

document.getElementById('viewProductBtn').addEventListener('click',function(){state.viewMode='product';this.classList.add('active');document.getElementById('viewWristBtn').classList.remove('active');if(state.rendered)buildBracelet();});
document.getElementById('viewWristBtn').addEventListener('click',function(){state.viewMode='wrist';this.classList.add('active');document.getElementById('viewProductBtn').classList.remove('active');if(state.rendered)buildBracelet();});

const arBtn=document.getElementById('autoRotBtn');
arBtn.addEventListener('click',()=>{state.autoRotate=!state.autoRotate;controls.autoRotate=state.autoRotate;arBtn.classList.toggle('active',state.autoRotate);arBtn.textContent=state.autoRotate?'⟳ 旋转':'⟳ 暂停';});
document.getElementById('saveBtn').addEventListener('click',()=>{renderer.render(scene,camera);const a=document.createElement('a');a.href=threeC.toDataURL('image/png');a.download='larme-bracelet.png';a.click();});

// ── Resize ─────────────────────────────────────────────────
const ro=new ResizeObserver(()=>{resizeTray();resizeRenderer();});
ro.observe(document.getElementById('trayArea'));
ro.observe(document.getElementById('preview3D'));

// ── Init ───────────────────────────────────────────────────
initSlots();buildSizes();updateWristUI();resizeTray();resizeRenderer();drawTray();updateCount();
// Load real mineral photos, then refresh palette and tray
buildPalette(); // build with fallback gradients first
preloadPhotos().then(()=>{
  buildPalette(); // rebuild with real photos
  drawTray();     // redraw tray beads with real photos
});
</script>
</body>
