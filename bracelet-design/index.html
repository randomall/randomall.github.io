<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>手串设计师 · Larme De Sirène</title>
<style>
:root{
  --bg:#0e0e0e;--surface:#161616;--surface2:#202020;--border:#2a2a2a;
  --text:#f0ede8;--muted:#777;--accent:#c8a060;--tray-bg:#120e06;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
  display:flex;flex-direction:column;height:100dvh;user-select:none}

header{display:flex;align-items:center;gap:10px;padding:8px 14px;
  background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;height:48px}
.logo{font-size:12px;font-weight:800;letter-spacing:.07em;color:var(--accent);flex:1}
.logo small{display:block;font-size:10px;font-weight:400;color:var(--muted)}
.hbtn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:6px 12px;font-size:12px;color:var(--text);cursor:pointer;font-weight:600;
  white-space:nowrap;min-height:34px;transition:all .15s}
.hbtn:hover,.hbtn.active{background:var(--accent);border-color:var(--accent);color:#fff}

.app-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* ── TRAY AREA ── */
.tray-area{flex:1;min-height:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:var(--tray-bg);position:relative;padding:10px 10px 4px}
#trayCanvas{touch-action:none;cursor:pointer;display:block;max-width:100%;max-height:100%}
.tray-btns{display:flex;gap:8px;margin-top:6px;flex-shrink:0;align-items:center}
.tbtn{background:rgba(255,255,255,.55);border:1px solid var(--border);
  border-radius:8px;padding:6px 13px;font-size:12px;color:var(--text);cursor:pointer;font-weight:600;min-height:34px;transition:all .15s}
.tbtn:hover{background:rgba(255,255,255,.9)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tbtn.primary:hover{opacity:.88}

/* ── BOTTOM BAR ── */
.bottom-bar{flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);display:flex;flex-direction:column}
.tab-row{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tab-btn{flex:1;padding:7px 8px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;
  text-align:center;border:none;background:none;transition:all .15s;border-bottom:2px solid transparent}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

.palette-pane{display:none;flex-direction:column;overflow:hidden}
.palette-pane.active{display:flex}
.size-strip{display:flex;gap:5px;padding:6px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);flex-shrink:0}
.size-strip::-webkit-scrollbar{display:none}
.sbtn{flex-shrink:0;padding:5px 9px;font-size:11px;font-weight:700;border:1.5px solid var(--border);
  border-radius:7px;cursor:pointer;background:var(--surface2);color:var(--muted);transition:all .15s;min-height:28px}
.sbtn.active{border-color:var(--accent);color:var(--accent);background:rgba(200,128,74,.1)}
.bead-strip{display:flex;gap:6px;padding:6px 10px;overflow-x:auto;scrollbar-width:none;
  align-items:center;flex-shrink:0;min-height:76px}
.bead-strip::-webkit-scrollbar{display:none}
.bead-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:5px 6px;border:1.5px solid transparent;border-radius:10px;cursor:pointer;
  background:var(--surface2);transition:all .15s;min-width:50px}
.bead-btn:hover{border-color:var(--border)}
.bead-btn.selected{border-color:var(--accent);background:rgba(200,128,74,.1)}
.bead-btn canvas{border-radius:50%;display:block}
.bead-btn span{font-size:10px;text-align:center;color:var(--muted);line-height:1.2;
  white-space:nowrap;max-width:50px;overflow:hidden;text-overflow:ellipsis}
.acc-sep{width:1px;background:var(--border);flex-shrink:0;height:46px;margin:0 3px}

/* Accessories pane */
.acc-pane{display:none;flex-direction:row;gap:8px;padding:8px 10px;overflow-x:auto;scrollbar-width:none;min-height:76px;align-items:flex-start}
.acc-pane.active{display:flex}
.acc-pane::-webkit-scrollbar{display:none}
.acc-card{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 8px;border:1.5px solid transparent;border-radius:10px;cursor:pointer;
  background:var(--surface2);transition:all .15s;min-width:56px}
.acc-card:hover{border-color:var(--border)}
.acc-card.selected{border-color:var(--accent);background:rgba(200,128,74,.1)}
.acc-icon{font-size:24px;line-height:1.2;text-align:center}
.acc-card span{font-size:10px;color:var(--muted);text-align:center;line-height:1.3}

/* Wrist row */
.wrist-row{display:flex;align-items:center;gap:8px;padding:5px 10px;border-top:1px solid var(--border);flex-shrink:0}
.wrist-label{font-size:11px;color:var(--muted);flex-shrink:0}
.wrist-val{font-size:12px;font-weight:700;color:var(--accent);min-width:44px;text-align:center}
.wbtn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;
  width:26px;height:26px;cursor:pointer;font-size:15px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;transition:all .15s;line-height:1}
.wbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.wrist-used{font-size:11px;color:var(--muted);flex:1;text-align:right}

/* ── SUMMARY PANEL ── */
.summary-btn{position:absolute;top:8px;right:8px;background:rgba(255,248,240,.9);
  border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;
  font-weight:700;cursor:pointer;color:var(--accent);z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.12);
  display:flex;align-items:center;gap:5px}
.summary-overlay{position:fixed;inset:0;z-index:300;display:none;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.35)}
.summary-overlay.open{display:flex}
.summary-sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:480px;
  padding:20px 20px 32px;max-height:70vh;overflow-y:auto}
.summary-sheet h2{font-size:15px;font-weight:800;margin-bottom:12px;color:var(--text)}
.summary-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.summary-row:last-child{border-bottom:none}
.summary-swatch{width:28px;height:28px;border-radius:50%;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.summary-name{flex:1;font-size:13px;font-weight:600}
.summary-meta{font-size:12px;color:var(--muted)}
.summary-count{font-size:14px;font-weight:800;color:var(--accent);min-width:24px;text-align:right}
.summary-total{margin-top:12px;padding:10px 12px;background:var(--surface2);border-radius:10px;font-size:12px;color:var(--muted)}
.summary-total strong{color:var(--text);font-size:14px}
.summary-close{width:100%;margin-top:12px;padding:10px;background:var(--accent);border:none;
  border-radius:10px;color:#fff;font-weight:700;font-size:14px;cursor:pointer}

/* ── 3D OVERLAY ── */
.preview-overlay{position:fixed;inset:0;z-index:200;background:#14100c;
  flex-direction:column;display:none}
.preview-overlay.open{display:flex}
.preview-topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;
  background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.1);
  flex-shrink:0;color:#f0ede8}
.preview-topbar .back{font-size:18px;cursor:pointer;padding:4px 8px;color:rgba(255,255,255,.5)}
.preview-topbar .back:hover{color:#fff}
.preview-topbar .title{flex:1;font-size:13px;font-weight:700;color:#f0ede8}
#threeCanvas{flex:1;display:block;width:100%;min-height:0}
.preview-btmbar{display:flex;align-items:center;gap:8px;padding:8px 14px;
  background:rgba(255,255,255,.04);border-top:1px solid rgba(255,255,255,.1);flex-shrink:0;flex-wrap:wrap}
#beadCountLbl{font-size:11px;color:rgba(255,255,255,.45);flex:1}
.pbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:8px;
  padding:6px 12px;font-size:12px;color:#f0ede8;cursor:pointer;min-height:32px;font-weight:600;transition:all .15s}
.pbtn:hover{background:var(--accent);border-color:var(--accent)}
.pbtn.active{background:rgba(200,128,74,.3);border-color:var(--accent);color:var(--accent)}

/* Desktop */
@media(min-width:768px){
  .app-body{flex-direction:row}
  .bottom-bar{flex-direction:column;width:190px;border-top:none;border-right:1px solid var(--border);flex-shrink:0}
  .tab-row{display:none}
  .palette-pane{display:flex !important;flex:1;overflow:hidden}
  .size-strip{flex-wrap:wrap;overflow-x:hidden;padding:6px 8px}
  .bead-strip{flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:6px 8px;min-height:0;flex:1}
  .bead-btn{width:100%;flex-direction:row;gap:8px;min-width:unset}
  .bead-btn span{text-align:left;max-width:none}
  .acc-sep{width:100%;height:1px;margin:3px 0}
  .acc-pane{display:none !important} /* merged into palette on desktop */
  .preview-overlay{position:static;display:flex !important;flex:1;z-index:auto}
  .preview-topbar .back{display:none}
  .show3d-btn{display:none}
  .tray-area{flex:1}
  .wrist-row{border-top:1px solid var(--border)}
}
</style>
</head>
<body>

<header>
  <div class="logo">LARME DE SIRÈNE<small>手串设计师</small></div>
  <button class="hbtn" id="viewProductBtn">平放</button>
  <button class="hbtn" id="viewWristBtn">手腕</button>
  <button class="hbtn show3d-btn" id="show3dBtn">3D 预览 ↗</button>
</header>

<div class="app-body">
  <!-- Palette / Bottom bar -->
  <div class="bottom-bar" id="paletteBar">
    <div class="tab-row">
      <button class="tab-btn active" data-pane="beads">珠子</button>
      <button class="tab-btn" data-pane="acc">配饰</button>
    </div>
    <!-- Beads pane -->
    <div class="palette-pane active" id="beadsPane">
      <div class="size-strip" id="sizeStrip"></div>
      <div class="bead-strip" id="beadStrip"></div>
    </div>
    <!-- Accessories pane -->
    <div class="acc-pane" id="accPane"></div>
    <!-- Wrist control -->
    <div class="wrist-row">
      <span class="wrist-label">手围</span>
      <button class="wbtn" id="wristMinus">−</button>
      <span class="wrist-val" id="wristVal">16.5cm</span>
      <button class="wbtn" id="wristPlus">+</button>
      <span class="wrist-used" id="wristUsed"></span>
    </div>
  </div>

  <!-- Tray -->
  <div class="tray-area" id="trayArea">
    <button class="summary-btn" id="summaryBtn">📿 <span id="summaryCount">0颗</span></button>
    <canvas id="trayCanvas"></canvas>
    <div class="tray-btns">
      <button class="tbtn" id="clearBtn">清空</button>
      <button class="tbtn" id="undoBtn">撤销</button>
      <button class="tbtn primary show3d-btn" id="render3dBtn">渲染 3D →</button>
    </div>
  </div>

  <!-- 3D Preview -->
  <div class="preview-overlay" id="preview3D">
    <div class="preview-topbar">
      <span class="back" id="backBtn">←</span>
      <span class="title">3D 预览</span>
      <button class="pbtn active" id="autoRotBtn">⟳ 旋转</button>
      <button class="pbtn" id="saveBtn">💾 保存</button>
    </div>
    <canvas id="threeCanvas"></canvas>
    <div class="preview-btmbar">
      <span id="beadCountLbl"></span>
    </div>
  </div>
</div>

<!-- Summary overlay -->
<div class="summary-overlay" id="summaryOverlay">
  <div class="summary-sheet">
    <h2>📿 手串汇总</h2>
    <div id="summaryList"></div>
    <div class="summary-total" id="summaryTotal"></div>
    <button class="summary-close" id="summaryClose">关闭</button>
  </div>
</div>

//  STATE — arc-based: each placed item has its own sizeMm
// ═══════════════════════════════════════════════════════════
const state={
  placed:[],        // [{id, sizeMm}] ordered around bracelet
  history:[],       // for undo
  selectedId:null,
  selectedSizeMm:8,
  wristMm:165,
  viewMode:'product',
  autoRotate:true,
  rendered:false,
};
function lookupItem(id){ return ALL_ITEMS.find(x=>x.id===id); }
function usedMm(){ return state.placed.reduce((s,b)=>s+b.sizeMm,0); }
function remainingMm(){ return Math.max(0,state.wristMm-usedMm()); }

function pushHistory(){ state.history.push(JSON.parse(JSON.stringify(state.placed))); if(state.history.length>50)state.history.shift(); }
function undo(){ if(state.history.length>0){state.placed=state.history.pop();redraw();} }

function rng(s){let v=s;return()=>{v=(v*16807)%2147483647;return(v-1)/2147483646;};}
function texPhantomGreen(){return mkTex('phg',(ctx,S)=>{const r=rng(42);for(let i=0;i<10;i++){const cx=r()*S,cy=r()*S,rad=18+r()*65;const g=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);g.addColorStop(0,`rgba(6,18,10,${.3+r()*.45})`);g.addColorStop(.5,`rgba(12,30,16,${.12+r()*.18})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fill();}});}
function texWispGreen(){return mkTex('wsg',(ctx,S)=>{const r=rng(99);for(let i=0;i<14;i++){const x1=r()*S,y1=r()*S,x2=r()*S,y2=r()*S;const g=ctx.createLinearGradient(x1,y1,x2,y2);g.addColorStop(0,'rgba(0,100,40,0)');g.addColorStop(.5,`rgba(20,170,60,${.35+r()*.55})`);g.addColorStop(1,'rgba(0,70,25,0)');ctx.strokeStyle=g;ctx.lineWidth=1+r()*5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.bezierCurveTo(r()*S,r()*S,r()*S,r()*S,x2,y2);ctx.stroke();}});}
function texGoldstone(blue){return mkTex(blue?'gsb':'gsr',(ctx,S)=>{ctx.fillStyle=blue?'#04102a':'#240800';ctx.fillRect(0,0,S,S);const r=rng(blue?11:22);for(let i=0;i<600;i++){const x=r()*S,y=r()*S,sz=.3+r()*2;ctx.fillStyle=blue?`rgba(70,110,255,${.5+r()*.5})`:`rgba(255,130,30,${.5+r()*.5})`;ctx.beginPath();ctx.arc(x,y,sz,0,Math.PI*2);ctx.fill();}});}
function texTigersEye(){return mkTex('tge',(ctx,S)=>{for(let y=0;y<S;y++){const v=(Math.sin(y*.07+.5)*.5+.5)*.7+Math.sin(y*.22)*.08+.15;ctx.fillStyle=`rgb(${Math.round(155+v*85)},${Math.round(85+v*50)},0)`;ctx.fillRect(0,y,S,1);}const g=ctx.createLinearGradient(0,0,S,0);g.addColorStop(0,'rgba(255,215,70,0)');g.addColorStop(.45,'rgba(255,235,150,.4)');g.addColorStop(.55,'rgba(255,235,150,.4)');g.addColorStop(1,'rgba(255,215,70,0)');ctx.fillStyle=g;ctx.fillRect(0,0,S,S);});}
function texLapis(){return mkTex('lap',(ctx,S)=>{ctx.fillStyle='#0e1440';ctx.fillRect(0,0,S,S);const r=rng(3);for(let i=0;i<8;i++){const g=ctx.createRadialGradient(r()*S,r()*S,0,r()*S,r()*S,55+r()*55);g.addColorStop(0,`rgba(4,12,72,${.35+r()*.28})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,S,S);}for(let i=0;i<40;i++){ctx.fillStyle=`rgba(215,178,0,${.3+r()*.7})`;ctx.fillRect(r()*S,r()*S,r()*4+1,r()*4+1);}});}
function texMalachite(){return mkTex('mal',(ctx,S)=>{const r=rng(5);for(let i=0;i<12;i++){const cx=r()*S*1.2-S*.1,cy=r()*S*1.2-S*.1,base=18+r()*55;for(let j=0;j<6;j++){const rad=base+j*13;ctx.strokeStyle=j%2===0?`rgba(12,90,35,.9)`:`rgba(35,165,65,.85)`;ctx.lineWidth=4+r()*4;ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.stroke();}}});}
function texRedAgate(){return mkTex('rag',(ctx,S)=>{for(let y=0;y<S;y++){const v=Math.sin(y*.06)*Math.cos(y*.03+.4)*.4+.6;ctx.fillStyle=`rgb(${Math.round(175+v*65)},${Math.round(18+v*28)},${Math.round(4+v*8)})`;ctx.fillRect(0,y,S,1);}});}
function texLabradorite(){return mkTex('lab',(ctx,S)=>{ctx.fillStyle='#161e28';ctx.fillRect(0,0,S,S);const r=rng(9);for(let i=0;i<6;i++){const x=r()*S,y=r()*S,w=38+r()*75;const g=ctx.createLinearGradient(x-w,y,x+w,y);const h=180+r()*60;g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.5,`hsla(${h},75%,55%,.55)`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(x-w,y-30,w*2,60);}});}

function texStrawberry(){return mkTex('stw',(ctx,S)=>{const r=rng(23);for(let i=0;i<30;i++){const x=r()*S,y=r()*S,sz=1.5+r()*7;ctx.fillStyle=`rgba(175,15,15,${.35+r()*.6})`;ctx.beginPath();ctx.arc(x,y,sz,0,Math.PI*2);ctx.fill();}});}

// ═══════════════════════════════════════════════════════════
//  2D TRAY — arc-based proportional layout
// ═══════════════════════════════════════════════════════════
const trayC=document.getElementById('trayCanvas');
const trayCtx=trayC.getContext('2d');
let TRAY_SIZE=300, hoverIdx=-1, selectedPlacedIdx=-1;
const TR_FRAC=0.37; // tray ring radius as fraction of size

function TR(){ return TRAY_SIZE*TR_FRAC; }

function resizeTray(){
  const area=document.getElementById('trayArea');
  const W=area.clientWidth-20, H=area.clientHeight-60;
  TRAY_SIZE=Math.max(180,Math.min(W,H,440));
  trayC.width=trayC.height=TRAY_SIZE;
  drawTray();
}

// Calculate angular positions for each placed item
// Returns array of {startAngle, endAngle, midAngle, beadR}
function calcAngles(){
  const total=state.wristMm;
  const maxVisR=TR()*.22, minVisR=TR()*.04;
  let angle=-Math.PI/2;
  return state.placed.map(b=>{
    const arc=(b.sizeMm/total)*Math.PI*2;
    const mid=angle+arc/2;
    const end=angle+arc;
    // Visual radius proportional to bead size but capped
    const visR=Math.max(minVisR,Math.min(maxVisR,(b.sizeMm/16)*TR()*.22));
    const res={startAngle:angle,endAngle:end,midAngle:mid,arc,visR};
    angle=end;
    return res;
  });
}

// Empty arc segments (remaining space shown as ghost slots)
function calcEmptySlots(afterAngle){
  const rem=remainingMm();
  if(rem<=0) return [];
  const sz=state.selectedSizeMm;
  if(sz>rem) return [];
  const total=state.wristMm;
  const count=Math.floor(rem/sz);
  const slots=[];
  let angle=afterAngle??-Math.PI/2+((usedMm()/total)*Math.PI*2);
  for(let i=0;i<count;i++){
    const arc=(sz/total)*Math.PI*2;
    slots.push({midAngle:angle+arc/2,arc,sizeMm:sz});
    angle+=arc;
  }
  return slots;
}

function drawTrayLogo(ctx, cx, cy, r) {
  try { _drawTrayLogoInner(ctx, cx, cy, r); } catch(e) {
    // fallback: just text
    ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(200,160,80,.4)'; ctx.font=`${r*.25}px serif`;
    ctx.fillText('⚜', cx, cy); ctx.restore();
  }
}
function _drawTrayLogoInner(ctx, cx, cy, r) {
  ctx.save();
  const g = (a) => `rgba(200,160,80,${a})`;

  // ── Rope border (outer + inner rings with dash pattern) ──
  [.95, .88].forEach((fr, i) => {
    ctx.beginPath(); ctx.arc(cx, cy, r*fr, 0, Math.PI*2);
    ctx.strokeStyle = g(i === 0 ? .5 : .25);
    ctx.lineWidth = r * (i === 0 ? .1 : .02);
    ctx.setLineDash(i === 0 ? [r*.06, r*.03] : []);
    ctx.lineDashOffset = r*.015; ctx.stroke();
  });
  ctx.setLineDash([]);

  // ── Inner circle clip ─────────────────────────────────
  ctx.beginPath(); ctx.arc(cx, cy, r*.84, 0, Math.PI*2);
  ctx.strokeStyle = g(.2); ctx.lineWidth = 1; ctx.stroke();

  // Dark left half (mermaid body / hair area)
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r*.82, 0, Math.PI*2); ctx.clip();
  ctx.beginPath();
  ctx.moveTo(cx, cy - r*.82);
  ctx.arc(cx, cy, r*.82, -Math.PI/2, Math.PI/2, false);
  ctx.lineTo(cx, cy - r*.82);
  ctx.fillStyle = g(.18); ctx.fill();
  ctx.restore();

  // ── Hair flowing lines (left side, sweeping back) ─────
  ctx.strokeStyle = g(.38); ctx.lineWidth = r*.022;
  const hairLines = [
    [-.62,-.55, -.35,-.42, -.18,-.22, .02,-.08],
    [-.68,-.38, -.40,-.28, -.20,-.10, .00, .04],
    [-.70,-.20, -.44,-.12, -.22, .04, -.02, .16],
    [-.68,-.02, -.44, .08, -.22, .18, -.05, .28],
    [-.60, .14, -.38, .22, -.20, .30, -.06, .38],
    [-.50, .28, -.30, .35, -.14, .40, -.04, .46],
  ];
  hairLines.forEach(([x1,y1,x2,y2,x3,y3,x4,y4])=>{
    ctx.beginPath();
    ctx.moveTo(cx+r*x1, cy+r*y1);
    ctx.bezierCurveTo(cx+r*x2,cy+r*y2, cx+r*x3,cy+r*y3, cx+r*x4,cy+r*y4);
    ctx.stroke();
  });

  // ── Mermaid scales / beads (lower left) ───────────────
  const beadPositions = [
    [-.48,.28],[-.30,.28],[-.14,.28],
    [-.42,.44],[-.26,.44],[-.10,.44],
    [-.36,.58],[-.20,.58],
  ];
  beadPositions.forEach(([bx,by])=>{
    ctx.beginPath(); ctx.arc(cx+r*bx, cy+r*by, r*.07, 0, Math.PI*2);
    ctx.strokeStyle = g(.45); ctx.lineWidth = r*.02; ctx.stroke();
    ctx.fillStyle = g(.12); ctx.fill();
  });

  // ── Face profile (right side, facing right) ───────────
  ctx.strokeStyle = g(.55); ctx.lineWidth = r*.028; ctx.lineCap = 'round';
  // Forehead → nose bridge → nose tip
  ctx.beginPath();
  ctx.moveTo(cx+r*.08, cy-r*.62);
  ctx.bezierCurveTo(cx+r*.38,cy-r*.60, cx+r*.46,cy-r*.38, cx+r*.42,cy-r*.18);
  ctx.bezierCurveTo(cx+r*.46,cy-r*.02, cx+r*.38,cy+r*.06, cx+r*.30,cy+r*.10);
  ctx.stroke();
  // Lips / chin
  ctx.beginPath();
  ctx.moveTo(cx+r*.30, cy+r*.10);
  ctx.bezierCurveTo(cx+r*.38,cy+r*.22, cx+r*.28,cy+r*.36, cx+r*.10,cy+r*.44);
  ctx.bezierCurveTo(cx+r*.02,cy+r*.50, cx-r*.04,cy+r*.58, cx-r*.06,cy+r*.66);
  ctx.stroke();
  // Eyebrow
  ctx.lineWidth = r*.022;
  ctx.beginPath();
  ctx.moveTo(cx+r*.14, cy-r*.42);
  ctx.bezierCurveTo(cx+r*.26,cy-r*.48, cx+r*.40,cy-r*.40, cx+r*.40,cy-r*.32);
  ctx.stroke();
  // Eye
  ctx.beginPath();
  ctx.ellipse(cx+r*.28, cy-r*.28, r*.09, r*.055, -.15, 0, Math.PI*2);
  ctx.stroke();
  ctx.fillStyle = g(.4); ctx.fill();
  // Eyelid line
  ctx.beginPath();
  ctx.moveTo(cx+r*.19,cy-r*.28);
  ctx.bezierCurveTo(cx+r*.28,cy-r*.36, cx+r*.38,cy-r*.30, cx+r*.38,cy-r*.24);
  ctx.stroke();

  // ── Tear drop ─────────────────────────────────────────
  ctx.beginPath();
  ctx.moveTo(cx+r*.34, cy-r*.16);
  ctx.bezierCurveTo(cx+r*.32,cy, cx+r*.28,cy+r*.08, cx+r*.30,cy+r*.14);
  ctx.bezierCurveTo(cx+r*.32,cy+r*.20, cx+r*.38,cy+r*.18, cx+r*.38,cy+r*.12);
  ctx.bezierCurveTo(cx+r*.38,cy+r*.06, cx+r*.36,cy-r*.04, cx+r*.34,cy-r*.16);
  ctx.fillStyle = g(.55); ctx.fill();

  // ── Brand name ────────────────────────────────────────
  ctx.font = `bold ${r*.15}px 'Inter',Georgia,serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = g(.55);
  ctx.fillText('Larme De Sirène', cx, cy + r*.84);

  ctx.restore();
}
function roundRect(ctx,x,y,w,h,radius){
  ctx.beginPath();ctx.moveTo(x+radius,y);
  ctx.lineTo(x+w-radius,y);ctx.arcTo(x+w,y,x+w,y+radius,radius);
  ctx.lineTo(x+w,y+h-radius);ctx.arcTo(x+w,y+h,x+w-radius,y+h,radius);
  ctx.lineTo(x+radius,y+h);ctx.arcTo(x,y+h,x,y+h-radius,radius);
  ctx.lineTo(x,y+radius);ctx.arcTo(x,y,x+radius,y,radius);ctx.closePath();
}

function drawTray(){
  const S=TRAY_SIZE,cx=S/2,cy=S/2,tr=TR();
  trayCtx.clearRect(0,0,S,S);

  // Dish background (dark theme)
  const dg=trayCtx.createRadialGradient(cx-S*.07,cy-S*.07,0,cx,cy,S*.47);
  dg.addColorStop(0,'#2a1e08');dg.addColorStop(.7,'#181008');dg.addColorStop(1,'#0c0804');
  trayCtx.beginPath();trayCtx.arc(cx,cy,S*.47,0,Math.PI*2);
  trayCtx.fillStyle=dg;trayCtx.fill();
  trayCtx.strokeStyle='rgba(200,160,80,.3)';trayCtx.lineWidth=2;trayCtx.stroke();
  // Groove
  trayCtx.beginPath();trayCtx.arc(cx,cy,tr,0,Math.PI*2);
  trayCtx.strokeStyle='rgba(200,160,80,.12)';
  trayCtx.lineWidth=Math.max(4,(state.selectedSizeMm/state.wristMm)*tr*2.5+4);
  trayCtx.stroke();

  // Center logo
  drawTrayLogo(trayCtx,cx,cy,S*.14);

  const angles=calcAngles();

  // Draw empty (ghost) slots first
  const emptyAfterAngle=angles.length>0?angles[angles.length-1].endAngle:(-Math.PI/2);
  const emptySlots=calcEmptySlots(emptyAfterAngle);
  emptySlots.forEach((slot,i)=>{
    const bx=cx+Math.cos(slot.midAngle)*tr;
    const by=cy+Math.sin(slot.midAngle)*tr;
    const r=Math.max(6,Math.min(S*.09,(slot.sizeMm/16)*tr*.22));
    const isHov=(i===hoverIdx-state.placed.length);
    trayCtx.beginPath();trayCtx.arc(bx,by,r,0,Math.PI*2);
    trayCtx.strokeStyle=isHov?'rgba(200,128,74,.7)':'rgba(140,100,40,.3)';
    trayCtx.lineWidth=isHov?1.5:1;trayCtx.setLineDash([2.5,2.5]);trayCtx.stroke();trayCtx.setLineDash([]);
    if(isHov){trayCtx.fillStyle='rgba(200,128,74,.08)';trayCtx.fill();}
    // Size label
    trayCtx.font=`${Math.max(7,r*.55)}px sans-serif`;
    trayCtx.fillStyle='rgba(140,100,40,.55)';trayCtx.textAlign='center';trayCtx.textBaseline='middle';
    trayCtx.fillText(slot.sizeMm+'mm',bx,by);
  });

  // Draw placed beads
  angles.forEach(({midAngle,visR},i)=>{
    const bx=cx+Math.cos(midAngle)*tr;
    const by=cy+Math.sin(midAngle)*tr;
    const isHov=i===hoverIdx;
    const isSel=i===selectedPlacedIdx;
    drawBeadAt(trayCtx,bx,by,visR,state.placed[i].id,isHov,isSel);
  });
}

function drawBeadAt(ctx,cx,cy,r,id,hover,selected){
  const item=lookupItem(id);if(!item)return;
  // Shadow
  ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=r*.7;ctx.shadowOffsetY=r*.2;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#000';ctx.fill();ctx.restore();
  // Clip + draw content
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
  if(item.isAcc){
    // Accessory: colored disc with icon
    ctx.fillStyle=item.color||'#aaa';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    if(item.isCharm){
      ctx.font=`${r*1.1}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillText(item.icon,cx,cy);
    } else {
      // Spacer: concentric rings
      ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=r*.25;
      ctx.beginPath();ctx.arc(cx,cy,r*.65,0,Math.PI*2);ctx.stroke();
    }
  } else {
    const img=loadedImgs[id];
    if(img){
      const s=r*2.3;
      try{ctx.drawImage(img,cx-s/2,cy-s/2,s,s);}catch(e){drawGradBead(ctx,cx,cy,r,item);}
      const edge=ctx.createRadialGradient(cx,cy,r*.38,cx,cy,r);
      edge.addColorStop(0,'rgba(0,0,0,0)');edge.addColorStop(1,'rgba(0,0,0,.52)');
      ctx.fillStyle=edge;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    } else { drawGradBead(ctx,cx,cy,r,item); }
  }
  ctx.restore();
  // Specular highlight
  const hl=ctx.createRadialGradient(cx-r*.32,cy-r*.38,0,cx-r*.14,cy-r*.22,r*.62);
  hl.addColorStop(0,'rgba(255,255,255,.88)');hl.addColorStop(.32,'rgba(255,255,255,.32)');hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=hl;ctx.fill();
  // Selection / hover ring
  if(selected||hover){
    ctx.beginPath();ctx.arc(cx,cy,r+2,0,Math.PI*2);
    ctx.strokeStyle=selected?'rgba(200,128,74,1)':'rgba(200,128,74,.6)';
    ctx.lineWidth=selected?2.5:1.5;ctx.stroke();
  }
}
function drawGradBead(ctx,cx,cy,r,bead){
  const{g,alpha}=bead.tray||{g:['#eee','#aaa','#666','#333'],alpha:1};
  const grad=ctx.createRadialGradient(cx-r*.37,cy-r*.42,r*.04,cx,cy,r);
  grad.addColorStop(0,g[0]);grad.addColorStop(.33,g[1]);grad.addColorStop(.7,g[2]);grad.addColorStop(1,g[3]);
  ctx.globalAlpha=alpha??1;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();ctx.globalAlpha=1;
}

// ── Hit detection (arc-based) ──────────────────────────────
function getXY(e){
  const rect=trayC.getBoundingClientRect(),sc=TRAY_SIZE/rect.width;
  if(e.touches)return{x:(e.touches[0].clientX-rect.left)*sc,y:(e.touches[0].clientY-rect.top)*sc};
  return{x:(e.clientX-rect.left)*sc,y:(e.clientY-rect.top)*sc};
}

function hitTest(x,y){
  const cx=TRAY_SIZE/2,cy=TRAY_SIZE/2,tr=TR();
  const dx=x-cx,dy=y-cy,dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<tr*.6||dist>tr*1.4)return-1;
  let clickAngle=Math.atan2(dy,dx);

  // Check placed beads
  const angles=calcAngles();
  for(let i=0;i<angles.length;i++){
    let diff=clickAngle-angles[i].midAngle;
    while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;
    if(Math.abs(diff)<=angles[i].arc/2*1.1)return i;
  }
  // Check empty slots
  const emptyAfter=angles.length>0?angles[angles.length-1].endAngle:-Math.PI/2;
  const emptySlots=calcEmptySlots(emptyAfter);
  for(let i=0;i<emptySlots.length;i++){
    let diff=clickAngle-emptySlots[i].midAngle;
    while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;
    if(Math.abs(diff)<=emptySlots[i].arc/2*1.1)return state.placed.length+i;
  }
  return-1;
}

// ── Tray interaction ───────────────────────────────────────
function handleTrayClick(x,y){
  const idx=hitTest(x,y);
  if(idx<0){selectedPlacedIdx=-1;drawTray();return;}
  if(idx<state.placed.length){
    // Placed bead tapped
    if(state.selectedId){
      // Replace with selected
      pushHistory();
      state.placed[idx]={id:state.selectedId,sizeMm:state.selectedSizeMm};
      selectedPlacedIdx=-1;
    } else {
      // Select/deselect placed bead
      selectedPlacedIdx=selectedPlacedIdx===idx?-1:idx;
    }
  } else {
    // Empty slot
    if(state.selectedId&&remainingMm()>=state.selectedSizeMm){
      pushHistory();
      const emptySlotLocalIdx=idx-state.placed.length;
      // Insert at the correct position in the ordered array
      // Insert after all currently placed beads (append), maintaining arc order
      state.placed.push({id:state.selectedId,sizeMm:state.selectedSizeMm});
      selectedPlacedIdx=-1;
    }
  }
  redraw();
}

trayC.addEventListener('mousemove',e=>{const{x,y}=getXY(e);const i=hitTest(x,y);hoverIdx=i;drawTray();});
trayC.addEventListener('mouseleave',()=>{hoverIdx=-1;drawTray();});
trayC.addEventListener('click',e=>{const{x,y}=getXY(e);handleTrayClick(x,y);});
trayC.addEventListener('contextmenu',e=>{
  e.preventDefault();const{x,y}=getXY(e);const idx=hitTest(x,y);
  if(idx>=0&&idx<state.placed.length){pushHistory();state.placed.splice(idx,1);selectedPlacedIdx=-1;redraw();}
});
// Long-press on mobile to remove
let longT=null,touchMoved=false;
trayC.addEventListener('touchstart',e=>{touchMoved=false;const{x,y}=getXY(e);const idx=hitTest(x,y);
  if(idx>=0&&idx<state.placed.length){longT=setTimeout(()=>{if(!touchMoved){pushHistory();state.placed.splice(idx,1);selectedPlacedIdx=-1;redraw();}},600);}
},{passive:true});
trayC.addEventListener('touchmove',()=>{touchMoved=true;},{passive:true});
trayC.addEventListener('touchend',()=>clearTimeout(longT),{passive:true});

// Desktop drag-and-drop onto tray
trayC.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';const{x,y}=getXY(e);hoverIdx=hitTest(x,y);drawTray();});
trayC.addEventListener('dragleave',()=>{hoverIdx=-1;drawTray();});
trayC.addEventListener('drop',e=>{
  e.preventDefault();
  const data=JSON.parse(e.dataTransfer.getData('itemData')||'null');
  if(!data)return;
  const{x,y}=getXY(e);const idx=hitTest(x,y);
  const sizeMm=data.sizeMm||state.selectedSizeMm;
  if(idx>=0&&idx<state.placed.length){
    pushHistory();state.placed[idx]={id:data.id,sizeMm};
  } else if(remainingMm()>=sizeMm){
    pushHistory();state.placed.push({id:data.id,sizeMm});
  }
  hoverIdx=-1;redraw();
});

function redraw(){drawTray();updateUI();if(state.rendered)buildBracelet();}

const threeC=document.getElementById('threeCanvas');
const renderer=new THREE.WebGLRenderer({canvas:threeC,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();scene.background=new THREE.Color(0x14100c);
const camera=new THREE.PerspectiveCamera(45,1,.1,1000);camera.position.set(0,30,80);
const controls=new OrbitControls(camera,threeC);
controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=30;controls.maxDistance=250;
controls.autoRotate=true;controls.autoRotateSpeed=1.2;controls.target.set(0,0,0);

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment()).texture;
scene.add(new THREE.AmbientLight(0xfff8f0,.45));
const key=new THREE.DirectionalLight(0xfff5e8,3);key.position.set(40,70,50);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.bias=-.001;scene.add(key);
scene.add(Object.assign(new THREE.DirectionalLight(0xe0e8ff,.9),{position:new THREE.Vector3(-50,30,-40)}));
scene.add(Object.assign(new THREE.PointLight(0xffeedd,1,200),{position:new THREE.Vector3(0,60,-60)}));

const ground=new THREE.Mesh(new THREE.CircleGeometry(120,64),new THREE.MeshPhysicalMaterial({color:0x1e1610,roughness:.9}));
ground.rotation.x=-Math.PI/2;ground.position.y=-1;ground.receiveShadow=true;scene.add(ground);
const wrist=new THREE.Mesh(new THREE.CylinderGeometry(WRIST_R,WRIST_R+2,90,48),new THREE.MeshPhysicalMaterial({color:0xc0987a,roughness:.65}));
wrist.rotation.z=Math.PI/2;wrist.receiveShadow=true;wrist.castShadow=true;wrist.visible=false;scene.add(wrist);

let braceletGroup=null;const matCache={};

function getMat(id){
  if(matCache[id])return matCache[id];
  const b=BEADS.find(x=>x.id===id);if(!b)return new THREE.MeshStandardMaterial({color:0x888});
  const{m3,special}=b;
  let map=null;
  if(special==='goldstone_blue')map=texGoldstone(true);
  else if(special==='goldstone_red')map=texGoldstone(false);
  else if(special==='tigers_eye')map=texTigersEye();
  else if(special==='lapis')map=texLapis();
  else if(special==='malachite')map=texMalachite();
  else if(special==='agate_red')map=texRedAgate();
  else if(special==='labradorite')map=texLabradorite();
  else if(special==='rutile_gold')map=texRutileGold();
  if(!map&&BEAD_PHOTOS[id]){
    if(loadedTex[id])map=loadedTex[id];
    else{const t=new THREE.TextureLoader().load(BEAD_PHOTOS[id]);t.wrapS=t.wrapT=THREE.RepeatWrapping;loadedTex[id]=t;map=t;}
  }
  const p={color:m3.color,roughness:m3.roughness??0,metalness:m3.metalness??0,envMapIntensity:m3.envI??1.5};
  if(m3.transmission>0){p.transmission=m3.transmission;p.transparent=true;p.ior=m3.ior??1.5;p.thickness=m3.thick??8;
    if(m3.att){p.attenuationColor=new THREE.Color(m3.att);p.attenuationDistance=m3.attD??20;}}
  if(map)p.map=map;
  return matCache[id]=new THREE.MeshPhysicalMaterial(p);
}

function mkBeadMesh3D(id,radiusMm){
  const r=radiusMm,seg=r>5?32:24;
  const acc=ACCESSORIES.find(a=>a.id===id);
  if(acc){
    if(acc.isCharm){
      const g=new THREE.Group();
      const disc=new THREE.Mesh(new THREE.CylinderGeometry(r*.7,r*.7,r*.3,24),new THREE.MeshPhysicalMaterial({color:acc.metalColor||0xdddddd,metalness:.9,roughness:.1}));
      g.add(disc);return g;
    }
    // Spacer
    const m=new THREE.Mesh(new THREE.CylinderGeometry(r*.85,r*.85,r*.35,24),new THREE.MeshPhysicalMaterial({color:acc.metalColor||0xcccccc,metalness:.88,roughness:.08}));
    return m;
  }
  const b=BEADS.find(x=>x.id===id);if(!b)return null;
  if(b.special==='phantom_green'){
    const g=new THREE.Group();
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg),getMat(id)));
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r*.68,20,20),new THREE.MeshPhysicalMaterial({map:texPhantomGreen(),transparent:true,opacity:.72,roughness:.3})));
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r*.52,18,18),new THREE.MeshPhysicalMaterial({map:texWispGreen(),transparent:true,opacity:.6,roughness:.4,emissive:new THREE.Color(0x082810),emissiveIntensity:.45})));
    return g;
  }
  if(b.special==='moonstone'){
    const g=new THREE.Group();
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg),getMat(id)));
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r*.95,seg,seg),new THREE.MeshPhysicalMaterial({color:0x7088ff,transparent:true,opacity:.18,roughness:.0,transmission:.25,ior:1.4,emissive:new THREE.Color(0x1828b8),emissiveIntensity:.12})));
    return g;
  }
  if(b.special==='strawberry'){
    const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg),getMat(id)));
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r*.72,20,20),new THREE.MeshPhysicalMaterial({map:texStrawberry(),transparent:true,opacity:.55,roughness:.2})));return g;
  }
  if(b.special==='rutile_gold'){
    const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg),getMat(id)));
    g.add(new THREE.Mesh(new THREE.SphereGeometry(r*.65,18,18),new THREE.MeshPhysicalMaterial({map:texRutileGold(),transparent:true,opacity:.65,roughness:.15,emissive:new THREE.Color(0x281800),emissiveIntensity:.5})));return g;
  }
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg),getMat(id));
  m.castShadow=true;m.receiveShadow=true;return m;
}

function buildBracelet(){
  if(braceletGroup)scene.remove(braceletGroup);
  braceletGroup=new THREE.Group();
  const total=state.wristMm;
  const bracR=state.viewMode==='wrist'?WRIST_R+8:usedMm()/(2*Math.PI)||30;
  let angle=0;
  for(const b of state.placed){
    const arc=(b.sizeMm/total)*Math.PI*2;
    const mid=angle+arc/2;
    const x=Math.cos(mid)*bracR,z=Math.sin(mid)*bracR;
    const mesh=mkBeadMesh3D(b.id,b.sizeMm/2);
    if(!mesh){angle+=arc;continue;}
    mesh.position.set(x,0,z);mesh.rotation.y=mid+Math.PI/2;
    braceletGroup.add(mesh);
    angle+=arc;
  }
  if(state.placed.length>0){
    const pts=[];for(let i=0;i<=64;i++){const a=(i/64)*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*bracR,0,Math.sin(a)*bracR));}
    braceletGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,true),128,1.2,8,true),new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:.9})));
  }
  scene.add(braceletGroup);
  updateCamera();state.rendered=true;
}

function updateCamera(){
  const bracR=state.viewMode==='wrist'?WRIST_R+12:Math.max(20,usedMm()/(2*Math.PI));
  if(state.viewMode==='wrist'){
    camera.position.set(bracR*1.8,bracR*1.0,bracR*2.2);
    wrist.visible=true;ground.visible=false;controls.autoRotateSpeed=.8;
  } else {
    camera.position.set(0,bracR*0.55,bracR*2.4);
    wrist.visible=false;ground.visible=true;controls.autoRotateSpeed=.5;
  }
  controls.target.set(0,0,0);controls.update();
}

function resizeRenderer(){
  const el=document.getElementById('preview3D');
  const W=el.clientWidth,H=el.clientHeight-48-40;
  if(W<1||H<1)return;
  renderer.setSize(W,Math.max(H,100));
  camera.aspect=W/Math.max(H,1);camera.updateProjectionMatrix();
}

function open3D(){
  buildBracelet();
  const ov=document.getElementById('preview3D');ov.classList.add('open');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{resizeRenderer();updateCamera();controls.update();renderer.render(scene,camera);}));
}

function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
animate();

function mkIcon(item,size=40){
  const c=document.createElement('canvas');c.width=c.height=size;
  const ctx=c.getContext('2d'),r=size/2-1,cx=size/2,cy=size/2;
  if(item.isAcc){
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=item.color||'#aaa';ctx.fill();
    ctx.font=`${size*.55}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillText(item.icon,cx,cy);
    return c;
  }
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
  const img=loadedImgs[item.id];
  if(img){try{ctx.drawImage(img,0,0,size,size);}catch(e){drawGradBead(ctx,cx,cy,r,item);}
    const edge=ctx.createRadialGradient(cx,cy,r*.38,cx,cy,r);edge.addColorStop(0,'rgba(0,0,0,0)');edge.addColorStop(1,'rgba(0,0,0,.48)');
    ctx.fillStyle=edge;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  } else {drawGradBead(ctx,cx,cy,r,item);}
  ctx.restore();
  const hl=ctx.createRadialGradient(cx-r*.32,cy-r*.38,0,cx-r*.14,cy-r*.2,r*.55);
  hl.addColorStop(0,'rgba(255,255,255,.82)');hl.addColorStop(.35,'rgba(255,255,255,.28)');hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=hl;ctx.fill();
  return c;
}

function buildPalette(){
  const strip=document.getElementById('beadStrip');strip.innerHTML='';
  BEADS.forEach(b=>{
    const btn=document.createElement('div');btn.className='bead-btn';btn.dataset.id=b.id;
    btn.appendChild(mkIcon(b,38));
    const lbl=document.createElement('span');lbl.textContent=b.name;btn.appendChild(lbl);
    btn.addEventListener('click',()=>selectItem(b.id,b.cat==='crystal'||b.cat==='opaque'));
    btn.draggable=true;
    btn.addEventListener('dragstart',e=>{e.dataTransfer.setData('itemData',JSON.stringify({id:b.id,sizeMm:state.selectedSizeMm}));e.dataTransfer.effectAllowed='copy';selectItem(b.id,true);});
    strip.appendChild(btn);
  });
}

function buildAccPane(){
  const pane=document.getElementById('accPane');pane.innerHTML='';
  ACCESSORIES.forEach(a=>{
    const card=document.createElement('div');card.className='acc-card';card.dataset.id=a.id;
    const icon=document.createElement('div');icon.className='acc-icon';icon.textContent=a.icon;
    card.appendChild(icon);
    const lbl=document.createElement('span');lbl.textContent=`${a.name}`;card.appendChild(lbl);
    const szlbl=document.createElement('span');szlbl.textContent=`占位 ${a.sizeMm}mm`;szlbl.style.color='var(--accent)';card.appendChild(szlbl);
    card.addEventListener('click',()=>selectItem(a.id,false,a.sizeMm));
    card.draggable=true;
    card.addEventListener('dragstart',e=>{e.dataTransfer.setData('itemData',JSON.stringify({id:a.id,sizeMm:a.sizeMm}));e.dataTransfer.effectAllowed='copy';selectItem(a.id,false,a.sizeMm);});
    pane.appendChild(card);
  });
}

function buildSizes(){
  const strip=document.getElementById('sizeStrip');strip.innerHTML='';
  SIZES.forEach(s=>{
    const btn=document.createElement('button');btn.className='sbtn'+(s===state.selectedSizeMm?' active':'');
    btn.textContent=s+'mm';
    btn.addEventListener('click',()=>{state.selectedSizeMm=s;buildSizes();drawTray();});
    strip.appendChild(btn);
  });
}

function selectItem(id,useSelectedSize=true,fixedSize=null){
  const sizeMm=fixedSize||state.selectedSizeMm;
  state.selectedId=state.selectedId===id?null:id;
  if(fixedSize&&state.selectedId)state.selectedSizeMm=fixedSize;
  document.querySelectorAll('.bead-btn,.acc-card').forEach(b=>b.classList.toggle('selected',b.dataset.id===state.selectedId));
}

// ── Summary panel ──────────────────────────────────────────
function openSummary(){
  const list=document.getElementById('summaryList');
  list.innerHTML='';
  // Group by id + sizeMm
  const groups={};
  state.placed.forEach(b=>{
    const key=`${b.id}__${b.sizeMm}`;
    if(!groups[key])groups[key]={id:b.id,sizeMm:b.sizeMm,count:0};
    groups[key].count++;
  });
  Object.values(groups).sort((a,b)=>b.count-a.count).forEach(g=>{
    const item=lookupItem(g.id);if(!item)return;
    const row=document.createElement('div');row.className='summary-row';
    // Swatch
    const sw=document.createElement('canvas');sw.width=sw.height=28;sw.className='summary-swatch';
    const ctx=sw.getContext('2d');
    if(item.isAcc){ctx.beginPath();ctx.arc(14,14,13,0,Math.PI*2);ctx.fillStyle=item.color||'#aaa';ctx.fill();ctx.font='14px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(item.icon,14,14);}
    else{const img=loadedImgs[g.id];if(img){ctx.save();ctx.beginPath();ctx.arc(14,14,13,0,Math.PI*2);ctx.clip();try{ctx.drawImage(img,0,0,28,28);}catch(e){}ctx.restore();}else drawGradBead(ctx,14,14,13,item);}
    row.appendChild(sw);
    const name=document.createElement('span');name.className='summary-name';name.textContent=item.name;row.appendChild(name);
    const meta=document.createElement('span');meta.className='summary-meta';meta.textContent=`${g.sizeMm}mm`;row.appendChild(meta);
    const cnt=document.createElement('span');cnt.className='summary-count';cnt.textContent=`×${g.count}`;row.appendChild(cnt);
    list.appendChild(row);
  });
  if(state.placed.length===0){list.innerHTML='<p style="color:var(--muted);font-size:13px;padding:8px 0">暂无珠子，请在制作盘上放置</p>';}
  const used=usedMm(),total=state.wristMm;
  document.getElementById('summaryTotal').innerHTML=
    `共 <strong>${state.placed.length}</strong> 颗 &nbsp;·&nbsp; 已占用 <strong>${used}mm</strong> / ${total}mm &nbsp;·&nbsp; 剩余 <strong>${total-used}mm</strong>`;
  document.getElementById('summaryOverlay').classList.add('open');
}
document.getElementById('summaryBtn').addEventListener('click',openSummary);

  document.getElementById('beadCountLbl').textContent=`${n}颗 | 已用${usedMm()}mm / ${state.wristMm}mm`;

}
